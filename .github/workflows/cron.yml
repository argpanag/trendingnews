name: Hourly Trends Ingest

on:
  schedule:
    - cron: '0 * * * *'  # every hour UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, dom, curl, json
          coverage: none

      - name: Run trends scraper for tier-1 countries
        run: |
          for country in US GB DE FR JP; do
            echo "=== Scraping $country ==="
            php api/trends_scraper.php --country=$country || true
            sleep 5
          done

      - name: Run trends scraper for tier-2 countries
        run: |
          for country in AU CA IT ES BR IN KR MX NL SE; do
            echo "=== Scraping $country ==="
            php api/trends_scraper.php --country=$country || true
            sleep 3
          done

      - name: Run trends scraper for tier-3 countries
        run: |
          for country in PL PT CH AT BE DK NO FI IE NZ SG HK TW TH VN ID MY PH CZ RO HU BG HR SK SI LT LV EE; do
            echo "=== Scraping $country ==="
            php api/trends_scraper.php --country=$country || true
            sleep 2
          done

      - name: Rebuild index and articles
        run: |
          php api/build_index.php
          php api/rebuild_articles.php

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: trends update $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || echo "No changes to push"
