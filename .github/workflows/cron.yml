name: Hourly Ingest Cron

on:
  schedule:
    - cron: '0 * * * *'  # every hour UTC
  workflow_dispatch:     # allow manual run

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install deps
        run: npm ci --ignore-scripts || npm install

      - name: Ingest from API -> SQLite -> JSON
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          node scripts/ingest.js
          node scripts/export.js
          echo "Generated at $(date -u)"
          ls -lh data/

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/articles.db || true
          git diff --cached --quiet || git commit -m "chore: hourly ingest $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || echo "No changes to push"
