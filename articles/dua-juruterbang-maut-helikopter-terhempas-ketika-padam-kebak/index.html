t;,&quot;height&quot;:&quot;675&quot;,&quot;url&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/hm22imaj1x_1790037053.jpg&quot;,&quot;caption&quot;:&quot;KEBAKARAN hutan di Taman Negara Yosemite yang dirakam pada 16 Sept. FOTO ALERTCalifornia\/UC San Diego\/ Reuters.&quot;,&quot;gn4id&quot;:&quot;hm-73663802&quot;}],&quot;field_article_videos&quot;:null,&quot;field_image_listing_featured_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/fg2mauts-o_HMfield_image_listing_featured_v2.var_1790037060.jpg&quot;,&quot;field_image_listing_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/fg2mauts-o_HMfield_image_listing_v2.var_1790037063.jpg&quot;,&quot;field_image_socialmedia&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/fg2mauts-o_HMfield_image_socialmedia.var_1790037062.jpg&quot;,&quot;field_image_slider&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/fg2mauts-o_HMfield_image_slider_v2.var_1790037059.jpg&quot;,&quot;field_image_variasi&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/fg2mauts-o_HMfield_image_variasi_v2.var_1790037060.jpg&quot;,&quot;field_image_listing_featured&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/fg2mauts-o_HMfield_image_listing_featured_v2.var_1790037060.jpg&quot;,&quot;field_image_listing_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/fg2mauts-o_HMfield_image_listing_th.var_1790037055.jpg&quot;,&quot;field_image_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/fg2mauts-o_HMfield_image_th_v2.var_1790037061.jpg&quot;,&quot;field_article_state&quot;:null,&quot;field_article_lead&quot;:&quot;San Diego: Dua juruterbang maut selepas helikopter mereka terhempas pada petang Ahad ketika operasi melepaskan air bagi memadamkan kebakaran hutan di Taman Negara Yosemite, California, menurut pihak berkuasa semalam.&quot;,&quot;body&quot;:&quot;&lt;p \/&gt;&lt;p&gt;San Diego: Dua juruterbang maut selepas helikopter mereka terhempas pada petang Ahad ketika operasi melepaskan air bagi memadamkan kebakaran hutan di Taman Negara Yosemite, California, menurut pihak berkuasa semalam.&lt;\/p&gt;&lt;p&gt; Bahagian Perhutanan dan Perlindungan Kebakaran Alaska dalam kenyataan memaklumkan salah seorang juruterbang terkorban adalah Greg King yang bertugas bagi syarikat Precision. &lt;\/p&gt;&lt;p&gt; Identiti juruterbang kedua tidak didedahkan kerana ahli keluarga masih dalam proses dimaklumkan, kata agensi tersebut.&lt;\/p&gt;&lt;p&gt; Menurut Connie Lau, jurucakap pasukan California yang menyelaras usaha menangani kebakaran berkenaan, kedua-dua juruterbang itu sedang menjalankan operasi melepaskan air di kawasan kebakaran 'Dome Fire' apabila helikopter Super Puma mereka terhempas di bahagian tenggara Tasik Ostrander.&lt;\/p&gt;&lt;p&gt; Punca nahas sedang disiasat oleh Pentadbiran Penerbangan Persekutuan (FAA) dan Lembaga Keselamatan Pengangkutan Kebangsaan (NTSB).&lt;\/p&gt;&lt;p&gt; Kematian itu menjadikan jumlah keseluruhan juruterbang helikopter yang terkorban dalam nahas ketika memadamkan kebakaran hutan di Colorado, Utah dan California pada tahun ini meningkat kepada lima orang.&lt;\/p&gt;&lt;p&gt; Amerika Syarikat (AS) kini berdepan kebakaran yang teruk berikutan paras salji musim sejuk yang sangat rendah, suhu yang mencatat rekod tertinggi serta kemarau yang berlarutan selama beberapa dekad di wilayah barat negara itu.&lt;\/p&gt;&lt;p&gt; Sekurang-kurangnya 18 orang telah terkorban semasa memadamkan kebakaran hutan di AS setakat tahun ini 2026, menurut data daripada agensi persekutuan &lt;em&gt;Wildland Fire Lessons Learned&lt;\/em&gt;, manakala data Pusat Kebakaran Antara Agensi Kebangsaan (NIFC) menyimpulkan angka itu melebihi purata tahunan sebanyak 17 kematian yang direkodkan sejak beberapa dekad kebelakangan ini.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;body_with_inline&quot;:&quot;&lt;div itemprop=\&quot;articleBody\&quot; class=\&quot;dable-content-wrapper\&quot;&gt;&lt;p&gt;San Diego: Dua juruterbang maut selepas helikopter mereka terhempas pada petang Ahad ketika operasi melepaskan air bagi memadamkan kebakaran hutan di Taman Negara Yosemite, California, menurut pihak berkuasa semalam.&lt;\/p&gt;\n&lt;p&gt; Bahagian Perhutanan dan Perlindungan Kebakaran Alaska dalam kenyataan memaklumkan salah seorang juruterbang terkorban adalah Greg King yang bertugas bagi syarikat Precision. &lt;\/p&gt;\n&lt;p&gt; Identiti juruterbang kedua tidak didedahkan kerana ahli keluarga masih dalam proses dimaklumkan, kata agensi tersebut.&lt;\/p&gt;\n&lt;p&gt; Menurut Connie Lau, jurucakap pasukan California yang menyelaras usaha menangani kebakaran berkenaan, kedua-dua juruterbang itu sedang menjalankan operasi melepaskan air di kawasan kebakaran 'Dome Fire' apabila helikopter Super Puma mereka terhempas di bahagian tenggara Tasik Ostrander.&lt;\/p&gt;\n&lt;p&gt; Punca nahas sedang disiasat oleh Pentadbiran Penerbangan Persekutuan (FAA) dan Lembaga Keselamatan Pengangkutan Kebangsaan (NTSB).&lt;\/p&gt;\n&lt;p&gt; Kematian itu menjadikan jumlah keseluruhan juruterbang helikopter yang terkorban dalam nahas ketika memadamkan kebakaran hutan di Colorado, Utah dan California pada tahun ini meningkat kepada lima orang.&lt;\/p&gt;\n&lt;p&gt; Amerika Syarikat (AS) kini berdepan kebakaran yang teruk berikutan paras salji musim sejuk yang sangat rendah, suhu yang mencatat rekod tertinggi serta kemarau yang berlarutan selama beberapa dekad di wilayah barat negara itu.&lt;\/p&gt;\n&lt;p&gt; Sekurang-kurangnya 18 orang telah terkorban semasa memadamkan kebakaran hutan di AS setakat tahun ini 2026, menurut data daripada agensi persekutuan &lt;em&gt;Wildland Fire Lessons Learned&lt;\/em&gt;, manakala data Pusat Kebakaran Antara Agensi Kebangsaan (NIFC) menyimpulkan angka itu melebihi purata tahunan sebanyak 17 kematian yang direkodkan sejak beberapa dekad kebelakangan ini.&lt;\/p&gt;\n&lt;\/div&gt;&quot;,&quot;word_count&quot;:221,&quot;og_description&quot;:&quot;San Diego: Dua juruterbang maut selepas helikopter mereka terhempas pada petang Ahad ketika operasi melepaskan air bagi memadamkan kebakaran hutan di Taman Negara Yosemite, California, menurut pihak berkuasa semalam.&quot;}" :nid="1413690" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_instream_player&amp;description_url=https%3A%2F%2Fwww.hmetro.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;vid_d=6000&amp;unviewed_position_start=1&amp;output=xml_vast2&amp;ad_rule=1&amp;env=vp&amp;impl=s&amp;correlator=" :is-sponsered="false"></article-component>
