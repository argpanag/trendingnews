;uuid&quot;:&quot;a554bdb2-de2b-4bbb-9dd1-ca1c1a782aab&quot;,&quot;rdf_mapping&quot;:[],&quot;alt&quot;:&quot;&quot;,&quot;title&quot;:&quot;&quot;,&quot;width&quot;:&quot;1200&quot;,&quot;height&quot;:&quot;811&quot;,&quot;url&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/por_1794695906.jpg&quot;,&quot;caption&quot;:&quot;BARISAN pemain serta jurulatih Portugal, Jorge Jesus dilihat kecewa selepat tamat perlawanan. FOTO REUTERS&quot;,&quot;gn4id&quot;:&quot;hm-75172713&quot;}],&quot;field_article_videos&quot;:null,&quot;field_image_listing_featured_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-por151126_HMfield_image_listing_featured_v2.var_1794695914.jpg&quot;,&quot;field_image_listing_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-por151126_HMfield_image_listing_v2.var_1794695916.jpg&quot;,&quot;field_image_socialmedia&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-por151126_HMfield_image_socialmedia.var_1794695915.jpg&quot;,&quot;field_image_slider&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-por151126_HMfield_image_slider_v2.var_1794695912.jpg&quot;,&quot;field_image_variasi&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-por151126_HMfield_image_variasi_v2.var_1794695913.jpg&quot;,&quot;field_image_listing_featured&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-por151126_HMfield_image_listing_featured_v2.var_1794695914.jpg&quot;,&quot;field_image_listing_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-por151126_HMfield_image_listing_th.var_1794695909.jpg&quot;,&quot;field_image_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-por151126_HMfield_image_th_v2.var_1794695915.jpg&quot;,&quot;field_article_state&quot;:null,&quot;field_article_lead&quot;:&quot;Braga: Portugal dimalukan 1-4 oleh Denmark di pentas Liga Negara-Negara awal pagi tadi, sekali gus mencalar aksi pertama mereka tanpa kelibat Cristiano Ronaldo selepas penyerang sensasi itu mengumumkan persaraan daripada bola sepak antarabangsa.&quot;,&quot;body&quot;:&quot;&lt;p \/&gt;&lt;p&gt;Braga: Portugal dimalukan 1-4 oleh Denmark di pentas Liga Negara-Negara awal pagi tadi, sekali gus mencalar aksi pertama mereka tanpa kelibat Cristiano Ronaldo selepas penyerang sensasi itu mengumumkan persaraan daripada bola sepak antarabangsa.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Rasmus Hojlund mencuri tumpuan menerusi dua jaringan menarik apabila Denmark melonjak ke tangga kedua Kumpulan A4 dan semakin hampir mengesahkan tempat ke suku akhir hasil persembahan cemerlang di Braga.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Denmark kini mengumpul sembilan mata daripada lima perlawanan, ketinggalan tiga mata di belakang Portugal yang sudah mengesahkan kemaraan ke kelompok lapan terbaik selepas memenangi kesemua empat aksi terdahulu dalam kumpulan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Keputusan seri menentang pasukan di tangga ketiga, Norway sebelum ini sudah memadai buat Denmark untuk mara. Norway sebelum itu menewaskan Wales 3-1.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Tiada malam yang perlu dilupakan kerana ini adalah malam untuk kami belajar dan melihat kesilapan yang dilakukan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Denmark juga sangat klinikal apabila mereka berjaya menjaringkan gol menerusi peluang yang dimiliki. Ini adalah perlawanan yang akhirnya tidak memihak kepada kami,\&quot; kata pemain tengah Portugal, Bruno Fernandes.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Sebelum sepak mula, Portugal mengadakan penghormatan khas buat Ronaldo yang mengumumkan persaraannya daripada pentas antarabangsa minggu lalu apabila pemain dan maskot pasukan memasuki padang dengan memakai jersi tertera nama serta nombor tujuh milik bintang itu.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Penyokong turut membentangkan sepanduk besar tertera tulisan 'Terima kasih kapten' ketika kedua-dua pasukan memasuki padang, manakala sorakan dan tepukan gemuruh bergema di seluruh stadium sebaik jam perlawanan menunjukkan minit ketujuh.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Ronaldo membuat penampilan sulung bersama Portugal pada 2003 sebelum mencipta rekod dunia dari segi jaringan dan penampilan dalam bola sepak antarabangsa apabila meledak 146 gol dalam 234 perlawanan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kemuncak karier antarabangsanya adalah ketika membantu Portugal menjuarai Euro 2016, namun pengakhiran kariernya bersama pasukan kebangsaan dicemari perselisihan dengan jurulatih Portugal, Jorge Jesus, selepas tidak disenaraikan bagi aksi Liga Negara-Negara pada September ketika berusia 41 tahun.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Pertelingkahan itu menyebabkan pemenang lima kali Ballon d'Or berkenaan dikenakan penggantungan selama 30 hari oleh Persekutuan Bola Sepak Portugal sebelum mengambil keputusan bersara daripada pentas antarabangsa.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Portugal jelas merindui sentuhan Ronaldo apabila mempamerkan aksi hambar dalam perlawanan berkenaan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Denmark menguasai permainan sejak minit pertama dan tidak mengejutkan apabila pasukan pelawat menuju ke bilik persalinan dengan kelebihan satu gol menerusi sepakan penalti Pierre-Emile Hojbjerg pada minit ke-43.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Hojlund kemudian meledak voli menarik hanya empat minit selepas babak kedua bermula sebelum sekali lagi mengejutkan penyokong tuan rumah tujuh minit kemudian menerusi jaringan yang mengingatkan kepada kehebatan Ronaldo.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Penyerang Napoli itu memperdaya Ruben Dias sebelum melepaskan rembatan kencang dari luar kotak penalti untuk menambah jaringan kedua peribadinya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Sorakan tidak puas hati serta siulan mula kedengaran di Estadio Municipal apabila Joachim Andersen menanduk masuk gol keempat Denmark, manakala jaringan sagu hati Bernardo Silva pada penghujung perlawanan gagal meredakan kekecewaan penyokong tuan rumah.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Sementara itu, Antonio Nusa membuka jaringan buat Norway menerusi rembatan rendah menarik sejurus sebelum sejam permainan berlangsung di Oslo.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Andreas Schjelderup kemudian menyudahkan hantaran lintang rendah Erling Haaland sebelum penyerang Manchester City itu melengkapkan kemenangan menerusi sepakan penalti dua minit sebelum tamat perlawanan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Wales sempat menghidupkan peluang untuk mendapatkan keputusan positif apabila David Brooks merapatkan jurang menerusi penyudah cantik pada minit ke-79.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Bagaimanapun, skuad kendalian Craig Bellamy itu bakal menamatkan saingan di kedudukan tercorot kumpulan dan berdepan risiko diturunkan ke Liga B.&lt;\/p&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;body_with_inline&quot;:&quot;&lt;div itemprop=\&quot;articleBody\&quot; class=\&quot;dable-content-wrapper\&quot;&gt;&lt;p&gt;Braga: Portugal dimalukan 1-4 oleh Denmark di pentas Liga Negara-Negara awal pagi tadi, sekali gus mencalar aksi pertama mereka tanpa kelibat Cristiano Ronaldo selepas penyerang sensasi itu mengumumkan persaraan daripada bola sepak antarabangsa.&lt;\/p&gt;\n&lt;p&gt;Rasmus Hojlund mencuri tumpuan menerusi dua jaringan menarik apabila Denmark melonjak ke tangga kedua Kumpulan A4 dan semakin hampir mengesahkan tempat ke suku akhir hasil persembahan cemerlang di Braga.&lt;\/p&gt;\n&lt;p&gt;Denmark kini mengumpul sembilan mata daripada lima perlawanan, ketinggalan tiga mata di belakang Portugal yang sudah mengesahkan kemaraan ke kelompok lapan terbaik selepas memenangi kesemua empat aksi terdahulu dalam kumpulan.&lt;\/p&gt;\n&lt;p&gt;Keputusan seri menentang pasukan di tangga ketiga, Norway sebelum ini sudah memadai buat Denmark untuk mara. Norway sebelum itu menewaskan Wales 3-1.&lt;\/p&gt;\n&lt;p&gt;\&quot;Tiada malam yang perlu dilupakan kerana ini adalah malam untuk kami belajar dan melihat kesilapan yang dilakukan.&lt;\/p&gt;\n&lt;p&gt;\&quot;Denmark juga sangat klinikal apabila mereka berjaya menjaringkan gol menerusi peluang yang dimiliki. Ini adalah perlawanan yang akhirnya tidak memihak kepada kami,\&quot; kata pemain tengah Portugal, Bruno Fernandes.&lt;\/p&gt;\n&lt;p&gt;Sebelum sepak mula, Portugal mengadakan penghormatan khas buat Ronaldo yang mengumumkan persaraannya daripada pentas antarabangsa minggu lalu apabila pemain dan maskot pasukan memasuki padang dengan memakai jersi tertera nama serta nombor tujuh milik bintang itu.&lt;\/p&gt;\n&lt;p&gt;Penyokong turut membentangkan sepanduk besar tertera tulisan 'Terima kasih kapten' ketika kedua-dua pasukan memasuki padang, manakala sorakan dan tepukan gemuruh bergema di seluruh stadium sebaik jam perlawanan menunjukkan minit ketujuh.&lt;\/p&gt;\n&lt;p&gt;Ronaldo membuat penampilan sulung bersama Portugal pada 2003 sebelum mencipta rekod dunia dari segi jaringan dan penampilan dalam bola sepak antarabangsa apabila meledak 146 gol dalam 234 perlawanan.&lt;\/p&gt;\n&lt;p&gt;Kemuncak karier antarabangsanya adalah ketika membantu Portugal menjuarai Euro 2016, namun pengakhiran kariernya bersama pasukan kebangsaan dicemari perselisihan dengan jurulatih Portugal, Jorge Jesus, selepas tidak disenaraikan bagi aksi Liga Negara-Negara pada September ketika berusia 41 tahun.&lt;\/p&gt;\n&lt;p&gt;Pertelingkahan itu menyebabkan pemenang lima kali Ballon d'Or berkenaan dikenakan penggantungan selama 30 hari oleh Persekutuan Bola Sepak Portugal sebelum mengambil keputusan bersara daripada pentas antarabangsa.&lt;\/p&gt;\n&lt;p&gt;Portugal jelas merindui sentuhan Ronaldo apabila mempamerkan aksi hambar dalam perlawanan berkenaan.&lt;\/p&gt;\n&lt;p&gt;Denmark menguasai permainan sejak minit pertama dan tidak mengejutkan apabila pasukan pelawat menuju ke bilik persalinan dengan kelebihan satu gol menerusi sepakan penalti Pierre-Emile Hojbjerg pada minit ke-43.&lt;\/p&gt;\n&lt;p&gt;Hojlund kemudian meledak voli menarik hanya empat minit selepas babak kedua bermula sebelum sekali lagi mengejutkan penyokong tuan rumah tujuh minit kemudian menerusi jaringan yang mengingatkan kepada kehebatan Ronaldo.&lt;\/p&gt;\n&lt;p&gt;Penyerang Napoli itu memperdaya Ruben Dias sebelum melepaskan rembatan kencang dari luar kotak penalti untuk menambah jaringan kedua peribadinya.&lt;\/p&gt;\n&lt;p&gt;Sorakan tidak puas hati serta siulan mula kedengaran di Estadio Municipal apabila Joachim Andersen menanduk masuk gol keempat Denmark, manakala jaringan sagu hati Bernardo Silva pada penghujung perlawanan gagal meredakan kekecewaan penyokong tuan rumah.&lt;\/p&gt;\n&lt;p&gt;Sementara itu, Antonio Nusa membuka jaringan buat Norway menerusi rembatan rendah menarik sejurus sebelum sejam permainan berlangsung di Oslo.&lt;\/p&gt;\n&lt;p&gt;Andreas Schjelderup kemudian menyudahkan hantaran lintang rendah Erling Haaland sebelum penyerang Manchester City itu melengkapkan kemenangan menerusi sepakan penalti dua minit sebelum tamat perlawanan.&lt;\/p&gt;\n&lt;p&gt;Wales sempat menghidupkan peluang untuk mendapatkan keputusan positif apabila David Brooks merapatkan jurang menerusi penyudah cantik pada minit ke-79.&lt;\/p&gt;\n&lt;p&gt;Bagaimanapun, skuad kendalian Craig Bellamy itu bakal menamatkan saingan di kedudukan tercorot kumpulan dan berdepan risiko diturunkan ke Liga B.&lt;\/p&gt;\n&lt;\/div&gt;&quot;,&quot;word_count&quot;:512,&quot;og_description&quot;:&quot;Braga: Portugal dimalukan 1-4 oleh Denmark di pentas Liga Negara-Negara awal pagi tadi, sekali gus mencalar aksi pertama mereka tanpa kelibat Cristiano Ronaldo selepas penyerang sensasi itu mengumumkan persaraan daripada bola sepak antarabangsa.&quot;}" :nid="1436443" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_instream_player&amp;description_url=https%3A%2F%2Fwww.hmetro.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;vid_d=6000&amp;unviewed_position_start=1&amp;
