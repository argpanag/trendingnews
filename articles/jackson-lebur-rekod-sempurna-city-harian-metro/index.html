pasukan Villa yang mempunyai rekod cemerlang menentang mereka kebelakangan ini.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kemenangan ini adalah yang kelima buat Villa dalam tujuh pertemuan terakhir menentang City serta kemenangan keempat berturut-turut di halaman sendiri, Villa Park sekali gus menyambut ulang tahun keempat pelantikan Unai Emery sebagai pengurus Villa.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kapten Villa, John McGinn mengambil kesempatan atas kawalan bola yang lemah daripada pertahanan City, Marc Guehi untuk memberi umpanan kepada Jackson. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Jackson kemudian melakukan pergerakan melepasi kawalan Elliot Anderson sebelum merembat kencang ke penjuru atas gawang kawalan Gianluigi Donnarumma untuk gol pembukaan tuan rumah.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Pemain pelawat, Iliman Ndiaye hampir menyamakan kedudukan apabila percubaannya terkena tiang gol ketika City hebat mengasak. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Gol penyamaan akhirnya terhasil awal separuh masa kedua apabila Erling Haaland melonjak tinggi untuk menyempurnakan hantaran lintang Ndiaye dari sebelah kanan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Walau bagaimanapun, kedudukan seri itu hanya bertahan selama lapan minit apabila Jackson menyambut hantaran leret pemain gantian, Ibrahim Mbaye dengan rembatan untuk menewaskan Donnaruma buat kali kedua.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Satu lagi tandukan berbahaya daripada Haaland berjaya dikeluarkan dari kawasan bahaya oleh Ian Maatsen sekali gus mengesahkan kemenangan pertama Villa di halaman sendiri bagi saingan liga musim ini.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Meskipun tewas, kelebihan City di puncak EPL masih kekal tiga mata dengan pasukan tangga kedua, Arsenal bakal melayan kunjungan Everton selepas ini. &lt;\/p&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;p&gt;Birmingham: Dua gol oleh Nicolas Jackson menyaksikan Aston Villa menamatkan permulaan
