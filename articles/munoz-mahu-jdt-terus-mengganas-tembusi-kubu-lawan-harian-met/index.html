Munoz menegaskan pasukan itu perlu terus mengekalkan momentum positif menjelang aksi timbal balik kedua Piala FA pada 8 November depan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Jelas Munoz, beliau menyifatkan kemenangan 2-0 ke atas DPMM FC pada separuh akhir pertama malam tadi sebagai permulaan positif, namun memberi bayangan bahawa anak buah akan turun dalam perlaawanan kedua dengan aksi menyerang untuk mendapatkan jaringan lebih banyak.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Oleh itu, secara tidak langsung memberi amaran awal kepada pasukan DPMM FC bahawa tugas getir bakal ditempuhi pada perlawanan di Stadium Sultan Ismail awal bulan nanti. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Tidak pernah cukup jika anda bersama JDT (jaringan). Perkara paling penting ialah seperti yang saya katakan. Apabila dua pasukan yang bagus bertemu, penyokong yang datang ke stadium juga dapat menikmati perlawanan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Bagi kami, malam ini adalah malam yang positif. Kami juga berjaya mencatat keputusan tanpa bolos dan itu sangat penting. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Setiap kali beraksi dalam perlawanan Liga Juara-Juara Asia Elit (ACLE), kami perlu memastikan pasukan berada dalam keadaan matang untuk mengekalkan rekod tanpa bolos,\&quot; katanya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Dua gol menerusi Bergson Da Silva pada minit ke-21 dan Eddy Israfilov pada minit ke-71 meletakkan JDT selangkah lebih dekat untuk mengesahkan tiket ke pentas akhir.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Dalam pada itu, beliau melihat kemampuan pemain melaksanakan perancangan permainan sebagai antara perkara positif sepanjang perlawanan, selain persembahan baik yang ditampilkan kedua-dua pasukan.&lt;\/p&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;body_with_inline&quot;:&quot;&lt;div itemprop=\&quot;articleBody\&quot; class=\&quot;dable-content-wrapper\&quot;&gt;&lt;\/p&gt;\n&lt;p&gt;Kuala Lumpur: Kelebihan dua gol belum cukup untuk memuaskan hati Johor Darul Ta'zim (JDT) apabila pengendalinya, Xisco Munoz menegaskan pasukan itu perlu terus mengekalkan momentum positif menjelang aksi timbal balik kedua Piala FA pada 8 November depan.&lt;\/p&gt;\n&lt;p&gt;Jelas Munoz, beliau menyifatkan kemenangan 2-0 ke atas DPMM FC pada separuh akhir pertama malam tadi sebagai permulaan positif, namun memberi bayangan bahawa anak buah akan turun dalam perlaawanan kedua dengan aksi menyerang untuk mendapatkan jaringan lebih banyak.&lt;\/p&gt;\n&lt;p&gt;Oleh itu, secara tidak langsung memberi amaran awal kepada pasukan DPMM FC bahawa tugas getir bakal ditempuhi pada perlawanan di Stadium Sultan Ismail awal bulan nanti. &lt;\/p&gt;\n&lt;p&gt;\&quot;Tidak pernah cukup jika anda bersama JDT (jaringan). Perkara paling penting ialah seperti yang saya katakan. Apabila dua pasukan yang bagus bertemu, penyokong yang datang ke stadium juga dapat menikmati perlawanan.&lt;\/p&gt;\n&lt;p&gt;\&quot;Bagi kami, malam ini adalah malam yang positif. Kami juga berjaya mencatat keputusan tanpa bolos dan itu sangat penting. &lt;\/p&gt;\n&lt;p&gt;\&quot;Setiap kali beraksi dalam perlawanan Liga Juara-Juara Asia Elit (ACLE), kami perlu memastikan pasukan berada dalam keadaan matang untuk mengekalkan rekod tanpa bolos,\&quot; katanya.&lt;\/p&gt;\n&lt;p&gt;Dua gol menerusi Bergson Da Silva pada minit ke-21 dan Eddy Israfilov pada minit ke-71 meletakkan JDT selangkah lebih dekat untuk mengesahkan tiket ke pentas akhir.&lt;\/p&gt;\n&lt;p&gt;Dalam pada itu, beliau melihat kemampuan pemain melaksanakan perancangan permainan sebagai antara perkara positif sepanjang perlawanan, selain persembahan baik yang ditampilkan kedua-dua pasukan.&lt;\/p&gt;\n&lt;\/div&gt;&quot;,&quot;word_count&quot;:226,&quot;og_description&quot;:&quot;Kuala Lumpur: Kelebihan dua gol belum cukup untuk memuaskan hati Johor Darul Ta\u2019zim (JDT) apabila pengendalinya, Xisco Munoz menegaskan pasukan itu perlu terus mengekalkan momentum positif menjelang aksi timbal balik kedua Piala
