har Abdullah","auto_generated":false}],"field_article_images":[{"fid":"8378894","uid":"9","filename":"17hmlgo1sd_1791167620.jpg","uri":"gs:\/\/images\/articles\/17hmlgo1sd_1791167620.jpg","filemime":"image\/jpeg","filesize":"71455","status":"1","timestamp":"1791167621","uuid":"ff9fe5d4-e69f-4e23-beec-6a48fc41d42d","rdf_mapping":[],"alt":"","title":"","width":"1200","height":"779","url":"https:\/\/assets.hmetro.com.my\/images\/articles\/17hmlgo1sd_1791167620.jpg","caption":"GAMBAR hiasan. FOTO arkib NSTP","gn4id":"hm-48938046"}],"field_article_images_filtered":[{"fid":"8378894","uid":"9","filename":"17hmlgo1sd_1791167620.jpg","uri":"gs:\/\/images\/articles\/17hmlgo1sd_1791167620.jpg","filemime":"image\/jpeg","filesize":"71455","status":"1","timestamp":"1791167621","uuid":"ff9fe5d4-e69f-4e23-beec-6a48fc41d42d","rdf_mapping":[],"alt":"","title":"","width":"1200","height":"779","url":"https:\/\/assets.hmetro.com.my\/images\/articles\/17hmlgo1sd_1791167620.jpg","caption":"GAMBAR hiasan. FOTO arkib NSTP","gn4id":"hm-48938046"}],"field_article_videos":null,"field_image_listing_featured_v2":"https:\/\/assets.hmetro.com.my\/images\/articles\/bnm-kkdwbuajet_HMfield_image_listing_featured_v2.var_1791167627.jpg","field_image_listing_v2":"https:\/\/assets.hmetro.com.my\/images\/articles\/bnm-kkdwbuajet_HMfield_image_listing_v2.var_1791167630.jpg","field_image_socialmedia":"https:\/\/assets.hmetro.com.my\/images\/articles\/bnm-kkdwbuajet_HMfield_image_socialmedia.var_1791167629.jpg","field_image_slider":"https:\/\/assets.hmetro.com.my\/images\/articles\/bnm-kkdwbuajet_HMfield_image_slider_v2.var_1791167626.jpg","field_image_variasi":"https:\/\/assets.hmetro.com.my\/images\/articles\/bnm-kkdwbuajet_HMfield_image_variasi_v2.var_1791167627.jpg","field_image_listing_featured":"https:\/\/assets.hmetro.com.my\/images\/articles\/bnm-kkdwbuajet_HMfield_image_listing_featured_v2.var_1791167627.jpg","field_image_listing_th":"https:\/\/assets.hmetro.com.my\/images\/articles\/bnm-kkdwbuajet_HMfield_image_listing_th.var_1791167622.jpg","field_image_th":"https:\/\/assets.hmetro.com.my\/images\/articles\/bnm-kkdwbuajet_HMfield_image_th_v2.var_1791167628.jpg","field_article_state":null,"field_article_lead":"Tasek Gelugor: Kementerian Kemajuan Desa dan Wilayah (KKDW) memohon peruntukan RM40 juta bagi membantu 1,000 usahawan mendapatkan pensijilan halal daripada Kementerian Kewangan (MoF) menerusi Belanjawan 2027 yang akan dibentangkan Jumaat ini.","body":"&lt;p \/&gt;&lt;p&gt;Tasek Gelugor: Kementerian Kemajuan Desa dan Wilayah (KKDW) memohon peruntukan RM40 juta bagi membantu 1,000 usahawan mendapatkan pensijilan halal daripada Kementerian Kewangan (MoF) menerusi Belanjawan 2027 yang akan dibentangkan Jumaat ini.&lt;\/p&gt;&lt;p&gt;Timbalan Setiausaha Dasar KKDW Datuk Abdul Kahar Abdullah berkata, permohonan itu antara usaha kementerian memperkukuh penyertaan usahawan, khususnya dalam kalangan bumiputera dalam industri halal yang mempunyai prospek besar di pasaran domestik dan antarabangsa.&lt;\/p&gt;&lt;p&gt;\"Diharapkan permohonan KKDW kepada MoF akan dipertimbangkan bagi belanjawan yang akan diumumkan nanti kerana bantuan ini akan merangkumi aspek dokumentasi dan latihan, termasuk melatih pegawai yang mempunyai kepakaran dalam bidang halal untuk menjadi eksekutif halal.&lt;\/p&gt;&lt;p&gt;\"Usahawan juga perlu membuat persediaan dari segi fizikal premis antaranya menaik taraf dapur serta kemudahan berkaitan bagi memastikan perniagaan mereka memenuhi keperluan pensijilan halal,\" katanya pada Majlis Penutup Ekspo PERDA (EXPERT) 2026 di Midtown PERDA, Kubang Menerong, di sini malam tadi.&lt;\/p&gt;&lt;p&gt;Majlis berkenaan dirasmikan oleh Timbalan Ketua Menteri I Datuk Dr Mohamad Abdul Hamid dan turut hadir Pengerusi Jawatankuasa Pembangunan Luar Bandar, Agroteknologi, Keterjaminan Makanan dan Keusahawanan negeri Datuk Rashidi Zinol serta Pengurus Besar Lembaga Kemajuan Wilayah Pulau Pinang (PERDA) Datuk Mohd Asri Baharum.&lt;\/p&gt;&lt;p&gt;Belanjawan 2027 bertemakan \"Malaysia MADANI: Menggapai di Langit, Mengakar di Bumi\" dijadual dibentangkan Perdana Menteri Datuk Seri Anwar Ibrahim yang juga Menteri Kewangan di Parlimen pada 9 Okt ini.&lt;\/p&gt;&lt;p&gt;Abdul Kahar berkata industri halal mempunyai prospek yang besar berikutan pasaran global yang terus berkembang merangkumi sektor makanan dan minuman, farmaseutikal, kosmetik, logistik, pelancongan serta perkhidmatan.&lt;\/p&gt;&lt;p&gt;Beliau berkata eksport halal Malaysia pada 2025 mencapai kira-kira RM68.52 bilion, sekali gus menunjukkan potensi besar yang boleh dimanfaatkan oleh usahawan tempatan.&lt;\/p&gt;&lt;p&gt;\"KKDW juga mahu pembangunan usahawan bumiputera tidak hanya tertumpu kepada bantuan untuk memulakan perniagaan, tetapi merangkumi keseluruhan rantaian pembangunan daripada peningkatan kapasiti, kualiti produk, pensijilan dan pembungkusan sehingga kepada akses pasaran serta keantarabangsaan perniagaan,\" katanya.&lt;\/p&gt;&lt;p&gt;Abdul Kahar berkata, KKDW turut memberi penekanan kepada usaha membawa usahawan tempatan menembusi pasaran antarabangsa menerusi program &lt;em&gt;Gate to Global &lt;\/em&gt;(G2G) yang dilaksanakan melalui Majlis Amanah Rakyat (MARA).&lt;\/p&gt;&lt;p&gt;Beliau berkata, sehingga 2025, sejumlah 132 usahawan telah dibangunkan sebagai syarikat bersedia eksport dengan transaksi keseluruhan sekitar RM1.1 bilion melalui penyertaan dalam pelbagai platform perdagangan dan misi antarabangsa.&lt;\/p&gt;&lt;p&gt;Beliau juga memaklumkan Pulau Pinang mempunyai asas yang baik untuk memperkukuh pembangunan industri halal menerusi kewujudan pelbagai agensi dan inisiatif termasuk Penang Halal International serta pembangunan PERDA Halal Park di Kubang Menerong.&lt;\/p&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;p&gt;Tasek Gelugor: Kementerian Kemajuan Desa dan Wilayah (KKDW) memohon peruntukan RM40 juta bagi membantu 1,000 usah
