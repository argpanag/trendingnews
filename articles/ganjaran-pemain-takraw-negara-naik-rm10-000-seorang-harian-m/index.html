 emas berpasukan. FOTO Bernama","gn4id":"hm-73774197"}],"field_article_images_filtered":[{"fid":"8351729","uid":"9","filename":"SUKAN_ASIA_AICHI-NAGOYA_2026_fb2a603fa0574e1e8ff8e68e8b6f11ec_1790336614.jpg","uri":"gs:\/\/images\/articles\/SUKAN_ASIA_AICHI-NAGOYA_2026_fb2a603fa0574e1e8ff8e68e8b6f11ec_1790336614.jpg","filemime":"image\/jpeg","filesize":"777016","status":"1","timestamp":"1790336614","uuid":"169a454f-9f69-4030-aa35-4cb034a44ab9","rdf_mapping":[],"alt":"","title":"","width":"1200","height":"749","url":"https:\/\/assets.hmetro.com.my\/images\/articles\/SUKAN_ASIA_AICHI-NAGOYA_2026_fb2a603fa0574e1e8ff8e68e8b6f11ec_1790336614.jpg","caption":"PEMAIN negara meraikan kejaayan meraih pingat emas berpasukan. FOTO Bernama","gn4id":"hm-73774197"}],"field_article_videos":null,"field_image_listing_featured_v2":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-takkkraww_HMfield_image_listing_featured_v2.var_1790339029.jpg","field_image_listing_v2":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-takkkraww_HMfield_image_listing_v2.var_1790339032.jpg","field_image_socialmedia":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-takkkraww_HMfield_image_socialmedia.var_1790339031.jpg","field_image_slider":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-takkkraww_HMfield_image_slider_v2.var_1790339028.jpg","field_image_variasi":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-takkkraww_HMfield_image_variasi_v2.var_1790339029.jpg","field_image_listing_featured":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-takkkraww_HMfield_image_listing_featured_v2.var_1790339029.jpg","field_image_listing_th":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-takkkraww_HMfield_image_listing_th.var_1790339023.jpg","field_image_th":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-takkkraww_HMfield_image_th_v2.var_1790339030.jpg","field_article_state":null,"field_article_lead":"Nagoya: Skuad sepak takraw negara yang menamatkan penantian 36 tahun untuk meraih pingat emas regu berpasukan Sukan Asia Aichi-Nagoya 2026 bakal menerima ganjaran lumayan apabila setiap pemain akan diberikan habuan RM10,000.","body":"&lt;p&gt;sukan@hmetro.com.my&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Nagoya: Skuad sepak takraw negara yang menamatkan penantian 36 tahun untuk meraih pingat emas regu berpasukan Sukan Asia Aichi-Nagoya 2026 bakal menerima ganjaran lumayan apabila setiap pemain akan diberikan habuan RM10,000.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Presiden Persekutuan Sepak Takraw Malaysia (PSM), Datuk Sumali Reduan berkata, jumlah ganjaran itu dinaikkan daripada RM7,000 selepas mengambil kira kejayaan luar biasa pasukan negara menewaskan Thailand 2-0 pada final regu berpasukan di Nagoya City Mizuho Arena.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Katanya, keputusan menaikkan jumlah ganjaran itu dipersetujui semua ahli majlis PSM sebagai tanda penghargaan terhadap pengorbanan dan perjuangan pemain.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\"Ganjaran untuk mereka memang ada, ikut pusingan, tetapi selepas mereka menang tadi, saya rasakan kami patut naikkan ganjaran ini dan semua ahli exco bersetuju,\" kata Sumali.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kejayaan itu menyaksikan skuad sepak takraw negara kembali menjejak podium tertinggi Sukan Asia dalam acara regu berpasukan selepas kali terakhir melakukannya pada edisi Beijing 1990.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Dalam pada itu, Sumali turut mengumumkan skuad sepak takraw negara kini secara rasmi diberikan nama jolokan \"The Golden Tigers\" susulan kejayaan mereka mencipta sejarah di Aichi-Nagoya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Beliau berkata, idea menggunakan gelaran berkenaan tercetus selepas mengambil inspirasi daripada beberapa pasukan negara yang mempunyai identiti tersendiri seperti Harimau Malaya dalam bola sepak dan Speedy Tigers dalam hoki.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\"Ramai yang tanyakan kepada saya sebelum ini, termasuk bekas Menteri Belia dan Sukan, Hannah Yeoh apakah nama jolokan kepada skuad sepak takraw negara?&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\"Bola Sepak ada gelaran Harimau Malaya, manakala Hoki pula dipanggil Speedy Tiger, jadi saya dapat idea dan hari ini kita sepakat memanggil skuad sepak takraw negara dengan nama The Golden Tigers,\" kata Sumali.&lt;\/p&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;\/p&gt;\n&lt;p&gt;Nagoya: Skuad sepak takraw negara yang menamatkan penantian 36 tahun untuk meraih pingat emas regu berpasukan Sukan Asia Aichi-Nagoya 2026 bakal menerima ganjaran lumayan apabila setiap pemain akan diberikan habuan RM10,000.&lt;\/p&gt;\n&lt;p&gt;Presiden Persekutuan Sepak Takraw Malaysia (PSM), Datuk Sumali Reduan berkata, jumlah ganjaran itu dinaikkan daripada RM7,000 selepas mengambil kira kejayaan luar biasa pasukan negara menewaskan Thailand 2-0 pada final regu berpasukan di Nagoya City Mizuho Arena.&lt;\/p&gt;\n&lt;p&gt;Katanya, keputusan menaikkan jumlah ganjaran itu dipersetujui semua ahli majlis PSM sebagai tanda penghargaan terhadap pengorbanan dan perjuangan pemain.&lt;\/p&gt;\n&lt;p&gt;\"Ganjaran untuk mereka memang ada, ikut pusingan, tetapi selepas mereka menang tadi, saya rasakan kami patut naikkan ganjaran ini dan semua ahli exco bersetuju,\" kata Sumali.&lt;\/p&gt;\n&lt;p&gt;Kejayaan itu menyaksikan skuad sepak takraw negara kembali menjejak podium tertinggi Sukan Asia dalam acara regu berpasukan selepas kali terakhir melakukannya pada edisi Beijing 1990.&lt;\/p&gt;\n&lt;p&gt;Dalam pada itu, Sumali turut mengumumkan skuad sepak takraw negara kini secara rasmi diberikan nama jolokan \"The Golden Tigers\" susulan kejayaan mereka mencipta sejarah di Aichi-Nagoya.&lt;\/p&gt;\n&lt;p&gt;Beliau berkata, idea menggunakan gelaran berkenaan tercetus selepas mengambil inspirasi daripada beberapa pasukan negara yang mempunyai identiti tersendiri seperti Harimau Malaya dalam bola sepak dan Speedy Tigers dalam hoki.&lt;\/p&gt;\n&lt;p&gt;\"Ramai yang tanyakan kepada saya sebelum ini, termasuk bekas Menteri Belia dan Sukan, Hannah Yeoh apakah nama jolokan kepada skuad sepak takraw negara?&lt;\/p&gt;\n&lt;p&gt;\"Bola Sepak ada gelaran Harimau Malaya, manakala Hoki pula dipanggil Speedy Tiger, jadi saya dapat idea dan hari ini kita sepakat memanggil skuad sepak takraw negara dengan nama The Golden Tigers,\" kata Sumali.&lt;\/p&gt;\n&lt;\/div&gt;","word_count":248,"og_description":"Nagoya: Skuad sepak takraw negara yang menamatkan penantian 36 tahun untuk meraih pingat emas regu berpasukan Sukan Asia Aichi-Nagoya 2026 bakal menerima ganjaran lumayan apabila setiap pemain akan diberikan habuan RM10,000."}' :nid="1415290" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_instream_player&amp;description_url=https%3A%2F%2Fwww.hmetro.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;vid_d=6000&amp;unviewed_position_start=1&amp;output=xml_vast2&amp;ad_rule=1&amp;env=vp&amp;impl=s&amp;correlator=" :is-sponsered="false"></article-component>
