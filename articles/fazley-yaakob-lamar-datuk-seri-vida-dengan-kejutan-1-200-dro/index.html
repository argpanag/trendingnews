-dida_HMfield_image_listing_featured_v2.var_1794321759.jpg&quot;,&quot;field_image_listing_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/Copy_Of_o-dida_HMfield_image_listing_v2.var_1794321760.jpg&quot;,&quot;field_image_socialmedia&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/Copy_Of_o-dida_HMfield_image_socialmedia.var_1794321759.jpg&quot;,&quot;field_image_slider&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/Copy_Of_o-dida_HMfield_image_slider.var_1794321758.jpg&quot;,&quot;field_image_variasi&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/Copy_Of_o-dida_HMfield_image_variasi.var_1794321757.jpg&quot;,&quot;field_image_listing_featured&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/Copy_Of_o-dida_HMfield_image_listing_featured_v2.var_1794321759.jpg&quot;,&quot;field_image_listing_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/Copy_Of_o-dida_HMfield_image_listing_th.var_1794321755.jpg&quot;,&quot;field_image_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/Copy_Of_o-dida_HMfield_image_th.var_1794321756.jpg&quot;,&quot;field_article_state&quot;:null,&quot;field_article_lead&quot;:&quot;Kuala Lumpur: Penyanyi dan cef selebriti, Datuk Fazley Yaakob membuat kejutan apabila melamar usahawan sensasi, Datuk Seri Vida (DSV) di Konsert Live 11.11 Mega Shock di Pusat Konvesyen Kuala Lumpur, di sini, malam ini.&quot;,&quot;body&quot;:&quot;&lt;p&gt;puterialia@hmetro.com.my&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kuala Lumpur: Penyanyi dan cef selebriti, Datuk Fazley Yaakob membuat kejutan apabila melamar usahawan sensasi, Datuk Seri Vida (DSV) di Konsert Live 11.11 Mega Shock di Pusat Konvesyen Kuala Lumpur, di sini, malam ini.&lt;\/p&gt;&lt;p&gt;Terharu dengan lamaran Fazley, Vida atau nama sebenarnya Hasmiza Othman, 56, menerima lamaran berkenaan sambil mengucapkan terima kasih.&lt;\/p&gt;&lt;p&gt;\&quot;Jawapan saya yes, yes dan yes (ya), terima kasih sayang. Adakah ini permulaan kepada semua benda besar termasuk doa untuk berbahagia dengan pasangan.&lt;\/p&gt;&lt;p&gt;\&quot;Ini semua pembuka pintu kepada kebahagiaan itu,\&quot; kata Vida dalam nada sebak.&lt;\/p&gt;&lt;p&gt;Dalam majlis lamaran berkenaan, Fazley, 48, turut memberikan sebentuk cincin bernilai RM7,000 ciptaan Habib Jewel yang direka khas menyerupai tiara dengan diinspirasikan daripada kegemaran Vida memakai mahkota.&lt;\/p&gt;&lt;p&gt;Sebelum lamaran dibuat, Fazley turut menyampaikan dua buah lagu termasuk Di Alam Fana Cinta yang menjadi antara lagu kegemaran Vida.&lt;\/p&gt;&lt;p&gt;Menurut Fazley, lamaran yang turut dihadiri anak-anak dari kedua-dua keluarga itu mula dirancang antara dua hingga tiga minggu lebih awal, manakala persiapan intensif dilakukan selama hampir 14 hari.&lt;\/p&gt;&lt;p&gt;Katanya, pemilihan konsert TikTok sebagai platform lamaran pula dibuat berdasarkan pengaruh besar Vida dalam kalangan pengguna media sosial, khususnya di Malaysia dan Singapura.&lt;\/p&gt;&lt;p&gt;\&quot;Pada saya, DSV ialah 'Queen of TikTok'. Jadi, sudah sepatutnya kita meraikan beliau dalam dunia yang selama ini banyak meraikan dan menyokongnya.&lt;\/p&gt;&lt;p&gt;\&quot;Ramai pengikut mengenalinya melalui TikTok dan sentiasa mengikuti siaran langsungnya. &lt;\/p&gt;&lt;p&gt;\&quot;Sebab itu saya mahu melamar beliau menerusi platform yang dekat dengan hati dan pengikutnya,\&quot; katanya.&lt;\/p&gt;&lt;p&gt;Katanya, kejutan itu turut mendapat sokongan dan tajaan beberapa pihak dengan anggaran kos keseluruhan RM500,000 merangkumi persembahan dron, produksi, persiapan acara dan keperluan lain.&lt;\/p&gt;&lt;p&gt;\&quot;Cincin ini adalah simbolik lamaran saya kepada DSV. Ia bukan cincin pertunangan, tetapi tanda bahawa hubungan kami serius.&lt;\/p&gt;&lt;p&gt;\&quot;Selama ini ramai bertanya sama ada hubungan kami benar-benar serius, atau sekadar kandungan media sosial atau sebenarnya sudah berkahwin. &lt;\/p&gt;&lt;p&gt;\&quot;Jadi, saya mahu memberikan jawapan yang jelas kepada masyarakat,\&quot; katanya.&lt;\/p&gt;&lt;p&gt;Lamaran yang turut disiarkan menerusi siaran langsung TikTok itu turut diserikan dengan persembahan mega 1,200 dron membentuk mesej unik 'Nak Duduk Ipoh ke KL?' buat Vida.&lt;\/p&gt;&lt;p&gt;Sebelum ini, hubungan Fazley dan Vida mula menjadi perhatian selepas kedua-duanya dikaitkan menerusi program realiti Talk To My Manager musim kedua (TTMM 2) sekitar Mei lalu.&lt;\/p&gt;&lt;p&gt;Lamaran ini akhirnya menjadi simbolik keseriusan hubungan Fazley dan Vida, sekali gus menjawab pelbagai spekulasi termasuk dakwaan bahawa kemesraan pasangan berkenaan hanyalah gimik dan strategi pemasaran di media sosial.&lt;\/p&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;body_with_inline&quot;:&quot;&lt;div itemprop=\&quot;articleBody\&quot; class=\&quot;dable-content-wrapper\&quot;&gt;&lt;\/p&gt;\n&lt;p&gt;Kuala Lumpur: Penyanyi dan cef selebriti, Datuk Fazley Yaakob membuat kejutan apabila melamar usahawan sensasi, Datuk Seri Vida (DSV) di Konsert Live 11.11 Mega Shock di Pusat Konvesyen Kuala Lumpur, di sini, malam ini.&lt;\/p&gt;\n&lt;p&gt;Terharu dengan lamaran Fazley, Vida atau nama sebenarnya Hasmiza Othman, 56, menerima lamaran berkenaan sambil mengucapkan terima kasih.&lt;\/p&gt;\n&lt;p&gt;\&quot;Jawapan saya yes, yes dan yes (ya), terima kasih sayang. Adakah ini permulaan kepada semua benda besar termasuk doa untuk berbahagia dengan pasangan.&lt;\/p&gt;\n&lt;p&gt;\&quot;Ini semua pembuka pintu kepada kebahagiaan itu,\&quot; kata Vida dalam nada sebak.&lt;\/p&gt;\n&lt;p&gt;Dalam majlis lamaran berkenaan, Fazley, 48, turut memberikan sebentuk cincin bernilai RM7,000 ciptaan Habib Jewel yang direka khas menyerupai tiara dengan diinspirasikan daripada kegemaran Vida memakai mahkota.&lt;\/p&gt;\n&lt;p&gt;Sebelum lamaran dibuat, Fazley turut menyampaikan dua buah lagu termasuk Di Alam Fana Cinta yang menjadi antara lagu kegemaran Vida.&lt;\/p&gt;\n&lt;p&gt;Menurut Fazley, lamaran yang turut dihadiri anak-anak dari kedua-dua keluarga itu mula dirancang antara dua hingga tiga minggu lebih awal, manakala persiapan intensif dilakukan selama hampir 14 hari.&lt;\/p&gt;\n&lt;p&gt;Katanya, pemilihan konsert TikTok sebagai platform lamaran pula dibuat berdasarkan pengaruh besar Vida dalam kalangan pengguna media sosial, khususnya di Malaysia dan Singapura.&lt;\/p&gt;\n&lt;p&gt;\&quot;Pada saya, DSV ialah 'Queen of TikTok'. Jadi, sudah sepatutnya kita meraikan beliau dalam dunia yang selama ini banyak meraikan dan menyokongnya.&lt;\/p&gt;\n&lt;p&gt;\&quot;Ramai pengikut mengenalinya melalui TikTok dan sentiasa mengikuti siaran langsungnya. &lt;\/p&gt;\n&lt;p&gt;\&quot;Sebab itu saya mahu melamar beliau menerusi platform yang dekat dengan hati dan pengikutnya,\&quot; katanya.&lt;\/p&gt;\n&lt;p&gt;Katanya, kejutan itu turut mendapat sokongan dan tajaan beberapa pihak dengan anggaran kos keseluruhan RM500,000 merangkumi persembahan dron, produksi, persiapan acara dan keperluan lain.&lt;\/p&gt;\n&lt;p&gt;\&quot;Cincin ini adalah simbolik lamaran saya kepada DSV. Ia bukan cincin pertunangan, tetapi tanda bahawa hubungan kami serius.&lt;\/p&gt;\n&lt;p&gt;\&quot;Selama ini ramai bertanya sama ada hubungan kami benar-benar serius, atau sekadar kandungan media sosial atau sebenarnya sudah berkahwin. &lt;\/p&gt;\n&lt;p&gt;\&quot;Jadi, saya mahu memberikan jawapan yang jelas kepada masyarakat,\&quot; katanya.&lt;\/p&gt;\n&lt;p&gt;Lamaran yang turut disiarkan menerusi siaran langsung TikTok itu turut diserikan dengan persembahan mega 1,200 dron membentuk mesej unik 'Nak Duduk Ipoh ke KL?' buat Vida.&lt;\/p&gt;\n&lt;p&gt;Sebelum ini, hubungan Fazley dan Vida mula menjadi perhatian selepas kedua-duanya dikaitkan menerusi program realiti Talk To My Manager musim kedua (TTMM 2) sekitar Mei lalu.&lt;\/p&gt;\n&lt;p&gt;Lamaran ini akhirnya menjadi simbolik keseriusan hubungan Fazley dan Vida, sekali gus menjawab pelbagai spekulasi termasuk dakwaan bahawa kemesraan pasangan berkenaan hanyalah gimik dan strategi pemasaran di media sosial.&lt;\/p&gt;\n&lt;\/div&gt;&quot;,&quot;word_count&quot;:382,&quot;og_description&quot;:&quot;Kuala Lumpur: Penyanyi dan cef selebriti, Datuk Fazley Yaakob membuat kejutan apabila melamar usahawan sensasi, Datuk Seri Vida (DSV) di Konsert Live 11.11 Mega Shock di Pusat Konvesyen Kuala Lumpur, di sini, malam ini.&quot;}" :nid="1434658" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_instream_player&amp;description_url=https%3A%2F%2Fwww.hmetro.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;vid_d=6000&amp;unviewed_position_start=1&amp;output=xml_vast2&amp;ad_rule=1&amp;env=vp&amp;impl=s&amp;correlator=" :is-sponsered="false"></article-component>
