.hmetro.com.my\/images\/articles\/bida_HMfield_image_th_v2.var_1791464954.jpg&quot;,&quot;field_article_state&quot;:null,&quot;field_article_lead&quot;:&quot;Kuala Lumpur: Pertubuhan Lestari Ekonomi Aktivis Digital Malaysia (LEAD Malaysia) mahu mekanisme bidaan tambang dihentikan.&quot;,&quot;body&quot;:&quot;&lt;p&gt;nurul.hidayah@hmetro.com.my &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kuala Lumpur: Pertubuhan Lestari Ekonomi Aktivis Digital Malaysia (LEAD Malaysia) mahu mekanisme bidaan tambang dihentikan.&lt;\/p&gt;&lt;p&gt;LEAD Malaysia dalam kenyataan hari ini berkata, persaingan antara pemandu tidak seharusnya berlaku dengan cara menurunkan harga perjalanan sehingga menekan pendapatan mereka sendiri.&lt;\/p&gt;&lt;p&gt;Sebaliknya, menurut kenyataan itu, penentuan tambang sewajarnya menggunakan mekanisme 'dynamic pricing' yang mengambil kira faktor permintaan dan penawaran, jarak, masa, keadaan trafik serta keadaan pasaran semasa. &lt;\/p&gt;&lt;p&gt;\&quot;Tambang minimum adalah penting kerana setiap perjalanan mempunyai kos yang perlu ditanggung oleh pemandu.&lt;\/p&gt;&lt;p&gt;\&quot;Minyak, tayar, servis berkala, insurans, susut nilai kenderaan serta masa dan jarak untuk mengambil penumpang semuanya sebahagian daripada kos sebenar menjalankan perkhidmatan e-hailing.&lt;\/p&gt;&lt;p&gt;\&quot;Apabila tambang menjadi terlalu rendah, ada perjalanan yang akhirnya tidak lagi memberikan pulangan yang munasabah selepas kos operasi diambil kira. &lt;\/p&gt;&lt;p&gt;\&quot;Pemandu mungkin bekerja lebih lama dan melakukan lebih banyak perjalanan tetapi pendapatan bersih mereka masih rendah,\&quot; katanya. &lt;\/p&gt;&lt;p&gt;Dalam pada itu, LEAD Malaysia turut mencadangkan supaya bantuan atau subsidi penyelenggaraan kenderaan secara bersasar kepada pemandu e-hailing aktif dicadangkan dalam Belanjawan 2027.&lt;\/p&gt;&lt;p&gt;Katanya, bantuan itu boleh merangkumi pembelian dan penggantian tayar, servis berkala, minyak enjin, sistem brek serta penyelenggaraan asas lain yang mempunyai kaitan langsung dengan operasi dan keselamatan kenderaan. &lt;\/p&gt;&lt;p&gt;\&quot;Selain itu, kadar insurans yang semakin tinggi turut menjadi beban besar kepada pemandu.&lt;\/p&gt;&lt;p&gt;\&quot;Kami berharap kerajaan dapat memberi perhatian serius terhadap perkara ini serta mempertimbangkan langkah yang dapat meringankan kos insurans ditanggung pemandu e-hailing,\&quot; katanya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;body_with_inline&quot;:&quot;&lt;div itemprop=\&quot;articleBody\&quot; class=\&quot;dable-content-wrapper\&quot;&gt;&lt;\/p&gt;\n&lt;p&gt;Kuala Lumpur: Pertubuhan Lestari Ekonomi Aktivis Digital Malaysia (LEAD Malaysia) mahu mekanisme bidaan tambang dihentikan.&lt;\/p&gt;\n&lt;p&gt;LEAD Malaysia dalam kenyataan hari ini berkata, persaingan antara pemandu tidak seharusnya berlaku dengan cara menurunkan harga perjalanan sehingga menekan pendapatan mereka sendiri.&lt;\/p&gt;\n&lt;p&gt;Sebaliknya, menurut kenyataan itu, penentuan tambang sewajarnya menggunakan mekanisme 'dynamic pricing' yang mengambil kira faktor permintaan dan penawaran, jarak, masa, keadaan trafik serta keadaan pasaran semasa. &lt;\/p&gt;\n&lt;p&gt;\&quot;Tambang minimum adalah penting kerana setiap perjalanan mempunyai kos yang perlu ditanggung oleh pemandu.&lt;\/p&gt;\n&lt;p&gt;\&quot;Minyak, tayar, servis berkala, insurans, susut nilai kenderaan serta masa dan jarak untuk mengambil penumpang semuanya sebahagian daripada kos sebenar menjalankan perkhidmatan e-hailing.&lt;\/p&gt;\n&lt;p&gt;\&quot;Apabila tambang menjadi terlalu rendah, ada perjalanan yang akhirnya tidak lagi memberikan pulangan yang munasabah selepas kos operasi diambil kira. &lt;\/p&gt;\n&lt;p&gt;\&quot;Pemandu mungkin bekerja lebih lama dan melakukan lebih banyak perjalanan tetapi pendapatan bersih mereka masih rendah,\&quot; katanya. &lt;\/p&gt;\n&lt;p&gt;Dalam pada itu, LEAD Malaysia turut mencadangkan supaya bantuan atau subsidi penyelenggaraan kenderaan secara bersasar kepada pemandu e-hailing aktif dicadangkan dalam Belanjawan 2027.&lt;\/p&gt;\n&lt;p&gt;Katanya, bantuan itu boleh merangkumi pembelian dan penggantian tayar, servis berkala, minyak enjin, sistem brek serta penyelenggaraan asas lain yang mempunyai kaitan langsung dengan operasi dan keselamatan kenderaan. &lt;\/p&gt;\n&lt;p&gt;\&quot;Selain itu, kadar insurans yang semakin tinggi turut menjadi beban besar kepada pemandu.&lt;\/p&gt;\n&lt;p&gt;\&quot;Kami berharap kerajaan dapat memberi perhatian serius terhadap perkara ini serta mempertimbangkan langkah yang dapat meringankan kos insurans ditanggung pemandu e-hailing,\&quot; katanya.&lt;\/p&gt;\n&lt;\/div&gt;&quot;,&quot;word_count&quot;:228,&quot;og_description&quot;:&quot;Kuala Lumpur: Pertubuhan Lestari Ekonomi Aktivis Digital Malaysia (LEAD Malaysia) mahu mekanisme bidaan tambang dihentikan.&quot;}" :nid="1420595" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_instream_player&amp;description_url=https%3A%2F%2Fwww.hmetro.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;vid_d=6000&amp;unviewed_position_start=1&amp;output=xml_vast2&amp;ad_rule=1&amp;env=vp&amp;impl=s&amp;correlator=" :is-sponsered="false"></article-component>
