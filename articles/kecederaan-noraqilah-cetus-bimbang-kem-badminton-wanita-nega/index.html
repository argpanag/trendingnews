uid":"9","filename":"aqilah_1789550780.jpg","uri":"gs:\/\/images\/articles\/aqilah_1789550780.jpg","filemime":"image\/jpeg","filesize":"184742","status":"1","timestamp":"1789550780","uuid":"7220ca2b-d4fa-4eee-9b31-7308755406b3","rdf_mapping":[],"alt":"","title":"","width":"1200","height":"833","url":"https:\/\/assets.hmetro.com.my\/images\/articles\/aqilah_1789550780.jpg","caption":"ATLET badminton negara, Norqailah Maisarah Ramdan (kiri) dan Low Zi Yu bergerak dari Akademi Badminton Malaysia (ABM) Bukit Kiara ke KLIA untuk berlepas ke Sukan Asia Aichi-Nagoya 2026 yang dijadualkan berlangsung dari 19 September hingga 4 Oktober 2026. FOTO HAIRUL ANUAR RAHIM","gn4id":"hm-73525047"}],"field_article_videos":null,"field_image_listing_featured_v2":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-aqilah16926_HMfield_image_listing_featured_v2.var_1789550787.jpg","field_image_listing_v2":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-aqilah16926_HMfield_image_listing_v2.var_1789550790.jpg","field_image_socialmedia":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-aqilah16926_HMfield_image_socialmedia.var_1789550789.jpg","field_image_slider":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-aqilah16926_HMfield_image_slider_v2.var_1789550786.jpg","field_image_variasi":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-aqilah16926_HMfield_image_variasi_v2.var_1789550787.jpg","field_image_listing_featured":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-aqilah16926_HMfield_image_listing_featured_v2.var_1789550787.jpg","field_image_listing_th":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-aqilah16926_HMfield_image_listing_th.var_1789550782.jpg","field_image_th":"https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-aqilah16926_HMfield_image_th_v2.var_1789550788.jpg","field_article_state":null,"field_article_lead":"Kuala Lumpur: Berbaki empat hari sebelum saingan badminton berpasukan Sukan Asia Aichi-Nagoya 2026 bermula, skuad wanita negara dibayangi kebimbangan susulan kecederaan buku lali kiri yang dialami pemain beregu, Noraqilah Maisarah Ramdan.","body":"&lt;p&gt;sukan@hmetro.com.my&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kuala Lumpur: Berbaki empat hari sebelum saingan badminton berpasukan Sukan Asia Aichi-Nagoya 2026 bermula, skuad wanita negara dibayangi kebimbangan susulan kecederaan buku lali kiri yang dialami pemain beregu, Noraqilah Maisarah Ramdan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Noraqilah yang bergandingan bersama Low Zi Yu berlepas ke Jepun hari ini dalam keadaan masih belum pulih selepas mengalami kecederaan berkenaan ketika sesi latihan di Akademi Badminton Malaysia (ABM), Khamis lalu.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Bagaimanapun, masalah itu tidak mematahkan semangat pemain muda itu yang tetap berhasrat membuat penampilan sulung di Sukan Asia, malah sanggup menahan kesakitan demi peluang beraksi bersama pasukan negara.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Noraqilah berkata, keadaannya kini semakin baik berbanding hari pertama mengalami kecederaan, namun masih perlu melihat perkembangan selepas menjalani pemeriksaan lanjut di Jepun.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\"Saya rasa semakin baik daripada hari pertama saya alami kecederaan tu. Tapi masih tak tahu lagi, kena pergi sana dulu tengok macam mana.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\"Sejak beberapa hari ini saya fokus kepada pemulihan. Ada juga latihan di gelanggang cuma kurang pergerakan,\" katanya ketika ditemui di ABM sebelum berlepas ke Jepun, hari ini.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Katanya, dia sedikit kecewa ketika mula mengalami kecederaan itu, namun kini lebih positif selepas keadaan bertambah baik.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\"Sedih sedikitlah masa baru kena itu, tapi saya rasa sekarang sudah okey. Jalan semua dah okey,\" katanya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Zi Yu-Noraqilah yang menduduki ranking ke-49 dunia dijadual beraksi dalam acara berpasukan dan individu.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Selain Zi Yu-Noraqilah dan pasangan utama negara Pearly Tan-M Thinaah, Malaysia turut memiliki pilihan menerusi pemain beregu campuran Cheng Su Yin dan Shevon Lai Jemie bagi acara berpasukan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Sementara itu, Zi Yu mengakui masih belum pasti sama ada mereka akan digandingkan bersama dalam saingan berpasukan sekiranya keadaan Noraqilah tidak mengizinkan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Katanya, keputusan berkenaan bergantung kepada perancangan barisan kejurulatihan negara.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Dalam pada itu, Noraqilah berkata, walaupun jurulatih memberi pilihan untuk tidak beraksi sekiranya kesakitan berterusan, dia tetap mahu mencuba selepas dinilai pasukan perubatan di Jepun.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\"Jurulatih cakap kalau rasa tak boleh, lebih baik tak payah main dulu tetapi pada masa sama dia cakap pergi dulu dan tengok doktor di sana cakap apa. Akan ada lagi satu pemeriksaan di sana nanti.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\"Sudah tentu saya mahu bermain di Sukan Asia,\" katanya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;\/p&gt;\n&lt;p&gt;Kuala Lumpur: Berbaki empat hari sebelum saingan badminton berpasukan Sukan Asia Aichi-Nagoya 2026 bermula, skuad wanita negara dibayangi kebimbangan susulan kecederaan buku lali kiri yang dialami pemain beregu, Noraqilah Maisarah Ramdan.&lt;\/p&gt;\n&lt;p&gt;Noraqilah yang bergandingan bersama Low Zi Yu berlepas ke Jepun hari ini dalam keadaan masih belum pulih selepas mengalami kecederaan berkenaan ketika sesi latihan di Akademi Badminton Malaysia (ABM), Khamis lalu.&lt;\/p&gt;\n&lt;p&gt;Bagaimanapun, masalah itu tidak mematahkan semangat pemain muda itu yang tetap berhasrat membuat penampilan sulung di Sukan Asia, malah sanggup menahan kesakitan demi peluang beraksi bersama pasukan negara.&lt;\/p&gt;\n&lt;p&gt;Noraqilah berkata, keadaannya kini semakin baik berbanding hari pertama mengalami kecederaan, namun masih perlu melihat perkembangan selepas menjalani pemeriksaan lanjut di Jepun.&lt;\/p&gt;\n&lt;p&gt;\"Saya rasa semakin baik daripada hari pertama saya alami kecederaan tu. Tapi masih tak tahu lagi, kena pergi sana dulu tengok macam mana.&lt;\/p&gt;\n&lt;p&gt;\"Sejak beberapa hari ini saya fokus kepada pemulihan. Ada juga latihan di gelanggang cuma kurang pergerakan,\" katanya ketika ditemui di ABM sebelum berlepas ke Jepun, hari ini.&lt;\/p&gt;\n&lt;p&gt;Katanya, dia sedikit kecewa ketika mula mengalami kecederaan itu, namun kini lebih positif selepas keadaan bertambah baik.&lt;\/p&gt;\n&lt;p&gt;\"Sedih sedikitlah masa baru kena itu, tapi saya rasa sekarang sudah okey. Jalan semua dah okey,\" katanya.&lt;\/p&gt;\n&lt;p&gt;Zi Yu-Noraqilah yang menduduki ranking ke-49 dunia dijadual beraksi dalam acara berpasukan dan individu.&lt;\/p&gt;\n&lt;p&gt;Selain Zi Yu-Noraqilah dan pasangan utama negara Pearly Tan-M Thinaah, Malaysia turut memiliki pilihan menerusi pemain beregu campuran Cheng Su Yin dan Shevon Lai Jemie bagi acara berpasukan.&lt;\/p&gt;\n&lt;p&gt;Sementara itu, Zi Yu mengakui masih belum pasti sama ada mereka akan digandingkan bersama dalam saingan berpasukan sekiranya keadaan Noraqilah tidak mengizinkan.&lt;\/p&gt;\n&lt;p&gt;Katanya, keputusan berkenaan bergantung kepada perancangan barisan kejurulatihan negara.&lt;\/p&gt;\n&lt;p&gt;Dalam pada itu, Noraqilah berkata, walaupun jurulatih memberi pilihan untuk tidak beraksi sekiranya kesakitan berterusan, dia tetap mahu mencuba selepas dinilai pasukan perubatan di Jepun.&lt;\/p&gt;\n&lt;p&gt;\"Jurulatih cakap kalau rasa tak boleh, lebih baik tak payah main dulu tetapi pada masa sama dia cakap pergi dulu dan tengok doktor di sana cakap apa. Akan ada lagi satu pemeriksaan di sana nanti.&lt;\/p&gt;\n&lt;p&gt;\"Sudah tentu saya mahu bermain di Sukan Asia,\" katanya.&lt;\/p&gt;\n&lt;\/div&gt;","word_count":340,"og_description":"Kuala Lumpur: Berbaki empat hari sebelum saingan badminton berpasukan Sukan Asia Aichi-Nagoya 2026 bermula, skuad wanita negara dibayangi kebimbangan susulan kecederaan buku lali kiri yang dialami pemain beregu, Noraqilah Maisarah Ramdan."}' :nid="1411512" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_instream_player&amp;description_url=https%3A%2F%2Fwww.hmetro.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;vid_d=6000&amp;unviewed_position_start=1&amp;output=xml_vast2&amp;ad_rule=1&amp;env=vp&amp;impl=s&amp;correlator=" :is-sponsered="false"></article-component>
