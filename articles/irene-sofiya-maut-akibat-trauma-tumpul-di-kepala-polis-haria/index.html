ssets.hmetro.com.my\/images\/articles\/kl-trauma_HMfield_image_variasi.var_1791194614.jpg&quot;,&quot;field_image_listing_featured&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/kl-trauma_HMfield_image_listing_featured_v2.var_1791194616.jpg&quot;,&quot;field_image_listing_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/kl-trauma_HMfield_image_listing_th.var_1791194612.jpg&quot;,&quot;field_image_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/kl-trauma_HMfield_image_th.var_1791194613.jpg&quot;,&quot;field_article_state&quot;:null,&quot;field_article_lead&quot;:&quot;Kuala Lumpur: Kecederaan trauma tumpul di bahagian kepala disahkan sebagai punca kematian tragis seorang pelajar perempuan berusia 16 tahun yang dipercayai dibunuh di sebuah dewan sekolah di Yong Peng, Batu Pahat, Johor, kelmarin.&quot;,&quot;body&quot;:&quot;&lt;p&gt;hafidzul@hmetro.com.my&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kuala Lumpur: Kecederaan trauma tumpul di bahagian kepala disahkan sebagai punca kematian tragis seorang pelajar perempuan berusia 16 tahun yang dipercayai dibunuh di sebuah dewan sekolah di Yong Peng, Batu Pahat, Johor, kelmarin.&lt;\/p&gt;&lt;p&gt;Pengarah Jabatan Siasatan Jenayah (JSJ) Bukit Aman, Datuk M Kumar berkata, perkara berkenaan disahkan menerusi proses bedah siasat yang dijalankan oleh Pakar Patologi Forensik di Hospital Sultanah Nora Ismail, Batu Pahat, semalam.&lt;\/p&gt;&lt;p&gt;Susulan kejadian yang menggemparkan itu, beliau memberi jaminan penuh  siasatan yang sedang dijalankan oleh Polis Diraja Malaysia (PDRM) adalah terperinci dan tiada sebarang usaha menyembunyikan fakta daripada masyarakat.&lt;\/p&gt;&lt;p&gt;\&quot;PDRM turut memberi jaminan akan dijalankan secara menyeluruh, telus dan profesional tanpa sebarang elemen '&lt;em&gt;cover-up&lt;\/em&gt;' atau melindungi mana-mana pihak,\&quot; katanya dalam kenyataan, hari ini.&lt;\/p&gt;&lt;p&gt;Menurutnya, siasatan kes itu kini berjalan lancar dan turut mendapat kerjasama penuh daripada pihak sekolah terbabit serta Kementerian Pendidikan Malaysia (KPM).&lt;\/p&gt;&lt;p&gt;M Kumar berkata, polis sudah menahan seorang remaja lelaki berusia 16 tahun pada 3 Oktober, iaitu pada hari kejadian.&lt;\/p&gt;&lt;p&gt; \&quot;Suspek kini dikenakan perintah reman selama enam hari bermula 4 hingga 9 Oktober ini selepas permohonan reman terhadapnya dibenarkan oleh Majistret.&lt;\/p&gt;&lt;p&gt;\&quot;Kes berkenaan sedang disiasat secara terperinci oleh Bahagian Siasatan Jenayah, Ibu Pejabat Polis Daerah (IPD) Batu Pahat di bawah Seksyen 302 Kanun Keseksaan iaitu membunuh,\&quot; katanya.&lt;\/p&gt;&lt;p&gt;Dalam pada itu, beliau menggesa orang awam supaya menjaga sensitiviti dan menghentikan penyebaran maklumat palsu berhubung insiden berkenaan.&lt;\/p&gt;&lt;p&gt;\&quot;Kes masih di peringkat siasatan dan orang ramai dinasihatkan supaya tidak membuat spekulasi atau memberi sebarang komen yang boleh mengganggu proses siasatan atau memanipulasi fakta dengan tujuan menyebabkan kegusaran kepada masyarakat,\&quot; katanya.&lt;\/p&gt;&lt;p&gt;Terdahulu, seorang pelajar perempuan tingkatan empat ditemui maut dipercayai dibunuh di sebuah sekolah menengah di Yong Peng, Batu Pahat, Johor sini, 3 Oktober lalu.&lt;\/p&gt;&lt;p&gt;Mangsa berusia 16 tahun ditemui neneknya yang datang ke sekolah berkenaan selepas menyedari cucunya tidak pulang ke rumah kira-kira 5.30 petang.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;&lt;ul&gt;&lt;\/p&gt;&lt;p&gt;&lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1419154\/irene-sofiya-cemerlang-akademik-disayangi-guru-rakan\&quot;&gt;Irene Sofiya cemerlang akademik, disayangi guru, rakan&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt;&lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1419148\/dewan-sekolah-lokasi-irene-sofiya-maut-tiada-cctv-kpm-akan-ambil-tindakan\&quot;&gt;Dewan sekolah lokasi Irene Sofiya maut tiada CCTV, KPM akan ambil tindakan segera&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt;&lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1419141\/kpm-nafi-dakwaan-irene-sofiya-diheret-dari-surau-jangan-tambah-luka-dengan\&quot;&gt;KPM nafi dakwaan Irene Sofiya diheret dari surau, jangan tambah luka dengan spekulasi - Fadhlina&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt;&lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1419120\/kes-bunuh-irene-sofiya-jpnj-sedia-khidmat-kaunseling\&quot;&gt;JPNJ sedia khidmat kaunseling&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt; &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/utama\/2026\/10\/1419016\/saya-akan-terus-berjuang-agar-anak-saya-mendapat-keadilan-bapa-irene-sofiya\&quot;&gt;'Saya akan terus berjuang agar anak saya mendapat keadilan' - Bapa Irene Sofiya&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt; &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1419001\/jenazah-irene-sofiya-selamat-dikebumikan\&quot;&gt;Jenazah Irene Sofiya selamat dikebumikan&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt; &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1418976\/rumah-nenek-irene-sofiya-terus-jadi-tumpuan\&quot;&gt;Rumah nenek Irene Sofiya terus jadi tumpuan&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt; &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1418956\/kes-bunuh-irene-sofiya-ragut-impian-mahu-jadi-doktor-pakar-sakit-puan\&quot;&gt;Kes bunuh Irene Sofiya ragut impian mahu jadi doktor pakar sakit puan&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt; &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/utama\/2026\/10\/1418928\/nampak-kaki-irene-sofiya-bawah-pentas-rakan-jerit-panggil-pengawal-keselamatan\&quot;&gt;Nampak kaki Irene Sofiya bawah pentas, rakan jerit panggil pengawal keselamatan&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt; &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1418840\/kes-bunuh-pelajar-fadhlina-arah-semua-pihak-bawah-kpm-diperiksa-secara\&quot;&gt;Fadhlina arah semua pihak bawah KPM diperiksa secara menyeluruh&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt; &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/utama\/2026\/10\/1418823\/kes-bunuh-pelajar-polis-rampas-selipar-telefon-pakaian\&quot;&gt;Polis rampas selipar, telefon, pakaian&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt; &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/utama\/2026\/10\/1418808\/kes-bunuh-pelajar-rakan-sekelas-direman-6-hari\&quot;&gt;Rakan sekelas direman 6 hari&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt; &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/utama\/2026\/10\/1418746\/kes-bunuh-pelajar-3-pelajar-lelaki-ditahan-seorang-direman-pagi-ini\&quot;&gt;3 pelajar lelaki ditahan&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt; &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1418744\/pelajar-dibunuh-di-sekolah-kerajaan-johor-tak-kompromi-serah-siasatan\&quot;&gt;Kerajaan Johor tak kompromi, serah siasatan penuh kepada polis&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt; &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/utama\/2026\/10\/1418736\/saya-tak-dapat-bayangkan-kesakitan-kesengsaraan-dia-tanggung-ibu-saudara\&quot;&gt;'Saya tak dapat bayangkan kesakitan, kesengsaraan dia tanggung' - Ibu saudara pelajar dibunuh&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt; &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1418725\/irene-sofiya-pelajar-harapan-sekolah-prospek-9a-spm-rakan-pelajar-dibunuh\&quot;&gt;Irene Sofiya pelajar harapan sekolah, prospek 9A SPM - Rakan pelajar dibunuh&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt; &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/utama\/2026\/10\/1418721\/saya-peluk-fiya-sambil-mengajarnya-mengucap-kalimah-syahadah-nenek-pelajar\&quot;&gt;'Saya peluk Fiya sambil mengajarnya mengucap kalimah syahadah' - Nenek pelajar dibunuh&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt; &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/utama\/2026\/10\/1418664\/pelajar-ditemui-maut-di-sekolah-di-yong-peng-disyaki-dibunuh\&quot;&gt;Pelajar ditemui maut di sekolah di Yong Peng, disyaki dibunuh&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt;&lt;\/ul&gt;&lt;\/p&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;body_with_inline&quot;:&quot;&lt;div itemprop=\&quot;articleBody\&quot; class=\&quot;dable-content-wrapper\&quot;&gt;&lt;\/p&gt;\n&lt;p&gt;Kuala Lumpur: Kecederaan trauma tumpul di bahagian kepala disahkan sebagai punca kematian tragis seorang pelajar perempuan berusia 16 tahun yang dipercayai dibunuh di sebuah dewan sekolah di Yong Peng, Batu Pahat, Johor, kelmarin.&lt;\/p&gt;\n&lt;p&gt;Pengarah Jabatan Siasatan Jenayah (JSJ) Bukit Aman, Datuk M Kumar berkata, perkara berkenaan disahkan menerusi proses bedah siasat yang dijalankan oleh Pakar Patologi Forensik di Hospital Sultanah Nora Ismail, Batu Pahat, semalam.&lt;\/p&gt;\n&lt;p&gt;Susulan kejadian yang menggemparkan itu, beliau memberi jaminan penuh  siasatan yang sedang dijalankan oleh Polis Diraja Malaysia (PDRM) adalah terperinci dan tiada sebarang usaha menyembunyikan fakta daripada masyarakat.&lt;\/p&gt;\n&lt;p&gt;\&quot;PDRM turut memberi jaminan akan dijalankan secara menyeluruh, telus dan profesional tanpa sebarang elemen '&lt;em&gt;cover-up&lt;\/em&gt;' atau melindungi mana-mana pihak,\&quot; katanya dalam kenyataan, hari ini.&lt;\/p&gt;\n&lt;p&gt;Menurutnya, siasatan kes itu kini berjalan lancar dan turut mendapat kerjasama penuh daripada pihak sekolah terbabit serta Kementerian Pendidikan Malaysia (KPM).&lt;\/p&gt;\n&lt;p&gt;M Kumar berkata, polis sudah menahan seorang remaja lelaki berusia 16 tahun pada 3 Oktober, iaitu pada hari kejadian.&lt;\/p&gt;\n&lt;p&gt; \&quot;Suspek kini dikenakan perintah reman selama enam hari bermula 4 hingga 9 Oktober ini selepas permohonan reman terhadapnya dibenarkan oleh Majistret.&lt;\/p&gt;\n&lt;p&gt;\&quot;Kes berkenaan sedang disiasat secara terperinci oleh Bahagian Siasatan Jenayah, Ibu Pejabat Polis Daerah (IPD) Batu Pahat di bawah Seksyen 302 Kanun Keseksaan iaitu membunuh,\&quot; katanya.&lt;\/p&gt;\n&lt;p&gt;Dalam pada itu, beliau menggesa orang awam supaya menjaga sensitiviti dan menghentikan penyebaran maklumat palsu berhubung insiden berkenaan.&lt;\/p&gt;\n&lt;p&gt;\&quot;Kes masih di peringkat siasatan dan orang ramai dinasihatkan supaya tidak membuat spekulasi atau memberi sebarang komen yang boleh mengganggu proses siasatan atau memanipulasi fakta dengan tujuan menyebabkan kegusaran kepada masyarakat,\&quot; katanya.&lt;\/p&gt;\n&lt;p&gt;Terdahulu, seorang pelajar perempuan tingkatan empat ditemui maut dipercayai dibunuh di sebuah sekolah menengah di Yong Peng, Batu Pahat, Johor sini, 3 Oktober lalu.&lt;\/p&gt;\n&lt;p&gt;Mangsa berusia 16 tahun ditemui neneknya yang datang ke sekolah berkenaan selepas menyedari cucunya tidak pulang ke rumah kira-kira 5.30 petang.&lt;\/p&gt;\n&lt;p&gt;\n&lt;\/p&gt;&lt;ul&gt;&lt;p&gt;\n&lt;\/p&gt;&lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1419154\/irene-sofiya-cemerlang-akademik-disayangi-guru-rakan\&quot;&gt;Irene Sofiya cemerlang akademik, disayangi guru, rakan&lt;\/a&gt;&lt;\/li&gt;\n\n&lt;p&gt;\n&lt;\/p&gt;&lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1419148\/dewan-sekolah-lokasi-irene-sofiya-maut-tiada-cctv-kpm-akan-ambil-tindakan\&quot;&gt;Dewan sekolah lokasi Irene Sofiya maut tiada CCTV, KPM akan ambil tindakan segera&lt;\/a&gt;&lt;\/li&gt;\n\n&lt;p&gt;\n&lt;\/p&gt;&lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1419141\/kpm-nafi-dakwaan-irene-sofiya-diheret-dari-surau-jangan-tambah-luka-dengan\&quot;&gt;KPM nafi dakwaan Irene Sofiya diheret dari surau, jangan tambah luka dengan spekulasi - Fadhlina&lt;\/a&gt;&lt;\/li&gt;\n\n&lt;p&gt;\n&lt;\/p&gt;&lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1419120\/kes-bunuh-irene-sofiya-jpnj-sedia-khidmat-kaunseling\&quot;&gt;JPNJ sedia khidmat kaunseling&lt;\/a&gt;&lt;\/li&gt;\n\n&lt;p&gt;\n&lt;\/p&gt;&lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/utama\/2026\/10\/1419016\/saya-akan-terus-berjuang-agar-anak-saya-mendapat-keadilan-bapa-irene-sofiya\&quot;&gt;'Saya akan terus berjuang agar anak saya mendapat keadilan' - Bapa Irene Sofiya&lt;\/a&gt;&lt;\/li&gt;\n\n&lt;p&gt;\n&lt;\/p&gt;&lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1419001\/jenazah-irene-sofiya-selamat-dikebumikan\&quot;&gt;Jenazah Irene Sofiya selamat dikebumikan&lt;\/a&gt;&lt;\/li&gt;\n\n&lt;p&gt;\n&lt;\/p&gt;&lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1418976\/rumah-nenek-irene-sofiya-terus-jadi-tumpuan\&quot;&gt;Rumah nenek Irene Sofiya terus jadi tumpuan&lt;\/a&gt;&lt;\/li&gt;\n\n&lt;p&gt;\n&lt;\/p&gt;&lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1418956\/kes-bunuh-irene-sofiya-ragut-impian-mahu-jadi-doktor-pakar-sakit-puan\&quot;&gt;Kes bunuh Irene Sofiya ragut impian mahu jadi doktor pakar sakit puan&lt;\/a&gt;&lt;\/li&gt;\n\n&lt;p&gt;\n&lt;\/p&gt;&lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/utama\/2026\/10\/1418928\/nampak-kaki-irene-sofiya-bawah-pentas-rakan-jerit-panggil-pengawal-keselamatan\&quot;&gt;Nampak kaki Irene Sofiya bawah pentas, rakan jerit panggil pengawal keselamatan&lt;\/a&gt;&lt;\/li&gt;\n\n&lt;p&gt;\n&lt;\/p&gt;&lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/mutakhir\/2026\/10\/1418840\/kes-bunuh-pelajar-fadhlina-arah-semua-pihak-bawah-kpm-diperiksa-secara\&quot;&gt;Fadhlina arah semua pihak bawah KPM diperiksa secara menyeluruh&lt;\/a&gt;&lt;\/li&gt;\n\n&lt;p&gt;\n&lt;\/p&gt;&lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/utama\/2026\/10\/1418823\/kes-bunuh-pelajar-polis-rampas-selipar-telefon-pakaian\&quot;&gt;Polis rampas selipar, telefon, pakaian&lt;\/a&gt;&lt;\/li&gt;\n\n&lt;p&gt;\n&lt;\/p&gt;&lt;li&gt;&lt;a href=\&qu
