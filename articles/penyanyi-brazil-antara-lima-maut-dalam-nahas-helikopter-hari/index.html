o Paulo: Lima individu termasuk penyanyi Brazil Rick Sollo daripada pasangan penyanyi muzik sertanejo Rick &amp; Renner ditemukan maut pada Selasa selepas helikopter dinaiki mereka terhempas di kawasan pergunungan di negeri Santa Catarina, selatan Brazil, menurut jabatan bomba, lapor Xinhua.&lt;\/p&gt;&lt;p&gt;Helikopter itu dilaporkan hilang pada Isnin selepas berlepas dari Porto Belo di pantai utara negeri itu menuju ke Sao Joaquim, yang diramalkan mengalami cuaca buruk dan ribut petir.&lt;\/p&gt;&lt;p&gt;Turut berada di dalam helikopter itu ialah ahli perniagaan Bruno Avelar, jurukamera Paulo Soares, juruterbang dan pembantu juruterbang.&lt;\/p&gt;&lt;p&gt;Bangkai helikopter itu ditemukan pada Selasa dalam operasi pencarian yang membabitkan kira-kira 40 anggota bomba, lebih 10 kenderaan dan dron, dua anjing pengesan serta sebuah pesawat dalam keadaan berkabut.&lt;\/p&gt;&lt;p&gt;Agensi penerbangan awam Brazil memaklumkan pesawat jenis Bell 430 yang dihasilkan pada 2001 itu mempunyai kebenaran untuk beroperasi.&lt;\/p&gt;&lt;p&gt;Rick &amp; Renner adalah antara pasangan penyanyi muzik sertanejo paling terkenal di Brazil, dengan kerjaya mereka bermula sejak 1980-an.&lt;\/p&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;p&gt;Sao Paulo: Lima individu termasuk penyanyi Brazil Rick Sollo daripada pasangan penyanyi muzik sertanejo Rick &amp;amp; Renner ditemukan maut pada Selasa selepas helikopter dinaiki mereka terhempas di kawasan pergunungan di negeri Santa Catarina, selatan Brazil, menurut jabatan bomba, lapor Xinhua.&lt;\/p&gt;\n&lt;p&gt;Helikopter itu dilaporkan hilang pada Isnin selepas berlepas dari Porto Belo di pantai utara negeri itu menuju ke Sao Joaquim, yang diramalkan mengalami cuaca buruk dan ribut petir.&lt;\/p&gt;\n&lt;p&gt;Turut berada di dalam helikopter itu ialah ahli perniagaan Bruno Avelar, jurukamera Paulo Soares, juruterbang dan pembantu juruterbang.&lt;\/p&gt;\n&lt;p&gt;Bangkai helikopter itu ditemukan pada Selasa dalam operasi pencarian yang membabitkan kira-kira 40 anggota bomba, lebih 10 kenderaan dan dron, dua anjing pengesan serta sebuah pesawat dalam keadaan berkabut.&lt;\/p&gt;\n&lt;p&gt;Agensi penerbangan awam Brazil memaklumkan pesawat jenis Bell 430 yang dihasilkan pada 2001 itu mempunyai kebenaran untuk beroperasi.&lt;\/p&gt;\n&lt;p&gt;Rick &amp;amp; Renner adalah antara pasangan penyanyi muzik sertanejo paling terkenal di Brazil, dengan kerjaya mereka bermula sejak 1980-an.&lt;\/p&gt;\n&lt;\/div&gt;","word_count":146,"og_description":"Sao Paulo: Lima individu termasuk penyanyi Brazil Rick Sollo daripada pasangan penyanyi muzik sertanejo Rick &amp; Renner ditemukan maut pada Selasa selepas helikopter dinaiki mereka terhempas di kawasan pergunungan di negeri Santa Catarina, selatan Brazil, menurut jabatan bomba, lapor Xinhua."}' :nid="1414334" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_instream_player&amp;description_url=https%3A%2F%2Fwww.hmetro.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;vid_d=6000&amp;unviewed_position_start=1&amp;output=xml_vast2&amp;ad_rule=1&amp;env=vp&amp;impl=s&amp;correlator=" :is-sponsered="false"></article-component>
