 Datuk direman lima hari bagi membantu siasatan kes bersubahat menyeleweng dan menyalahgunakan kedudukan dalam urusan pelaburan sebanyak kira-kira RM10 juta.&lt;\/p&gt;&lt;p&gt; Perintah reman terhadap dua beradik berusia lingkungan 40-an dan 50-an itu sehingga 5 Oktober ini dikeluarkan Majistret Ezrene Zakariah selepas permohonan Suruhanjaya Pencegahan Rasuah Malaysia (SPRM) di Mahkamah Majistret Putrajaya, pagi tadi.&lt;\/p&gt;&lt;p&gt; Kedua-dua suspek ditahan kira-kira jam 9 malam, semalam, ketika hadir memberi keterangan di Ibu Pejabat SPRM Putrajaya.&lt;\/p&gt;&lt;p&gt; Menurut sumber, siasatan awal mendapati kedua-dua suspek disyaki bersubahat melakukan perbuatan itu pada penghujung 2020.&lt;\/p&gt;&lt;p&gt; \"Kedua-dua suspek dipercayai bersubahat dengan seorang pegawai sebuah yayasan berasaskan pendidikan untuk meluluskan pelaburan berjumlah kira-kira RM10 juta.&lt;\/p&gt;&lt;p&gt; \"Pelaburan itu disalurkan kepada sebuah syarikat pelaburan milik abang kepada suspek pertama yang bergelar Datuk Seri berusia lingkungan 40-an,\" katanya.&lt;\/p&gt;&lt;p&gt; Sumber berkata, SPRM turut menyita pelbagai aset dan barangan termasuk 15 kereta mewah serta 12 motosikal berkuasa tinggi dalam siasatan berkenaan.&lt;\/p&gt;&lt;p&gt; \"Turut disita lima jam tangan mewah, tiga gelang tangan dan wang tunai berjumlah kira-kira RM30,000.&lt;\/p&gt;&lt;p&gt; \"Sitaan dibuat susulan siasatan yang dijalankan terhadap kedua-dua suspek,\" katanya.&lt;\/p&gt;&lt;p&gt; Sementara itu, Ketua Pesuruhjaya SPRM, Datuk Seri Abd Halim Aman, ketika dihubungi mengesahkan penahanan kedua-dua suspek.&lt;\/p&gt;&lt;p&gt; Beliau berkata, kes disiasat mengikut Seksyen 23 Akta SPRM 2009.&lt;\/p&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;\/p&gt;\n&lt;p&gt;Kuala Lumpur: Dua tokoh korporat adik-beradik bergelar Datuk Seri dan Datuk direman lima hari bagi membantu sia
