      <h1>&#039;Dancing with the Stars&#039; is back! See the highlights from Season 35 premiere</h1>
      <div style="color:#6b7280;font-size:.9rem">TheTools · 21.09.2026 23:55 · <a href="https://www.usatoday.com/picture-gallery/entertainment/tv-streaming/2026/09/20/dancing-with-the-stars-season-35-premiere-photos/91823715007/" target="_blank" rel="noopener">source</a> · <a href="https://viral-news.eu/articles/dancing-with-the-stars-is-back-see-the-highlights-from-seaso/">permalink</a></div>
      <div class="content"><figure class="gnt_em gnt_em__fp gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823623007-183407-em-109745.jpg?width=660&amp;height=440&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="&quot;Dancing with the Stars&quot; Season 35 is officially in full swing! See all the highlights from this week's premiere."></picture><div>"Dancing with the Stars" Season 35 is officially in full swing!<br><br>See all the highlights from this week's premiere.</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823615007-183407-em-100206.jpg?width=660&amp;height=528&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="The male celebrities took the ballroom floor first, each performing to a No. 1 song from the year they were born, with one star eliminated at the end of the night. Musician Taylor Hanson and partner Britt Stewart danced a Quickstep to Billy Joel's 1983 hit, “Tell Her About It.&quot;"></picture><div>The male celebrities took the ballroom floor first, each performing to a No. 1 song from the year they were born, with one star eliminated at the end of the night. Musician Taylor Hanson and partner Britt Stewart danced a Quickstep to Billy Joel's 1983 hit, “Tell Her About It."</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823624007-183407-em-100441.jpg?width=660&amp;height=528&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="&quot;Glee&quot; and &quot;Grey's Anatomy&quot; actor Harry Shum Jr. and partner Jenna Johnson wowed the crowd with their Cha Cha, dancing to &quot;Let’s Groove” by Earth, Wind &amp; Fire."></picture><div>"Glee" and "Grey's Anatomy" actor Harry Shum Jr. and partner Jenna Johnson wowed the crowd with their Cha Cha, dancing to "Let’s Groove” by Earth, Wind &amp; Fire.</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/16/USAT/91799295007-183407-em-108934.jpg?width=660&amp;height=528&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="&quot;Secret Lives of Mormon Wives&quot; star Conner Leavitt and first-time pro partner Adele Zaikman danced a salsa to 1993's “Whoomp! There It Is” by Tag Team. However, their efforts were not enough and the two were eliminated from the competition at the end of the night."></picture><div>"Secret Lives of Mormon Wives" star Conner Leavitt and first-time pro partner Adele Zaikman danced a salsa to 1993's “Whoomp! There It Is” by Tag Team. However, their efforts were not enough and the two were eliminated from the competition at the end of the night.</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823629007-183408-em-208975.jpg?width=660&amp;height=440&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="After night one ended Conner Leavitt and Adele Zaikman's elimination, night two saw the female celebrities make their competition debut. Harry Shum Jr. and Jenna Johnson were able to relax and watch from the crowd."></picture><div>After night one ended Conner Leavitt and Adele Zaikman's elimination, night two saw the female celebrities make their competition debut. Harry Shum Jr. and Jenna Johnson were able to relax and watch from the crowd.</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823621007-183408-em-208858.jpg?width=660&amp;height=440&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="After dancing a cha-cha to Santana and Rob Thomas' &quot;Smooth,&quot; Olympic ice skater Amber Glenn and partner Pasha Pashkov got positive feedback from judges Carrie Ann Inaba, Derek Hough and Bruno Tonioli."></picture><div>After dancing a cha-cha to Santana and Rob Thomas' "Smooth," Olympic ice skater Amber Glenn and partner Pasha Pashkov got positive feedback from judges Carrie Ann Inaba, Derek Hough and Bruno Tonioli.</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823634007-183408-em-208898.jpg?width=528&amp;height=660&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt='Amber Glenn and Pasha Pashkov received an 18/30 on their dance, which the pro dancer called "a great start" for their partnership.'></picture><div>Amber Glenn and Pasha Pashkov received an 18/30 on their dance, which the pro dancer called "a great start" for their partnership.</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823617007-183408-em-102831.jpg?width=528&amp;height=660&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="&quot;Summer House&quot; star Ciara Miller and partner Brandon Armstrong danced a foxtrot to Whitney Houston's &quot;Exhale (Shoop Shoop).&quot;"></picture><div>"Summer House" star Ciara Miller and partner Brandon Armstrong danced a foxtrot to Whitney Houston's "Exhale (Shoop Shoop)."</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823626007-183408-em-209068.jpg?width=528&amp;height=660&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt='Ciara Miller and Brandon Armstrong ultimately earned a 15/30 for their routine, which Miller dedicated to her friends who "held me up in the past year."'></picture><div>Ciara Miller and Brandon Armstrong ultimately earned a 15/30 for their routine, which Miller dedicated to her friends who "held me up in the past year."</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823630007-183408-em-103343.jpg?width=660&amp;height=528&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt='"Dancing with the Stars" also introduced its new dance troupe during the two-night premiere, featuring Onye Stevenson, Carter Williams, Jaxon Willard, Kamri Peterson.'></picture><div>"Dancing with the Stars" also introduced its new dance troupe during the two-night premiere, featuring Onye Stevenson, Carter Williams, Jaxon Willard, Kamri Peterson.</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823625007-183408-em-103715.jpg?width=660&amp;height=440&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="&quot;The Traitors&quot; and &quot;Love Island&quot; alum Maura Higgins topped the leaderboard with her partner Mark Ballas, performing an impressive foxtrot to Alannah Myles' &quot;Black Velvet.&quot;"></picture><div>"The Traitors" and "Love Island" alum Maura Higgins topped the leaderboard with her partner Mark Ballas, performing an impressive foxtrot to Alannah Myles' "Black Velvet."</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823620007-183408-em-103809.jpg?width=440&amp;height=660&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="Maura Higgins and Mark Ballas received positive feedback from the judges, who were impressed with their routine."></picture><div>Maura Higgins and Mark Ballas received positive feedback from the judges, who were impressed with their routine.</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823622007-183408-em-209531.jpg?width=660&amp;height=528&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="Maura Higgins was shocked to learn she and Mark Ballas earned a 21/30, putting them at the top of the leaderboard."></picture><div>Maura Higgins was shocked to learn she and Mark Ballas earned a 21/30, putting them at the top of the leaderboard.</div>Eric McCandless, Disney</figure><figure cla 28&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="&quot;The Rookie&quot; actress Jenna Dewan returned to her dance roots with partner Val Chmerkovskiy as they danced a tango to Blondie's &quot;Call Me&quot;."></picture><div>"The Rookie" actress Jenna Dewan returned to her dance roots with partner Val Chmerkovskiy as they danced a tango to Blondie's "Call Me".</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823633007-183408-em-208572.jpg?width=660&amp;height=440&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="Derek Hough and wife Hayley Erbert Hough performed a routine from their live tour, inspired by Erbert's resilience over the last few years after a health scare."></picture><div>Derek Hough and wife Hayley Erbert Hough performed a routine from their live tour, inspired by Erbert's resilience over the last few years after a health scare.</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823616007-183408-em-101808.jpg?width=660&amp;height=440&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="Hayley Erbert Hough's performance was also inspired by a rose, which was reflected in her billowing red dress."></picture><div>Hayley Erbert Hough's performance was also inspired by a rose, which was reflected in her billowing red dress.</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823636007-183408-em-209825.jpg?width=660&amp;height=440&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="At the end of night two, hosts Julianne Hough and Alfonso Ribeiro had to announce which couple was being eliminated from the show."></picture><div>At the end of night two, hosts Julianne Hough and Alfonso Ribeiro had to announce which couple was being eliminated from the show.</div>Eric McCandless, Disney</figure><figure class="gnt_em gnt_em__lp gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/18/USAT/91823628007-183408-em-104586.jpg?width=660&amp;height=528&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="In the end, Sarah Jane Nader and Hailey Bills were the next couple eliminated from Season 35."></picture><div>In the end, Sarah Jane Nader and Hailey Bills were the next couple eliminated from Season 35.</div>Eric McCandless, Disney</figure></div>
