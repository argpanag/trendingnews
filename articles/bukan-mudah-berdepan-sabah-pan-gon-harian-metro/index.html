ndali Selangor FC, Kim Pan-gon mengakui perlawanan dengan Sabah pada saingan pertama Pusingan 16 Piala FA di Stadium Likas, di sini, malam tadi cukup sukar bagi pasukannya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Katanya, ia satu perlawanan yang mengecewakan bagi pasukannya apabila terpaksa berkongsi satu mata setelah terikat 2-2 di tangan Sabah sebagai bekalan untuk ke perlawanan kedua di halaman sendiri pada 9 September ini.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Pan Gon mahu perlawanan kedua nanti anak buahnya lebih bersedia bagi memastikan Selangor mendapat laluan untuk ke suku akhir Piala FA pada musim ini.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\"Perlawanan dengan Sabah malam ini satu permainan yang sukar bagi saya. Ia juga satu keputusan yang mengecewakan tapi kita masih ada satu lagi perlawanan nanti.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\"Jadi, kita perlu buat persediaan rapi dan buat analisis apa masalah yang berlaku pada perlawanan malam ini untuk persiapan perlawanan kedua nanti,\" katanya pada sidang media selepas perlawanan malam tadi.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Pan Gon berkata, pemain Selangor perlu melipatgandakan usaha untuk mengatasi Sabah pada perlawanan kedua nanti setelah kedudukan kedua-duanya terikat malam tadi.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Perlawanan kedua 9 September nanti, katanya menjadi penentu untuk Selangor mara ke pusingan seterusnya dalam saingan Piala FA musim ini atau sebaliknya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\"Kita perlu meningkatkan lagi usaha pada perlawanan akan datang untuk layak ke pusingan seterusnya,\" katanya.&lt;\/p&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;\/p&gt;\n&lt;p&gt;Kota Kinabalu: Pengendali Selangor FC, Kim Pan-gon mengakui perlawanan dengan Sabah pada saingan pertama Pusingan 16 Piala FA di Stadium Likas, di sini, malam tadi cukup sukar bagi pasukannya.&lt;\/p&gt;\n&lt;p&gt;Katanya, ia satu perlawanan yang mengecewakan bagi pasukannya apabila terpaksa berkongsi satu mata setelah terikat 2-2 di tangan Sabah sebagai bekalan untuk ke perlawanan kedua di halaman sendiri pada 9 September ini.&lt;\/p&gt;\n&lt;p&gt;Pan Gon mahu perlawanan kedua nanti anak buahnya lebih bersedia bagi memastikan Selangor mendapat laluan untuk ke suku akhir Piala FA pada musim ini.&lt;\/p&gt;\n&lt;p&gt;\"Perlawanan dengan Sabah malam ini satu permainan yang sukar bagi saya. Ia juga satu keputusan yang mengecewakan tapi kita masih ada satu lagi perlawanan nanti.&lt;\/p&gt;\n&lt;p&gt;\"Jadi, kita perlu buat persediaan rapi dan buat analisis apa masalah yang berlaku pada perlawanan malam ini untuk persiapan perlawanan kedua nanti,\" katanya pada sidang media selepas perlawanan malam tadi.&lt;\/p&gt;\n&lt;p&gt;Pan Gon berkata, pemain Selangor perlu melipatgandakan usaha untuk mengatasi Sabah pada perlawanan kedua nanti setelah kedudukan kedua-duanya terikat malam tadi.&lt;\/p&gt;\n&lt;p&gt;Perlawanan kedua 9 September nanti, katanya menjadi penentu untuk Selangor mara ke pusingan seterusnya dalam saingan Piala FA musim ini atau sebaliknya.&lt;\/p&gt;\n&lt;p&gt;\"Kita perlu meningkatkan lagi usaha pada perlawanan akan datang untuk layak ke pusingan seterusnya,\" katanya.&lt;\/p&gt;\n&lt;\/div&gt;","word_count":198,"og_description":"Kota Kinabalu: Pengendali Selangor FC, Kim Pan-gon mengakui perlawanan dengan Sabah pada saingan pertama Pusingan 16 Piala FA di Stadium Likas, di sini, malam tadi cukup sukar bagi pasukannya."}' :nid="1405885" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_instream_player&amp;description_url=https%3A%2F%2Fwww.hmetro.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;vid_d=6000&amp;unviewed_position_start=1&amp;output=xml_vast2&amp;ad_rule=1&amp;env=vp&amp;impl=s&amp;correlator=" :is-sponsered="false"></article-component>
