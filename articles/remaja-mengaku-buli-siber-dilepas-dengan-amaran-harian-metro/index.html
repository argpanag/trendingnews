sting_featured_v2.var_1795698271.jpg&quot;,&quot;field_image_listing_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/sabremajaa-o_HMfield_image_listing_v2.var_1795698274.jpg&quot;,&quot;field_image_socialmedia&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/sabremajaa-o_HMfield_image_socialmedia.var_1795698273.jpg&quot;,&quot;field_image_slider&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/sabremajaa-o_HMfield_image_slider_v2.var_1795698269.jpg&quot;,&quot;field_image_variasi&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/sabremajaa-o_HMfield_image_variasi_v2.var_1795698270.jpg&quot;,&quot;field_image_listing_featured&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/sabremajaa-o_HMfield_image_listing_featured_v2.var_1795698271.jpg&quot;,&quot;field_image_listing_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/sabremajaa-o_HMfield_image_listing_th.var_1795698266.jpg&quot;,&quot;field_image_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/sabremajaa-o_HMfield_image_th_v2.var_1795698272.jpg&quot;,&quot;field_article_state&quot;:null,&quot;field_article_lead&quot;:&quot;Tawau: Seorang remaja lelaki yang mengaku memuat naik gambar seorang remaja perempuan di laman sosial dengan kapsyen berunsur buli serta ugutan, dilepaskan dengan amaran oleh Mahkamah Majistret di sini, hari ini selepas dia memohon maaf secara peribadi kepada mangsa.&quot;,&quot;body&quot;:&quot;&lt;p \/&gt;&lt;p&gt;Tawau: Seorang remaja lelaki yang mengaku memuat naik gambar seorang remaja perempuan di laman sosial dengan kapsyen berunsur buli serta ugutan, dilepaskan dengan amaran oleh Mahkamah Majistret di sini, hari ini selepas dia memohon maaf secara peribadi kepada mangsa.&lt;\/p&gt;&lt;p&gt;Majistret Don Stiwin Malanjum membuat keputusan itu mengikut Seksyen 91(1)(a) Akta Kanak-Kanak 2001 (Pindaan 2016) selepas mengambil kira syor Jabatan Kebajikan Masyarakat (JKM) bahawa tindakan memberi amaran dan melepaskan remaja berusia 17 tahun itu adalah bersesuaian demi kepentingan terbaiknya, selain bertujuan memberikan pengajaran, kesedaran dan peringatan agar kesalahan sama tidak berulang.&lt;\/p&gt;&lt;p&gt;Mahkamah turut mengambil kira pengakuan anak sulung daripada lima beradik itu bahawa dia menyesali perbuatan dilakukannya dan berjanji tidak akan mengulangi kesalahan sama, selain mahu memberikan tumpuan kepada pelajaran.&lt;\/p&gt;&lt;p&gt;Mahkamah juga memerintahkan wang jaminan RM500 dikembalikan.&lt;\/p&gt;&lt;p&gt;Mengikut pertuduhan, remaja berusia 17 tahun ketika kejadian didakwa memuat naik gambar mangsa berusia 13 tahun tanpa mengetahui bahawa penerbitan, pengedaran atau penyediaan maklumat identiti berkenaan berkemungkinan menyebabkan gangguan, tekanan, ketakutan atau kebimbangan terhadap mangsa. &lt;\/p&gt;&lt;p&gt;Perbuatan itu dilakukan di sebuah restoran di sini pada 12 tengah hari, 17 April lepas, mengikut Seksyen 507E Kanun Keseksaan yang memperuntukkan hukuman penjara maksimum 20 tahun dan boleh disebat, jika sabit kesalahan.&lt;\/p&gt;&lt;p&gt;Berdasarkan fakta kes, ibu mangsa menerima mesej melalui aplikasi WhatsApp daripada rakannya yang menghantar tangkap layar memaparkan gambar anaknya di Instagram berserta beberapa kapsyen berunsur tuduhan buli dan ugutan.&lt;\/p&gt;&lt;p&gt;Hasil siasatan mendapati remaja lelaki itu bertindak memuat naik gambar mangsa selepas membaca perbualan dalam kumpulan WhatsApp yang mendakwa adik sepupu seorang rakannya dibuli oleh mangsa dan seorang lagi individu.&lt;\/p&gt;&lt;p&gt;Remaja itu mengakui terikut emosi sebelum mendapatkan gambar mangsa dan memuat naik ke Instagram 'Story' melalui akaun milik sendiri dengan kapsyen berunsur ugutan.&lt;\/p&gt;&lt;p&gt;Pendakwaan dikendalikan Pegawai Pendakwa ASP Jeffery Kadison manakala remaja lelaki itu tidak diwakili peguam.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt; &lt;\/p&gt;&lt;p&gt; &lt;\/p&gt;&lt;p&gt; &lt;\/p&gt;&lt;p&gt; &lt;\/p&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;body_with_inline&quot;:&quot;&lt;div itemprop=\&quot;articleBody\&quot; class=\&quot;dable-content-wrapper\&quot;&gt;&lt;p&gt;Tawau: Seorang remaja lelaki yang mengaku memuat naik gambar seorang remaja perempuan di laman sosial dengan kapsyen berunsur buli serta ugutan, dilepaskan dengan amaran oleh Mahkamah Majistret di sini, hari ini selepas dia memohon maaf secara peribadi kepada mangsa.&lt;\/p&gt;\n&lt;p&gt;Majistret Don Stiwin Malanjum membuat keputusan itu mengikut Seksyen 91(1)(a) Akta Kanak-Kanak 2001 (Pindaan 2016) selepas mengambil kira syor Jabatan Kebajikan Masyarakat (JKM) bahawa tindakan memberi amaran dan melepaskan remaja berusia 17 tahun itu adalah bersesuaian demi kepentingan terbaiknya, selain bertujuan memberikan pengajaran, kesedaran dan peringatan agar kesalahan sama tidak berulang.&lt;\/p&gt;\n&lt;p&gt;Mahkamah turut mengambil kira pengakuan anak sulung daripada lima beradik itu bahawa dia menyesali perbuatan dilakukannya dan berjanji tidak akan mengulangi kesalahan sama, selain mahu memberikan tumpuan kepada pelajaran.&lt;\/p&gt;\n&lt;p&gt;Mahkamah juga memerintahkan wang jaminan RM500 dikembalikan.&lt;\/p&gt;\n&lt;p&gt;Mengikut pertuduhan, remaja berusia 17 tahun ketika kejadian didakwa memuat naik gambar mangsa berusia 13 tahun tanpa mengetahui bahawa penerbitan, pengedaran atau penyediaan maklumat identiti berkenaan berkemungkinan menyebabkan gangguan, tekanan, ketakutan atau kebimbangan terhadap mangsa. &lt;\/p&gt;\n&lt;p&gt;Perbuatan itu dilakukan di sebuah restoran di sini pada 12 tengah hari, 17 April lepas, mengikut Seksyen 507E Kanun Keseksaan yang memperuntukkan hukuman penjara maksimum 20 tahun dan boleh disebat, jika sabit kesalahan.&lt;\/p&gt;\n&lt;p&gt;Berdasarkan fakta kes, ibu mangsa menerima mesej melalui aplikasi WhatsApp daripada rakannya yang menghantar tangkap layar memaparkan gambar anaknya di Instagram berserta beberapa kapsyen berunsur tuduhan buli dan ugutan.&lt;\/p&gt;\n&lt;p&gt;Hasil siasatan mendapati remaja lelaki itu bertindak memuat naik gambar mangsa selepas membaca perbualan dalam kumpulan WhatsApp yang mendakwa adik sepupu seorang rakannya dibuli oleh mangsa dan seorang lagi individu.&lt;\/p&gt;\n&lt;p&gt;Remaja itu mengakui terikut emosi sebelum mendapatkan gambar mangsa dan memuat naik ke Instagram 'Story' melalui akaun milik sendiri dengan kapsyen berunsur ugutan.&lt;\/p&gt;\n&lt;p&gt;Pendakwaan dikendalikan Pegawai Pendakwa ASP Jeffery Kadison manakala remaja lelaki itu tidak diwakili peguam.&lt;\/p&gt;\n\n\n&lt;\/div&gt;&quot;,&quot;word_count&quot;:282,&quot;og_description&quot;:&quot;Tawau: Seorang remaja lelaki yang mengaku memuat naik gambar seorang remaja perempuan di laman sosial dengan kapsyen berunsur buli serta ugutan, dilepaskan dengan amaran oleh Mahkamah Majistret di sini, hari ini selepas dia memohon maaf secara peribadi kepada mangsa.&quot;}" :nid="1441259" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_instream_player&amp;description_url=https%3A%2F%2Fwww.hmetro.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;vid_d=6000&amp;unviewed_position_start=1&amp;output=xml_vast2&amp;ad_rule=1&amp;env=vp&amp;impl=s&amp;correlator=" :is-sponsered="false"></article-component>
