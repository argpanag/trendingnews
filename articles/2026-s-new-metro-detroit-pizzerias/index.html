ow open and serving Detroit-style pizza, burgers, pepperoni balls and more at 1133 Griswold in Detroit."></picture><div>Unc's is now open and serving Detroit-style pizza, burgers, pepperoni balls and more at 1133 Griswold in Detroit.</div>Melody Baetens, The Detroit News</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/06/29/PDTN/90741927007-amelia-street-pizza-company-2.jpg?width=660&amp;height=495&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="Founder Matt Arb, seen in the mirror putting a pizza in the oven, opened Amelia Street Pizza Company in Hazel Park."></picture><div>Founder Matt Arb, seen in the mirror putting a pizza in the oven, opened Amelia Street Pizza Company in Hazel Park.</div>Melody Baetens, The Detroit News</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/06/29/PDTN/90741926007-amelia-street-pizza-company-1.jpg?width=660&amp;height=495&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="Amelia Street Pizza Company in Hazel Park is known for a half moon of freshly grated Pecorino cheese on the chewy, oven-kissed crust."></picture><div>Amelia Street Pizza Company in Hazel Park is known for a half moon of freshly grated Pecorino cheese on the chewy, oven-kissed crust.</div>Melody Baetens, The Detroit News</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/06/29/PDTN/90742162007-crust-punk-pizza.jpg?width=660&amp;height=495&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="Crust Punk pizzeria is now open at 35415 Jefferson in Harrison Township."></picture><div>Crust Punk pizzeria is now open at 35415 Jefferson in Harrison Township.</div>Melody Baetens, The Detroit News</figure><figure class="gnt_em gnt_em__lp gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/10/23/PDTN/92394641007-crust-punk-cheese.jpg?width=495&amp;height=660&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="The Bowery pizza from Crust Punk, which opened in June in Harrison Township."></picture><div>The Bowery pizza from Crust Punk, which opened in June in Harrison Township.</div>Melody Baetens, The Detroit News</figure></div>
