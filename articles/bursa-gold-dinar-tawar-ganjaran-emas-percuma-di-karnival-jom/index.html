3&quot;}],&quot;field_article_videos&quot;:null,&quot;field_image_listing_featured_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/on9-gold_HMfield_image_listing_featured_v2.var_1793344933.jpg&quot;,&quot;field_image_listing_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/on9-gold_HMfield_image_listing_v2.var_1793344935.jpg&quot;,&quot;field_image_socialmedia&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/on9-gold_HMfield_image_socialmedia.var_1793344934.jpg&quot;,&quot;field_image_slider&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/on9-gold_HMfield_image_slider_v2.var_1793344931.jpg&quot;,&quot;field_image_variasi&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/on9-gold_HMfield_image_variasi_v2.var_1793344932.jpg&quot;,&quot;field_image_listing_featured&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/on9-gold_HMfield_image_listing_featured_v2.var_1793344933.jpg&quot;,&quot;field_image_listing_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/on9-gold_HMfield_image_listing_th.var_1793344927.jpg&quot;,&quot;field_image_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/on9-gold_HMfield_image_th_v2.var_1793344933.jpg&quot;,&quot;field_article_state&quot;:null,&quot;field_article_lead&quot;:&quot;Kuala Lumpur: Bursa Malaysia menerusi platform Bursa Gold Dinar meneruskan usaha memperkenalkan kemudahan pemilikan emas secara digital kepada masyarakat menerusi penyertaan dalam Karnival Jom Heboh di Plaza Angsana, di sini, bermula 30 Oktober hingga 1 November ini.&quot;,&quot;body&quot;:&quot;&lt;p&gt;kartika@mediaprima.com.my&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kuala Lumpur: Bursa Malaysia menerusi platform Bursa Gold Dinar meneruskan usaha memperkenalkan kemudahan pemilikan emas secara digital kepada masyarakat menerusi penyertaan dalam Karnival Jom Heboh di Plaza Angsana, di sini, bermula 30 Oktober hingga 1 November ini.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Bursa Gold Dinar menerusi kenyataan berkata, penyertaan itu bertujuan meningkatkan kesedaran orang ramai mengenai kemudahan memiliki dan menyimpan emas menerusi platform digital yang mudah diakses.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Katanya, menerusi Bursa Gold Dinar, pengguna berpeluang memiliki emas dengan pembelian serendah RM10 tanpa perlu menggunakan kaedah pembelian dan penyimpanan emas secara konvensional.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Setiap pembelian menerusi platform itu mewakili pemilikan emas fizikal dengan ketulenan 999.9 atau 24 karat.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Platform berkenaan turut mematuhi prinsip Syariah, sekali gus menawarkan alternatif kepada masyarakat yang ingin memiliki emas dengan mengambil kira aspek ketelusan dan pematuhan Syariah,\&quot; katanya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Selain kemudahan membeli dan menjual emas, Bursa Gold Dinar turut dilengkapi pelbagai ciri bagi memudahkan pengguna menguruskan pegangan emas masing-masing.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Antara ciri disediakan termasuk fungsi amaran harga bagi memantau pergerakan harga emas, pemindahan emas kepada ahli keluarga atau rakan serta pilihan menebus pegangan emas digital kepada emas fizikal dalam bentuk syiling dinar.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Bagaimanapun, penebusan kepada emas fizikal itu hanya boleh dilakukan apabila pegangan mencapai jumlah minimum 4.25 gram, tertakluk kepada terma dan syarat ditetapkan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Sepanjang Karnival Jom Heboh berlangsung, pengunjung berpeluang mendapatkan penerangan secara langsung di reruai Bursa Gold Dinar termasuk mengenai kaedah membuka akaun, melakukan transaksi serta pengalaman memiliki emas secara digital.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Pengunjung juga berpeluang menikmati ganjaran emas percuma menerusi promosi khas yang ditawarkan sepanjang karnival berkenaan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Untuk menyertai promosi terbabit, pengunjung perlu memuat turun aplikasi Bursa Gold Dinar, mendaftar akaun, memasukkan kod promosi EMASJB dan membuat pembelian emas minimum RM100.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Pengguna yang memenuhi syarat berkenaan akan menerima 0.02 gram emas percuma selain berpeluang menikmati pelbagai hadiah menarik, tertakluk kepada terma dan syarat promosi.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Selain itu, orang ramai khususnya penduduk sekitar Johor Bahru boleh mengunjungi reruai Bursa Gold Dinar di Plaza Angsana sehingga 1 November ini untuk mendapatkan maklumat lanjut mengenai platform berkenaan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;body_with_inline&quot;:&quot;&lt;div itemprop=\&quot;articleBody\&quot; class=\&quot;dable-content-wrapper\&quot;&gt;&lt;\/p&gt;\n&lt;p&gt;Kuala Lumpur: Bursa Malaysia menerusi platform Bursa Gold Dinar meneruskan usaha memperkenalkan kemudahan pemilikan emas secara digital kepada masyarakat menerusi penyertaan dalam Karnival Jom Heboh di Plaza Angsana, di sini, bermula 30 Oktober hingga 1 November ini.&lt;\/p&gt;\n&lt;p&gt;Bursa Gold Dinar menerusi kenyataan berkata, penyertaan itu bertujuan meningkatkan kesedaran orang ramai mengenai kemudahan memiliki dan menyimpan emas menerusi platform digital yang mudah diakses.&lt;\/p&gt;\n&lt;p&gt;Katanya, menerusi Bursa Gold Dinar, pengguna berpeluang memiliki emas dengan pembelian serendah RM10 tanpa perlu menggunakan kaedah pembelian dan penyimpanan emas secara konvensional.&lt;\/p&gt;\n&lt;p&gt;\&quot;Setiap pembelian menerusi platform itu mewakili pemilikan emas fizikal dengan ketulenan 999.9 atau 24 karat.&lt;\/p&gt;\n&lt;p&gt;\&quot;Platform berkenaan turut mematuhi prinsip Syariah, sekali gus menawarkan alternatif kepada masyarakat yang ingin memiliki emas dengan mengambil kira aspek ketelusan dan pematuhan Syariah,\&quot; katanya.&lt;\/p&gt;\n&lt;p&gt;Selain kemudahan membeli dan menjual emas, Bursa Gold Dinar turut dilengkapi pelbagai ciri bagi memudahkan pengguna menguruskan pegangan emas masing-masing.&lt;\/p&gt;\n&lt;p&gt;Antara ciri disediakan termasuk fungsi amaran harga bagi memantau pergerakan harga emas, pemindahan emas kepada ahli keluarga atau rakan serta pilihan menebus pegangan emas digital kepada emas fizikal dalam bentuk syiling dinar.&lt;\/p&gt;\n&lt;p&gt;Bagaimanapun, penebusan kepada emas fizikal itu hanya boleh dilakukan apabila pegangan mencapai jumlah minimum 4.25 gram, tertakluk kepada terma dan syarat ditetapkan.&lt;\/p&gt;\n&lt;p&gt;Sepanjang Karnival Jom Heboh berlangsung, pengunjung berpeluang mendapatkan penerangan secara langsung di reruai Bursa Gold Dinar termasuk mengenai kaedah membuka akaun, melakukan transaksi serta pengalaman memiliki emas secara digital.&lt;\/p&gt;\n&lt;p&gt;Pengunjung juga berpeluang menikmati ganjaran emas percuma menerusi promosi khas yang ditawarkan sepanjang karnival berkenaan.&lt;\/p&gt;\n&lt;p&gt;Untuk menyertai promosi terbabit, pengunjung perlu memuat turun aplikasi Bursa Gold Dinar, mendaftar akaun, memasukkan kod promosi EMASJB dan membuat pembelian emas minimum RM100.&lt;\/p&gt;\n&lt;p&gt;Pengguna yang memenuhi syarat berkenaan akan menerima 0.02 gram emas percuma selain berpeluang menikmati pelbagai hadiah menarik, tertakluk kepada terma dan syarat promosi.&lt;\/p&gt;\n&lt;p&gt;Selain itu, orang ramai khususnya penduduk sekitar Johor Bahru boleh mengunjungi reruai Bursa Gold Dinar di Plaza Angsana sehingga 1 November ini untuk mendapatkan maklumat lanjut mengenai platform berkenaan.&lt;\/p&gt;\n&lt;\/div&gt;&quot;,&quot;word_count&quot;:315,&quot;og_description&quot;:&quot;Kuala Lumpur: Bursa Malaysia menerusi platform Bursa Gold Dinar meneruskan usaha memperkenalkan kemudahan pemilikan emas secara digital kepada masyarakat menerusi penyertaan dalam Karnival Jom Heboh di Plaza Angsana, di sini, bermula 30 Oktober hingga 1 November ini.&quot;}" :nid="1429796" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_i
