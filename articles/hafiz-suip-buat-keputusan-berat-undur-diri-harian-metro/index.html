var_1794107516.jpg&quot;,&quot;field_image_listing_featured&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/hsuip_HMfield_image_listing_featured_v2.var_1794107517.jpg&quot;,&quot;field_image_listing_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/hsuip_HMfield_image_listing_th.var_1794107511.jpg&quot;,&quot;field_image_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/hsuip_HMfield_image_th_v2.var_1794107517.jpg&quot;,&quot;field_article_state&quot;:null,&quot;field_article_lead&quot;:&quot;Kuala Lumpur : Tidak mampu memberikan komitmen sepenuhnya, penyanyi, Hafiz Suip tidak akan menyertai program Gegar Vaganza (GV) Fantasia yang bermula pada hari ini.&quot;,&quot;body&quot;:&quot;&lt;p&gt;puterialia@hmetro.com.my&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kuala Lumpur : Tidak mampu memberikan komitmen sepenuhnya, penyanyi, Hafiz Suip tidak akan menyertai program Gegar Vaganza (GV) Fantasia yang bermula pada hari ini.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Hafiz atau nama sebenarnya Mohd Hafiz Mohd Suip, 34, berkata, keputusan berkenaan terpaksa ditolak kerana perlu menumpukan perhatian kepada isterinya, Fiona Saffiyya yang kini hamil.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Apa yang saya boleh katakan, amat menghampakan peminat di luar sana apabila saya tidak menyertai GV Fantasia. Salah satu sebabnya, saya tak berani nak beri komitmen separuh jalan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Sekarang ini isteri saya sedang sarat mengandung. Saya pula, kalau bekerja memang akan sentiasa berikan 100 peratus.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Jadi, saya bimbang situasi sekarang akan mengganggu fokus saya kalau sertai pertandingan tersebut,\&quot; katanya pada majlis pelancaran Anugerah Bintang Popular Berita Harian (ABPBH) Ke-38, di Ombak KLCC, di sini, malam tadi.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Meskipun terdapat ramai peminat dan rakan-rakan penyanyi yang mahu menyaksikan Hafiz berada di dalam pertandingan berkenaan, Hafiz mengakui lokasi tempat tinggal di Kuching, Sarawak serta jadual sesi latihan yang padat menjadi kekangan buatnya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Alhamdulillah saya memang dapat tawaran tetapi saya minta maaf. Bukan menolak rezeki, malah kawan-kawan pun ada tanya kenapa tak sertai.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Masalahnya timbul dari segi sesi latihan. Nanti orang lain praktis, saya pula di Kuching dan perkara itu akhirnya jadi kekangan besar untuk diri saya,\&quot; katanya lagi.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Dalam pada itu, juara Akademi Fantasia musim ketujuh ini turut berkongsi isterinya yang kini hamil tujuh bulan dan bakal menimang cahaya mata lelaki.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Sekarang alhamdulillah, usia kandungan isteri saya dah masuk tujuh bulan. Jantina adalah lelaki.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Lelaki lagi tetapi apa-apa pun yang paling penting anak dalam kandungan sihat dan segalanya berjalan dengan lancar, itu sahaja,\&quot; kongsinya yang turut tercalon dalam kategori Penyanyi Lelaki Popular ABPBH 38.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Memilih untuk menetap di Kuching, Sarawak berbanding berpindah ke ibu kota, Hafiz berkata, dia mahu menemani bapanya yang tinggal bersendirian.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Satu lagi sebab adalah ayah saya. Dia sihat cuma tinggal seorang diri. Saya pernah bawa dia ke Kuala Lumpur, tetapi dia lebih selesa di sana kerana banyak memori.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Alhamdulillah, keadaan ayah sekarang semakin baik dan dia menyibukkan diri bersama adik-beradik serta ibunya yang masih ada,\&quot; ujarnya. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Terdahulu, peminat menjangkakan Hafiz antara empat lagi penyanyi yang akan menyertai GV Fantasia.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;GV Fantasia tahun ini menghimpunkan barisan pemenang dari program Akademi Fantasia dan antara yang sudah mengesahkan tempat ialah Mawi, Vince, Faizal, Shahir dan Mila Jirin, Stacy, Zahid, Faizul Sany dan Firman Bansir.&lt;\/p&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;body_with_inline&quot;:&quot;&lt;div itemprop=\&quot;articleBody\&quot; class=\&quot;dable-content-wrapper\&quot;&gt;&lt;\/p&gt;\n&lt;p&gt;Kuala Lumpur : Tidak mampu memberikan komitmen sepenuhnya, penyanyi, Hafiz Suip tidak akan menyertai program Gegar Vaganza (GV) Fantasia yang bermula pada hari ini.&lt;\/p&gt;\n&lt;p&gt;Hafiz atau nama sebenarnya Mohd Hafiz Mohd Suip, 34, berkata, keputusan berkenaan terpaksa ditolak kerana perlu menumpukan perhatian kepada isterinya, Fiona Saffiyya yang kini hamil.&lt;\/p&gt;\n&lt;p&gt;\&quot;Apa yang saya boleh katakan, amat menghampakan peminat di luar sana apabila saya tidak menyertai GV Fantasia. Salah satu sebabnya, saya tak berani nak beri komitmen separuh jalan.&lt;\/p&gt;\n&lt;p&gt;\&quot;Sekarang ini isteri saya sedang sarat mengandung. Saya pula, kalau bekerja memang akan sentiasa berikan 100 peratus.&lt;\/p&gt;\n&lt;p&gt;\&quot;Jadi, saya bimbang situasi sekarang akan mengganggu fokus saya kalau sertai pertandingan tersebut,\&quot; katanya pada majlis pelancaran Anugerah Bintang Popular Berita Harian (ABPBH) Ke-38, di Ombak KLCC, di sini, malam tadi.&lt;\/p&gt;\n&lt;p&gt;Meskipun terdapat ramai peminat dan rakan-rakan penyanyi yang mahu menyaksikan Hafiz berada di dalam pertandingan berkenaan, Hafiz mengakui lokasi tempat tinggal di Kuching, Sarawak serta jadual sesi latihan yang padat menjadi kekangan buatnya.&lt;\/p&gt;\n&lt;p&gt;\&quot;Alhamdulillah saya memang dapat tawaran tetapi saya minta maaf. Bukan menolak rezeki, malah kawan-kawan pun ada tanya kenapa tak sertai.&lt;\/p&gt;\n&lt;p&gt;\&quot;Masalahnya timbul dari segi sesi latihan. Nanti orang lain praktis, saya pula di Kuching dan perkara itu akhirnya jadi kekangan besar untuk diri saya,\&quot; katanya lagi.&lt;\/p&gt;\n&lt;p&gt;Dalam pada itu, juara Akademi Fantasia musim ketujuh ini turut berkongsi isterinya yang kini hamil tujuh bulan dan bakal menimang cahaya mata lelaki.&lt;\/p&gt;\n&lt;p&gt;\&quot;Sekarang alhamdulillah, usia kandungan isteri saya dah masuk tujuh bulan. Jantina adalah lelaki.&lt;\/p&gt;\n&lt;p&gt;\&quot;Lelaki lagi tetapi apa-apa pun yang paling penting anak dalam kandungan sihat dan segalanya berjalan dengan lancar, itu sahaja,\&quot; kongsinya yang turut tercalon dalam kategori Penyanyi Lelaki Popular ABPBH 38.&lt;\/p&gt;\n&lt;p&gt;Memilih untuk menetap di Kuching, Sarawak berbanding berpindah ke ibu kota, Hafiz berkata, dia mahu menemani bapanya yang tinggal bersendirian.&lt;\/p&gt;\n&lt;p&gt;\&quot;Satu lagi sebab adalah ayah saya. Dia sihat cuma tinggal seorang diri. Saya pernah bawa dia ke Kuala Lumpur, tetapi dia lebih selesa di sana kerana banyak memori.&lt;\/p&gt;\n&lt;p&gt;\&quot;Alhamdulillah, keadaan ayah sekarang semakin baik dan dia menyibukkan diri bersama adik-beradik serta ibunya yang masih ada,\&quot; ujarnya. &lt;\/p&gt;\n&lt;p&gt;Terdahulu, peminat menjangkakan Hafiz antara empat lagi penyanyi yang akan menyertai GV Fantasia.&lt;\/p&gt;\n&lt;p&gt;GV Fantasia tahun ini menghimpunkan barisan pemenang dari program Akademi Fantasia dan antara yang sudah mengesahkan tempat ialah Mawi, Vince, Faizal, Shahir dan Mila Jirin, Stacy, Zahid, Faizul Sany dan Firman Bansir.&lt;\/p&gt;\n&lt;\/div&gt;&quot;,&quot;word_count&quot;:380,&quot;og_description&quot;:&quot;Kuala Lumpur : Tidak mampu memberikan komitmen sepenuhnya, penyanyi, Hafiz Suip tidak akan menyertai program Gegar Vaganza (GV) Fantasia yang bermula pada hari ini.&quot;}" :nid="1433620" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_instream_player&amp;description_url=https%3A%2F%2Fwww.hmetro.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;vid_d=6000&amp;unviewed_position_start=1&amp;output=xml_vast2&amp;ad_rule=1&amp;env=vp&amp;impl=s&amp;correlator=" :is-sponsered="false"></article-component>
