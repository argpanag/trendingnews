 kanan namun tertampan kaki pertahanan The City Boys, dan ditepis keluar Ameerul Eqhwan Mohd Fauzi minit ke-30. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Berselang seminit, Mbarga yang menerima kembali bola hantaran Mohd Faiz Mohd Nasir melakukan gerakan solo untuk percubaan dari luar kotak penalti namun sekali lagi berjaya ditepis keluar Ameerul.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Berpunca dari satu gerakan dari kawasan tengah, Musa Philip Dandada bijak mengambil kesempatan dalam kekalutan di petak kotak penalti untuk melepaskan percubaan yang akhirnya menewaskan gawang gol KL City meletakkan KRW di depan dengan jaringan 1-0 pada pertama.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Memasuki babak kedua,anak buah Dollah Salleh mula menunjukkan taring menerusi sepakan gunting Adam Nor Azlin mengikat kedudukan seri di minit ke-53.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Pelawat terus menambah derita tuan rumah tiga minit kemudian dengan sepakan percuma disempurnakan mudah Paulo Josue untuk mendahului KRW 2-1.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Minit ke-68, Muhaimin Izzudin Muhammad Asri membuat percubaan sepakan jarak jauh namun bola tersasar tinggi melepasi tiang gol menafikan KRW menyamakan kedudukan. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Josue muncul wira The City Boys apabila sekali lagi menyempurnakan sepakan percuma sekali gus  pelawat membawa pulang tiga mata dari  Kota Bharu.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;\/p&gt;\n&lt;p&gt;Kota Bharu: Kuala Lumpur City FC (KL City FC) berpeluh sebelum menewaskan Kelantan Red Warrior (KRW) 3-1 dalam aksi Liga Super di Stadium Sultan Muhammad IV, Kota Bharu, sebentar tadi.&lt;\/p&gt;\n&lt;p&gt;Terlebih dulu, tuan rumah bermula garang dengan Emmanuel Mbarga membuat percubaan dari sudut sebelah kanan namun tertampan kaki pertahanan The City Boys, dan ditepis keluar Ameerul Eqhwan Mohd Fauzi minit ke-30. &lt;\/p&gt;\n&lt;p&gt;Berselang seminit, Mbarga yang menerima kembali bola hantaran Mohd Faiz Mohd Nasir melakukan gerakan solo untuk percubaan dari luar kotak penalti namun sekali lagi berjaya ditepis keluar Ameerul.&lt;\/p&gt;\n&lt;p&gt;Berpunca dari satu gerakan dari kawasan tengah, Musa Philip Dandada bijak mengambil kesempatan dalam kekalutan di petak kotak penalti untuk melepaskan percubaan yang akhirnya menewaskan gawang gol KL City meletakkan KRW di depan dengan jaringan 1-0 pada pertama.&lt;\/p&gt;\n&lt;p&gt;Memasuki babak kedua,anak buah Dollah Salleh mula menunjukkan taring menerusi sepakan gunting Adam Nor Azlin mengikat kedudukan seri di minit ke-53.&lt;\/p&gt;\n&lt;p&gt;Pelawat terus menambah derita tuan rumah tiga minit kemudian dengan sepakan percuma disempurnakan mudah Paulo Josue untuk mendahului KRW 2-1.&lt;\/p&gt;\n&lt;p&gt;Minit ke-68, Muhaimin Izzudin Muhammad Asri membuat percubaan sepakan jarak jauh namun bola tersasar tinggi melepasi tiang gol menafikan KRW menyamakan kedudukan. &lt;\/p&gt;\n&lt;p&gt;Josue muncul wira The City Boys apabila sekali lagi menyempurnakan sepakan percuma sekali gus  pelawat membawa pulang tiga mata dari  Kota Bharu.&lt;\/p&gt;\n&lt;\/div&gt;","word_count":216,"og_description":"Kota Bharu: Kuala Lumpur City FC (KL City FC) berpeluh sebelum menewaskan Kelantan Red Warrior (KRW) 3-1 dalam aksi Liga Super di Stadium Sultan Muhammad IV, Kota Bharu, sebentar tadi."}' :nid="1406531" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/BH_instream_player&amp;description_url=https%3A%2F%2Fwww.bharian.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;unviewed_position_start=1&amp;output=vast&amp;ad_rule=1&amp;env=vp&amp;impl=s&amp;vpa=auto&amp;vpmute=1&amp;plcmt=2&amp;correlator=" :is-sponsered="false"></article-component>
