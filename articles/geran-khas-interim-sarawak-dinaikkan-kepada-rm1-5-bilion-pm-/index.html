rucap pada Sambutan Hari Malaysia Peringkat Kebangsaan 2026 di Pusat Konvensyen Borneo Kuching malam ini. FOTO BERNAMA","gn4id":"hm-73530398"}],"field_article_images_filtered":[{"fid":"8325467","uid":"9","filename":"hm16khass_1789574819.jpg","uri":"gs:\/\/images\/articles\/hm16khass_1789574819.jpg","filemime":"image\/jpeg","filesize":"259552","status":"1","timestamp":"1789574820","uuid":"19ecdc44-8e8f-4280-a5c0-d592e36725c2","rdf_mapping":[],"alt":"","title":"","width":"1200","height":"799","url":"https:\/\/assets.hmetro.com.my\/images\/articles\/hm16khass_1789574819.jpg","caption":"Perdana Menteri Datuk Seri Anwar Ibrahim berucap pada Sambutan Hari Malaysia Peringkat Kebangsaan 2026 di Pusat Konvensyen Borneo Kuching malam ini. FOTO BERNAMA","gn4id":"hm-73530398"}],"field_article_videos":[{"title":"Geran khas interim Sarawak dinaikkan kepada RM1.5 bilion - PM","video_id":"UsbsSeXtnDI"}],"field_image_listing_featured_v2":"https:\/\/assets.hmetro.com.my\/images\/articles\/m16geran-o_HMfield_image_listing_featured_v2.var_1789570352.jpg","field_image_listing_v2":"https:\/\/assets.hmetro.com.my\/images\/articles\/m16geran-o_HMfield_image_listing_v2.var_1789570353.jpg","field_image_socialmedia":"https:\/\/assets.hmetro.com.my\/images\/articles\/m16geran-o_HMfield_image_socialmedia.var_1789570352.jpg","field_image_slider":"https:\/\/assets.hmetro.com.my\/images\/articles\/m16geran-o_HMfield_image_slider.var_1789570351.jpg","field_image_variasi":"https:\/\/assets.hmetro.com.my\/images\/articles\/m16geran-o_HMfield_image_variasi.var_1789570350.jpg","field_image_listing_featured":"https:\/\/assets.hmetro.com.my\/images\/articles\/m16geran-o_HMfield_image_listing_featured_v2.var_1789570352.jpg","field_image_listing_th":"https:\/\/assets.hmetro.com.my\/images\/articles\/m16geran-o_HMfield_image_listing_th.var_1789570348.jpg","field_image_th":"https:\/\/assets.hmetro.com.my\/images\/articles\/m16geran-o_HMfield_image_th.var_1789570349.jpg","field_article_state":null,"field_article_lead":"Kuching: Pemberian Khas kepada Sarawak dinaikkan kepada RM1.5 bilion setahun berkuat kuasa bagi 2026, menyamai kadar interim Pemberian Khas Sabah. ","body":"&lt;p&gt;am@hmetro.com.my&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kuching: Pemberian Khas kepada Sarawak dinaikkan kepada RM1.5 bilion setahun berkuat kuasa bagi 2026, menyamai kadar interim Pemberian Khas Sabah. &lt;\/p&gt;&lt;p&gt;Perdana Menteri, Datuk Seri Anwar Ibrahim berkata, Kerajaan Persekutuan akan terus berunding dengan dua wilayah di Borneo itu bagi memuktamadkan formula Pemberian Khas seperti diperuntukkan di bawah Perlembagaan Persekutuan.&lt;\/p&gt;&lt;p&gt;\"Kerajaan Persekutuan akan terus berunding dengan Kerajaan Sabah dan Sarawak bagi memuktamadkan formula Pemberian Khas,\" katanya ketika berucap pada Sambutan Hari Malaysia 2026 peringkat kebangsaan di Pusat Konvensyen Borneo Kuching (BCCK), di sini, malam ini.&lt;\/p&gt;&lt;p&gt;Sambutan Hari Malaysia 2026 bertemakan \"Malaysia MADANI: Kesejahteraan Dinikmati\" dihadiri lebih 5,000 orang.&lt;\/p&gt;&lt;p&gt;Turut hadir, Yang di-Pertua Negeri Sarawak, Tun Dr Wan Junaidi Tuanku Jaafar; Premier Sarawak, Tan Sri Abang Johari Abang Openg; Ketua Menteri Sabah, Datuk Seri Hajiji Noor; Timbalan Perdana Menteri, Datuk Seri Dr Ahmad Zahid Hamidi serta Menteri Komunikasi, Datuk Seri Fahmi Fadzil.&lt;\/p&gt;&lt;p&gt;Anwar berkata, kenaikan Pemberian Khas berkenaan berkuat kuasa bagi tahun ini dan menyamai kadar interim yang diberikan kepada Sabah, sekali gus menjadi antara langkah kerajaan dalam memperkukuh pelaksanaan Perjanjian Malaysia 1963 (MA63).&lt;\/p&gt;&lt;p&gt;Beliau turut mengumumkan Bantuan Khas Pembelian Tiket Penerbangan secara sekali beri sebanyak RM500 kepada setiap pelajar baharu Institusi Pengajian Tinggi Awam (IPTA) yang layak.&lt;\/p&gt;&lt;p&gt;\"Kerajaan MADANI bersetuju memberikan Bantuan Khas Pembelian Tiket Penerbangan secara sekali beri sebanyak RM500 kepada setiap pelajar baharu IPTA yang layak,\" katanya.&lt;\/p&gt;&lt;p&gt;Bantuan itu membabitkan pelajar Universiti Awam, Politeknik dan Kolej Komuniti bagi sesi kemasukan September dan Oktober tahun ini, yang perlu menggunakan penerbangan domestik antara Semenanjung Malaysia, Sabah, Sarawak dan Wilayah Persekutuan Labuan.&lt;\/p&gt;&lt;p&gt;Inisiatif itu dijangka memberi manfaat secara langsung kepada 7,095 pelajar, manakala RM500 berkenaan akan disalurkan terus ke akaun bank pelajar yang layak bagi memudahkan urusan keluarga menampung kos penerbangan.&lt;\/p&gt;&lt;p&gt;\"RM500 mungkin tidak menampung keseluruhan kos perjalanan, tetapi ia adalah bantuan nyata Kerajaan untuk meringankan beban keluarga pada saat anak-anak memulakan langkah penting dalam kehidupan mereka,\" katanya.&lt;\/p&gt;&lt;p&gt;Anwar berkata, inisiatif berkenaan turut memperkukuh agenda FLYsiswa dan menjadi manifestasi keprihatinan Kerajaan MADANI dalam membantu rakyat menangani kos sara hidup, khususnya ibu bapa yang menanggung kos tambahan apabila anak melanjutkan pengajian merentasi wilayah.&lt;\/p&gt;&lt;p&gt;Dalam perkembangan berkaitan MA63, beliau berkata sebanyak 13 perkara sudah dimuktamadkan, dengan sembilan daripadanya diselesaikan di bawah Kerajaan MADANI.&lt;\/p&gt;&lt;p&gt;Antara perkara yang sudah dilaksanakan ialah pengiktirafan Jabatan Kerja Raya (JKR) dan Jabatan Pengairan dan Saliran (JPS) Sabah serta Sarawak sebagai jabatan teknikal, selain meletakkan wakil tetap Sabah dan Sarawak dalam Lembaga Hasil Dalam Negeri (LHDN).&lt;\/p&gt;&lt;p&gt;Turut dilaksanakan ialah penyerahan kuasa kawal selia elektrik kepada Sabah, pemilikan Pelabuhan Bintulu oleh Sarawak serta penyerahan MASWings kepada Sarawak untuk dijenamakan semula sebagai AirBorneo.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;\/p&gt;\n&lt;p&gt;Kuching: Pemberian Khas kepada Sarawak dinaikkan kepada RM1.5 bilion setahun berkuat kuasa bagi 2026, menyamai kadar int
