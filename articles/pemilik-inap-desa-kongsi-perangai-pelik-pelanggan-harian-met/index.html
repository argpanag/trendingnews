ot;,&quot;rdf_mapping&quot;:[],&quot;alt&quot;:&quot;&quot;,&quot;title&quot;:&quot;&quot;,&quot;width&quot;:&quot;1200&quot;,&quot;height&quot;:&quot;900&quot;,&quot;url&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/WhatsApp_Image_2026-10-18_at_15.18.15_143698579_1792362682.jpg&quot;,&quot;caption&quot;:&quot;KEADAAN inap desa milik Siti Nadiah selepas ditinggalkan pelanggan.&quot;,&quot;gn4id&quot;:&quot;hm-74413990&quot;}],&quot;field_article_images_filtered&quot;:[{&quot;fid&quot;:&quot;8418992&quot;,&quot;uid&quot;:&quot;9&quot;,&quot;filename&quot;:&quot;cicakkk23_1792362679.jpg&quot;,&quot;uri&quot;:&quot;gs:\/\/images\/articles\/cicakkk23_1792362679.jpg&quot;,&quot;filemime&quot;:&quot;image\/jpeg&quot;,&quot;filesize&quot;:&quot;226394&quot;,&quot;status&quot;:&quot;1&quot;,&quot;timestamp&quot;:&quot;1792362680&quot;,&quot;uuid&quot;:&quot;960bdcab-3311-4ccb-bb92-24d189da4c64&quot;,&quot;rdf_mapping&quot;:[],&quot;alt&quot;:&quot;&quot;,&quot;title&quot;:&quot;&quot;,&quot;width&quot;:&quot;1200&quot;,&quot;height&quot;:&quot;1134&quot;,&quot;url&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/cicakkk23_1792362679.jpg&quot;,&quot;caption&quot;:&quot;GAMBAR HIASAN&quot;,&quot;gn4id&quot;:&quot;hm-74414200&quot;}],&quot;field_article_videos&quot;:null,&quot;field_image_listing_featured_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/UTA-homestay2_HMfield_image_listing_featured_v2.var_1792362688.jpg&quot;,&quot;field_image_listing_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/UTA-homestay2_HMfield_image_listing_v2.var_1792362691.jpg&quot;,&quot;field_image_socialmedia&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/UTA-homestay2_HMfield_image_socialmedia.var_1792362689.jpg&quot;,&quot;field_image_slider&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/UTA-homestay2_HMfield_image_slider.var_1792362687.jpg&quot;,&quot;field_image_variasi&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/UTA-homestay2_HMfield_image_variasi.var_1792362686.jpg&quot;,&quot;field_image_listing_featured&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/UTA-homestay2_HMfield_image_listing_featured_v2.var_1792362688.jpg&quot;,&quot;field_image_listing_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/UTA-homestay2_HMfield_image_listing_th.var_1792362684.jpg&quot;,&quot;field_image_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/UTA-homestay2_HMfield_image_th.var_1792362685.jpg&quot;,&quot;field_article_state&quot;:null,&quot;field_article_lead&quot;:&quot;Kuala Lumpur: \u201cTolong, ada \u2018monster\u2019 di dalam bilik air.\u201d&quot;,&quot;body&quot;:&quot;&lt;p&gt;razis@hmetro.com.my &lt;\/p&gt;&lt;p&gt; &lt;\/p&gt;&lt;p&gt;Kuala Lumpur: \&quot;Tolong, ada 'monster' di dalam bilik air.\&quot;&lt;\/p&gt;&lt;p&gt; Panggilan kecemasan diterima pemilik inap desa, Azmir Abu Bakar, 47, daripada pelanggan dari Timur Tengah yang ketakutan selepas melihat seekor cicak di penginapannya.&lt;\/p&gt;&lt;p&gt; Azmir berkata, kejadian itu antara kerenah pelik pelanggan yang terpaksa dihadapinya sepanjang mengusahakan sejak 2019.&lt;\/p&gt;&lt;p&gt; Katanya, kejadian seumpama itu memberi cabaran dan tekanan kepada pemilik homestay sepertinya.&lt;\/p&gt;&lt;p&gt; \&quot;Dalam kejadian itu, pelanggan terbabit minta kami datang dengan segera untuk mengeluarkan 'monster'(cicak) itu. Apabila tiba, cicak berkenaan sudah hilang dan kami pula terpaksa mencarinya.&lt;\/p&gt;&lt;p&gt; \&quot;Bukan itu sahaja, ada juga pelanggan takut melihat kucing berkeliaran berhampiran penginapan sebelum meminta haiwan itu ditangkap serta dikurung sepanjang mereka berada di situ,\&quot; katanya.&lt;\/p&gt;&lt;p&gt; Katanya, antara kejadian paling serius berlaku apabila seorang anak pelanggan yang mencabut beberapa pokok keladi dan mencampakkan batu ke dalam kolam renang.&lt;\/p&gt;&lt;p&gt; \&quot;Kanak-kanak itu turut menggunakan pencakar rumput untuk mengambil bola yang terjatuh di kawasan sawah bersebelahan sehingga merosakkan tanaman. Apabila ditegur, penjaganya memarahi kami.&lt;\/p&gt;&lt;p&gt; \&quot;Bukan itu sahaja, keluarga berkenaan turut membiarkan tujuh pendingin hawa terpasang ketika keluar dengan memberi alasan berhak berbuat demikian kerana sudah membayar penginapan,\&quot; katanya.&lt;\/p&gt;&lt;p&gt; Selain itu, dia kerap berdepan dengan pelanggan yang meninggalkan penginapan dalam keadaan pinggan dan mangkuk tidak dibasuh, makanan dan sampah berselerak serta tandas tidak dipam sehingga pekerja pembersihan terpaksa bekerja lebih masa.&lt;\/p&gt;&lt;p&gt; Azmir berkata, perniagaan homestay sebenarnya bukanlah seindah seperti yang sering digambarkan kerana di sebalik itu, pemilik perlu berdepan isu kebersihan, kerenah pelanggan dan kerosakan barang.&lt;\/p&gt;&lt;p&gt; \&quot;Orang hanya nampak tetamu masuk, duit diterima dan pendapatan itu boleh digunakan untuk membayar komitmen bulanan.&lt;\/p&gt;&lt;p&gt; \&quot;Namun, ada kalanya selagi pelanggan belum mendaftar keluar, pemilik masih tidak senang duduk kerana bimbang masalah yang mungkin berlaku,\&quot; katanya.&lt;\/p&gt;&lt;p&gt; Menurutnya, tekanan mental kadangkala lebih berat berbanding kerosakan harta benda kerana pemilik perlu melayan panggilan berulang kali, menghadapi pertikaian dan berdepan ancaman ulasan buruk daripada pelanggan.&lt;\/p&gt;&lt;p&gt; \&quot;Pemilik homestay perlu banyak bersabar, kekal tenang dan bijak mengendalikan pertikaian.&lt;\/p&gt;&lt;p&gt; \&quot;Kadang kala pemilik perlu berani menegur serta mendidik pelanggan supaya menghormati kediaman orang lain,\&quot; katanya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;&lt;b&gt;Pengusaha pening kepala&lt;\/b&gt;&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kajang: Sisa makanan berselerak, pinggan mangkuk tidak dicuci, sampah bertimbun, paip rosak, beberapa barangan hilang dan kesan darah turut ditemukan di beberapa bahagian kediaman selepas pelanggan mendaftar keluar.&lt;\/p&gt;&lt;p&gt; Itu pengalaman 'ngeri' dialami pemilik inap desa, Siti Nadiah Kamarul Anuar, 35, selepas baru lima hari mengusahakan perniagaan berkenaan.&lt;\/p&gt;&lt;p&gt; Ibu kepada empat anak itu berkata, inap desa berkenaan adalah unit pertama diusahakannya bagi menambah sumber pendapatan keluarga.&lt;\/p&gt;&lt;p&gt; Katanya, masalah timbul apabila dia menerima tempahan daripada pelanggan itu pada saat akhir untuk mendaftar masuk pada hari sama.&lt;\/p&gt;&lt;p&gt; \&quot;Pada mulanya, rakaman kamera litar tertutup (CCTV) menunjukkan dua wanita dan seorang kanak-kanak memasuki unit berkenaan kira-kira jam 7 malam, namun dia tidak mengesyaki apa-apa kerana tempahan dibuat untuk lima tetamu.&lt;\/p&gt;&lt;p&gt; \&quot;Pelanggan berkenaan kemudian meminta melanjutkan tempoh penginapan selama satu malam lagi sebelum memaklumkan berlaku kebocoran pada paip penapis air di bahagian sinki dapur.&lt;\/p&gt;&lt;p&gt; \&quot;Saya minta mereka tutup sementara aliran air dan menghantar video keadaan paip itu. Ketika meneliti video berkenaan, saya terdengar bunyi bising seolah-olah terdapat ramai tetamu berbanding jumlah  tempahan,\&quot; katanya.&lt;\/p&gt;&lt;p&gt; Nadiah berkata, kecurigaannya semakin kuat selepas tukang paip yang tiba kira-kira jam 3 petang mendapati keadaan paip berkenaan sangat teruk dan semua sambungannya sudah dibuka yang berbeza daripada video yang dihantar pelanggan sebelum itu.&lt;\/p&gt;&lt;p&gt; Katanya, semakan rakaman CCTV turut mendapati sekumpulan individu terdiri daripada 11 dewasa dan enam kanak-kanak tiba sebelum disusuli beberapa individu lain secara berperingkat memasuki kediaman itu.&lt;\/p&gt;&lt;p&gt; \&quot;Rakaman turut menunjukkan berlaku sambutan atau parti sehingga beberapa belon terkeluar ke koridor dan kawasan berhampiran lif. Mereka tidak membersihkannya walaupun sudah diminta berbuat demikian sehingga kenalan saya terpaksa mengutip belon berkenaan,\&quot; katanya.&lt;\/p&gt;&lt;p&gt; Menurutnya, selepas pelanggan mendaftar keluar, ketika pemeriksaan menemukan lebihan makanan di dalam peti sejuk, periuk masih berisi nasi, mainan kanak-kanak berselerak, perabot dialihkan, kain dan barangan dikotorkan serta sampah tidak dibuang, selain beberapa mainan hilang dan kesan darah ditemukan di beberapa lokasi.&lt;\/p&gt;&lt;p&gt; \&quot;Saya sangat sedih, terkilan dan keliru kerana tidak menyangka keadaan unit menjadi seteruk itu.&lt;\/p&gt;&lt;p&gt; \&quot;Apabila saya hubungi pelanggan terbabit, maklum balas yang diterima amat mengecewakan kerana mereka beranggapan bayaran masuk sudah termasuk dalam skop pembersihan, sedangkan caj itu hanya merangkumi pembersihan asas,\&quot; katanya.&lt;\/p&gt;&lt;p&gt; Nadiah berkata, kerugian awal dianggarkan RM750 berbanding nilai tempahan kira-kira RM400.&lt;\/p&gt;&lt;p&gt; \&quot;Sebagai hos inap desa  berskala kecil, jumlah kerugian ini sangat besar dan memberi kesan kepada operasi serta penyediaan unit untuk tetamu berikutnya.&lt;\/p&gt;&lt;p&gt; \&quot;Saya kini sedang mengumpulkan gambar, video, rakaman CCTV serta invois untuk membuat tuntutan. Saya harap proses tuntutan yang sedang dijalankan dapat dipertimbangkan dengan adil dan perlindungan yang disediakan dapat membantu menampung kerugian yang telah berlaku.,\&quot; katanya.&lt;\/p&gt;&lt;p&gt; Katanya, pengalaman itu amat mengejutkan dirinya namun sama sekali tidak mematahkan semangat untuk meneruskan perniagaan itu.&lt;\/p&gt;&lt;p&gt; \&quot;Insiden ini memberi pengalaman sangat berguna kepada saya untuk membuat penambahbaikkan termasuk memperketatkan saringan tetamu, memperjelas peraturan rumah dan memastikan urusan dibuat melalui platform Airbnb,\&quot; katanya.&lt;\/p&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;body_with_inline&quot;:&quot;&lt;div itemprop=\&quot;articleBody\&quot; class=\&quot;dable-content-wrapper\&quot;&gt;&lt;\/p&gt;\n\n&lt;p&gt;Kuala Lumpur: \&quot;Tolong, ada 'monster' di dalam bilik air.\&quot;&lt;\/p&gt;\n&lt;p&gt; Panggilan kecemasan diterima pemilik inap desa, Azmir Abu Bakar, 47, daripada pelanggan dari Timur Tengah yang ketakutan selepas melihat seekor cicak di penginapannya.&lt;\/p&gt;\n&lt;p&gt; Azmir berkata, kejadian itu antara kerenah pelik pelanggan yang terpaksa dihadapinya sepanjang mengusahakan sejak 2019.&lt;\/p&gt;\n&lt;p&gt; Katanya, kejadian seumpama itu memberi cabaran dan tekanan kepada pemilik homestay sepertinya.&lt;\/p&gt;\n&lt;p&gt; \&quot;Dalam kejadian itu, pelanggan terbabit minta kami datang dengan segera untuk mengeluarkan 'monster'(cicak) itu. Apabila tiba, cicak berkenaan sudah hilang dan kami pula terpaksa mencarinya.&lt;\/p&gt;\n&lt;p&gt; \&quot;Bukan itu sahaja, ada juga pelanggan takut melihat kucing berkeliaran berhampiran penginapan sebelum meminta haiwan itu ditangkap serta dikurung sepanjang mereka berada di situ,\&quot; katanya.&lt;\/p&gt;\n&lt;p&gt; Katanya, antara kejadian paling serius berlaku apabila seorang anak pelanggan yang mencabut beberapa pokok keladi dan mencampakkan batu ke dalam kolam renang.&lt;\/p&gt;\n&lt;p&gt; \&quot;Kanak-kanak itu turut menggunakan pencakar rumput untuk mengambil bola yang terjatuh di kawasan sawah bersebelahan sehingga merosakkan tanaman. Apabila ditegur, penjaganya memarahi kami.&lt;\/p&gt;\n&lt;p&gt; \&quot;Bukan itu sahaja, keluarga berkenaan turut membiarkan tujuh pendingin hawa terpasang ketika keluar dengan memberi alasan berhak berbuat demikian kerana sudah membayar penginapan,\&quot; katanya.&lt;\/p&gt;\n&lt;p&gt; Selain itu, dia kerap berdepan dengan pelanggan yang meninggalkan penginapan dalam keadaan pinggan dan mangkuk tidak dibasuh, makanan dan sampah berselerak serta tandas tidak dipam sehingga pekerja pembersihan terpaksa bekerja lebih masa.&lt;\/p&gt;\n&lt;p&gt; Azmir berkata, perniagaan homestay sebenarnya bukanlah seindah seperti yang sering digambarkan kerana di sebalik itu, pemilik perlu berdepan isu kebersihan, kerenah pelanggan dan kerosakan barang.&lt;\/p&gt;\n&lt;p&gt; \&quot;Orang hanya nampak tetamu masuk, duit diterima dan pendapatan itu boleh digunakan untuk membayar komitmen bulanan.&lt;\/p&gt;\n&lt;p&gt; \&quot;Namun, ada kalanya selagi pelanggan belum mendaftar keluar, pemilik masih tidak senang duduk kerana bimbang masalah yang mungkin berlaku,\&quot; katanya.&lt;\/p&gt;\n&lt;p&gt; Menurutnya, tekanan mental kadangkala lebih berat berbanding kerosakan harta benda kerana pemilik perlu melayan panggilan berulang kali, menghadapi pertikaian dan berdepan ancaman ulasan buruk daripada pelanggan.&lt;\/p&gt;\n&lt;p&gt; \&quot;Pemilik homestay perlu banyak bersabar, kekal tenang dan bijak mengendalikan pertikaian.&lt;\/p&gt;\n&lt;p&gt; \&quot;Kadang kala pemilik perlu berani menegur serta mendidik pelanggan supaya menghormati kediaman orang lain,\&quot; katanya.&lt;\/p&gt;\n&lt;p&gt;&lt;figure class=\&quot;article-image-item gn4-inline-image inline-image image-single-single\&quot;&gt;&lt;img class=\&quot;img-responsive img-fluid\&quot; typeof=\&quot;foaf:Image\&quot; src=\&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/WhatsApp_Image_2026-10-18_at_15.18.15_143698579_1792362682.jpg\&quot; alt=\&quot;KEADAAN inap desa milik Siti Nadiah selepas ditinggalkan pelanggan.\&quot; \/&gt;&lt;figcaption class=\&quot;gn4-inline-image-caption\&quot;&gt;KEADAAN inap desa milik Siti Nadiah selepas ditinggalkan pelanggan.&lt;\/figcaption&gt;&lt;\/figure&gt;&lt;\/p&gt;\n&lt;p&gt;&lt;b&gt;Pengusaha pening kepala&lt;\/b&gt;&lt;\/p&gt;\n&lt;p&gt;Kajang: Sisa makanan berselerak, pinggan mangkuk tidak dicuci, sampah bertimbun, paip rosak, beberapa barangan hilang dan kesan darah turut ditemukan di beberapa bahagian kediaman selepas pelanggan mendaftar keluar.&lt;\/p&gt;\n&lt;p&gt; Itu pengalaman 'ngeri' dialami pemilik inap desa, Siti Nadiah Kamarul Anuar, 35, selepas baru lima hari mengusahakan perniagaan berkenaan.&lt;\/p&gt;\n&lt;p&gt; Ibu kepada empat anak itu berkata, inap desa berkenaan adalah unit pertama diusahakannya bagi menambah sum
