ada cabaran yang perlu dinikmati pemainnya pada aksi pertama di tempat lawan dalam kempen berkenaan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\"Lebih ramai orang datang, lebih baik. Lebih kuat sorakan, lebih baik. Kami tidak boleh takut dengan perkara itu,\" katanya pada sidang media praperlawanan di stadium berkenaan, hari ini.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Calder\u00f3n berkata, ketika bergelar pemain, perlawanan dengan sokongan penonton yang kuat adalah antara pengalaman yang sentiasa dinantikannya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Malah, beliau bersedia berdepan keadaan apabila arahannya mungkin sukar didengari pemain akibat sorakan penyokong.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\"Saya mengalu-alukan tekanan dan sorakan esok. Saya berharap ramai penyokong datang membuat bising kerana saya menyukainya,\" katanya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Bagaimanapun, Calder\u00f3n mengakui Kuching City memiliki kekuatan di laman sendiri, selain pilihan pemain yang menyukarkan pihaknya menjangka kesebelasan utama skuad kendalian Aidil Sharin Sahak.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Katanya, Kitchee mahu mengekalkan identiti permainan sendiri sambil mengambil kira ancaman pemain tuan rumah yang berada pada prestasi baik.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Beliau turut memaklumkan pasukannya tiba pada Isnin bagi memberi ruang menyesuaikan diri dengan cuaca panas dan kelembapan di Kuching.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\"Kami menghormati Kuching, tetapi kami datang untuk menang. Jika tidak, kami akan cuba mendapatkan satu mata,\" katanya.&lt;\/p&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;\/p&gt;\n&lt;p&gt;Kuching: Sorakan penyokong Kuching City FC bukan sesuatu yang mahu dielakkan Kitchee SC, sebaliknya dialu-alukan menjelang pertemuan Liga Juara-Juara AFC Two (ACL2) di Stadium Taha Ariffin, esok.&lt;\/p&gt;\n&lt;p&gt;Ketua jurulatih Kitchee, I\u00f1igo Calder\u00f3n, berkata suasana meriah di gelanggang lawan menjadi sebahagian daripada cabaran yang perlu dinikmati pemainnya pada aksi pertama di tempat lawan dalam kempen berkenaan.&lt;\/p&gt;\n&lt;p&gt;\"Lebih ramai orang datang, lebih baik. Lebih kuat sorakan, lebih baik. Kami tidak boleh takut dengan perkara itu,\" katanya pada sidang media praperlawanan di stadium berkenaan, hari ini.&lt;\/p&gt;\n&lt;p&gt;Calder\u00f3n berkata, ketika bergelar pemain, perlawanan dengan sokongan penonton yang kuat adalah antara pengalaman yang sentiasa dinantikannya.&lt;\/p&gt;\n&lt;p&gt;Malah, beliau bersedia berdepan keadaan apabila arahannya mungkin sukar didengari pemain akibat sorakan penyokong.&lt;\/p&gt;\n&lt;p&gt;\"Saya mengalu-alukan tekanan dan sorakan esok. Saya berharap ramai penyokong datang membuat bising kerana saya menyukainya,\" katanya.&lt;\/p&gt;\n&lt;p&gt;Bagaimanapun, Calder\u00f3n mengakui Kuching City memiliki kekuatan di laman sendiri, selain pilihan pemain yang menyukarkan pihaknya menjangka kesebelasan utama skuad kendalian Aidil Sharin Sahak.&lt;\/p&gt;\n&lt;p&gt;Katanya, Kitchee mahu mengekalkan identiti permainan sendiri sambil mengambil kira ancaman pemain tuan rumah yang berada pada prestasi baik.&lt;\/p&gt;\n&lt;p&gt;Beliau turut memaklumkan pasukannya tiba pada Isnin bagi memberi ruang menyesuaikan diri dengan cuaca panas dan kelembapan di Kuching.&lt;\/p&gt;\n&lt;p&gt;\"Kami menghormati Kuching, tetapi kami datang untuk menang. Jika tidak, kami akan cuba mendapatkan satu mata,\" katanya.&lt;\/p&gt;\n&lt;\/div&gt;","word_count":217,"og_description":"Kuching: Sorakan penyokong Kuching City FC bukan sesuatu yang mahu dielakkan Kitchee SC, sebaliknya dialu-alukan menjelang pertemuan Liga Juara-Juara AFC Two (ACL2) di Stadium Taha Ariffin, esok."}' :nid="1423114" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/a
