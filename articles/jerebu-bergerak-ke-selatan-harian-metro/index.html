                        <article-component :article='{"nid":1413303,"title":"Jerebu bergerak ke selatan","created":1789945383,"changed":1789945383,"sponsored":0,"status":1,"url":"https:\/\/www.hmetro.com.my\/mutakhir\/2026\/09\/1413303\/jerebu-bergerak-ke-selatan","internal_url":"\/mutakhir\/2026\/09\/1413303\/jerebu-bergerak-ke-selatan","emotion":null,"segment":null,"sentiment":null,"field_force_ads":[],"field_article_author":null,"field_author_email":null,"field_article_authors":[],"field_article_topic":{"tid":167,"name":"Mutakhir"},"field_article_collection":null,"field_tags":[{"tid":5823,"name":"jerebu","auto_generated":false}],"field_article_images":[{"fid":"8337233","uid":"9","filename":"21hm12zjerebu_1789945369.jpg","uri":"gs:\/\/images\/articles\/21hm12zjerebu_1789945369.jpg","filemime":"image\/jpeg","filesize":"142855","status":"1","timestamp":"1789945370","uuid":"2a90869e-1fea-40a7-af9a-730a4f9e16a1","rdf_mapping":[],"alt":"","title":"","width":"1200","height":"813","url":"https:\/\/assets.hmetro.com.my\/images\/articles\/21hm12zjerebu_1789945369.jpg","caption":"PEMANDANGAN berjerebu di Lebuhraya MEX menuju ke ibu kota Kuala Lumpur  pada jam 11 pagi, semalam. - Gambar NSTP\/HAZREEN MOHAMAD","gn4id":"hm-73621812"}],"field_article_images_filtered":[{"fid":"8337233","uid":"9","filename":"21hm12zjerebu_1789945369.jpg","uri":"gs:\/\/images\/articles\/21hm12zjerebu_1789945369.jpg","filemime":"image\/jpeg","filesize":"142855","status":"1","timestamp":"1789945370","uuid":"2a90869e-1fea-40a7-af9a-730a4f9e16a1","rdf_mapping":[],"alt":"","title":"","width":"1200","height":"813","url":"https:\/\/assets.hmetro.com.my\/images\/articles\/21hm12zjerebu_1789945369.jpg","caption":"PEMANDANGAN berjerebu di Lebuhraya MEX menuju ke ibu kota Kuala Lumpur  pada jam 11 pagi, semalam. - Gambar NSTP\/HAZREEN MOHAMAD","gn4id":"hm-73621812"}],"field_article_videos":null,"field_image_listing_featured_v2":"https:\/\/assets.hmetro.com.my\/images\/articles\/Copy_Of_22kws1_HMfield_image_listing_featured_v2.var_1789945378.jpg","field_image_listing_v2":"https:\/\/assets.hmetro.com.my\/images\/articles\/Copy_Of_22kws1_HMfield_image_listing_v2.var_1789945381.jpg","field_image_socialmedia":"https:\/\/assets.hmetro.com.my\/images\/articles\/Copy_Of_22kws1_HMfield_image_socialmedia.var_1789945380.jpg","field_image_slider":"https:\/\/assets.hmetro.com.my\/images\/articles\/Copy_Of_22kws1_HMfield_image_slider_v2.var_1789945376.jpg","field_image_variasi":"https:\/\/assets.hmetro.com.my\/images\/articles\/Copy_Of_22kws1_HMfield_image_variasi_v2.var_1789945377.jpg","field_image_listing_featured":"https:\/\/assets.hmetro.com.my\/images\/articles\/Copy_Of_22kws1_HMfield_image_listing_featured_v2.var_1789945378.jpg","field_image_listing_th":"https:\/\/assets.hmetro.com.my\/images\/articles\/Copy_Of_22kws1_HMfield_image_listing_th.var_1789945372.jpg","field_image_th":"https:\/\/assets.hmetro.com.my\/images\/articles\/Copy_Of_22kws1_HMfield_image_th_v2.var_1789945379.jpg","field_article_state":null,"field_article_lead":"Kuala Lumpur:  Sebanyak 22 kawasan di seluruh negara catatkan bacaan Indeks Pencemar Udara (IPU) pada tahap tidak sihat setakat 9 pagi semalam.","body":"&lt;p&gt;Kuala Lumpur:  Sebanyak 22 kawasan di seluruh negara catatkan bacaan Indeks Pencemar Udara (IPU) pada tahap tidak sihat setakat 9 pagi semalam.&lt;\/p&gt;&lt;p&gt;Menurut portal Sistem Pengurusan Indeks Pencemar Udara Malaysia (APIMS), bacaan tertinggi dicatatkan di IPD Serian (182) di Sarawak, manakala tujuh kawasan di negeri itu merekodkan IPU tidak sihat, iaitu Samarahan (168), Kuching (166), Sri Aman (163), Bintulu (153), Sibu (152), Sarikei (116) dan Samalaju (105).&lt;\/p&gt;&lt;p&gt;Lima kawasan di Johor turut merekodkan bacaan IPU tidak sihat, iaitu Larkin (162), Batu Pahat dan Pasir Gudang masing-masing mencatatkan rekod IPU (155) serta Segamat (154) dan Tangkak (153).&lt;\/p&gt;&lt;p&gt;Selain itu, Putrajaya dan Nilai di Negeri Sembilan masing-masing mencatatkan bacaan 154, manakala Shah Alam, Selangor mencatatkan bacaan 152, diikuti Cheras di Kuala Lumpur (133) dan Seremban, Negeri Sembilan (127).&lt;\/p&gt;&lt;p&gt;IPU tidak sihat turut dicatatkan di Bukit Rambai, Melaka, merekodkan bacaan 121, Bandaraya Melaka (114), manakala di Selangor, iaitu Johan Setia (112) dan Petaling Jaya (102) .&lt;\/p&gt;&lt;p&gt;Sementara itu,  40 kawasan mencatatkan bacaan pada tahap sederhana manakala lima kawasan merekodkan bacaan baik.&lt;\/p&gt;&lt;p&gt;Bacaan IPU sifar hingga 50 menunjukkan kualiti udara baik, 51 hingga 100 (sederhana), 101 hingga 200 (tidak sihat), 201 hingga 300 (sangat tidak sihat) dan 301 ke atas (berbahaya).&lt;\/p&gt;&lt;p&gt;Timbalan Ketua Pengarah (Pembangunan) Jabatan Alam Sekitar (JAS) Azuri Azizah Saedon dalam kenyataan hari ini memaklumkan keadaan berkenaan berlaku dalam persekitaran cuaca kering yang berterusan di sebahagian Rantau Selatan ASEAN.&lt;\/p&gt;&lt;p&gt;Berdasarkan laporan ASEAN Specialised Meteorological Centre (ASMC) semalam sebanyak 865 titik panas dikesan di Kalimantan, 16 di Sumatera dan enam di Malaysia, semuanya di Sarawak.&lt;\/p&gt;&lt;p&gt;ASMC turut melaporkan kepulan asap sederhana sehingga tebal daripada kelompok titik panas di beberapa kawasan di Kalimantan dan bahagian selatan Sumatera dengan kepulan asap sederhana rentas sempadan dari Kalimantan bergerak ke bahagian barat Sarawak dan selatan Sabah.&lt;\/p&gt;&lt;p&gt;Beliau berkata jerebu dari selatan Sumatera dan Kalimantan turut diperhatikan bergerak ke arah Singapura dan bahagian selatan Semenanjung Malaysia.&lt;\/p&gt;&lt;p&gt;Dalam pada itu, menurut JAS pihaknya terus memberikan perhatian terhadap risiko kebakaran, khususnya di kawasan tanah gambut dan tapak pelupusan sampah yang terdedah kepada kebakaran ketika cuaca panas.&lt;\/p&gt;&lt;p&gt;Pemantauan akan dipertingkatkan sekiranya berlaku peningkatan pencemaran udara, manakala tindakan sewajarnya akan diambil mengikut bidang kuasa dan peruntukan undang-undang bagi meminimumkan kesan terhadap alam sekitar dan kesihatan awam.&lt;\/p&gt;&lt;p&gt;\"Tindakan penguatkuasaan turut diperkukuh melalui pemeriksaan dan rondaan di kawasan-kawasan yang dikenal pasti berisiko termasuk kawasan pertanian, tanah gambut, kawasan ladang, tapak pelupusan sampah serta lokasi yang mempunyai potensi berlaku pembakaran terbuka,\" menurut kenyataan itu.&lt;\/p&gt;&lt;p&gt;JAS turut memantau bacaan IPU, titik panas dan perkembangan jerebu rentas sempadan dengan mengambil kira maklumat meteorologi bagi menilai situasi serta menyelaras tindakan pengurusan jerebu pada peringkat daerah, negeri dan kebangsaan.&lt;\/p&gt;&lt;p&gt;Mengikut Pelan Tindakan Jerebu Kebangsaan (PTJK), Jawatankuasa Pengurusan Bencana boleh diaktifkan oleh NADMA apabila bacaan IPU melebihi 150 selama lebih 24 jam. PTJK turut menetapkan penghentian aktiviti luar bilik darjah apabila IPU melebihi 100, penutupan sekolah, tadika dan taska apabila IPU melebihi 200, manakala Operasi Pembenihan Awan boleh dilaksanakan tertakluk kepada kehadiran awan dan keadaan cuaca yang sesuai apabila bacaan IPU melebihi 150 selama lebih 24 jam.&lt;\/p&gt;&lt;p&gt;Dalam pada itu, JAS menyeru orang ramai supaya tidak melakukan pembakaran terbuka, khususnya ketika cuaca panas dan kering serta kualiti udara berada pada tahap tidak sihat sehingga berbahaya.&lt;\/p&gt;&lt;p&gt;Menurut JAS, selaras dengan Akta Kualiti Alam Sekeliling (Pindaan) 2024, kesalahan pembakaran terbuka boleh dikenakan denda minimum RM25,000 hingga RM1 juta atau penjara sehingga lima tahun atau kedua-duanya, manakala kompaun hingga 50 peratus daripada denda maksimum juga boleh dikenakan bagi setiap kesalahan.&lt;\/p&gt;&lt;p&gt;Orang ramai diminta melaporkan kejadian kebakaran atau pembakaran terbuka kepada Jabatan Bomba dan Penyelamat Malaysia melalui talian 999 atau JAS menerusi talian bebas tol 1-800-88-2727.&lt;\/p&gt;&lt;p&gt;\"Bacaan IPU terkini setiap jam boleh dirujuk melalui Sistem Pengurusan Indeks Pencemar Udara (APIMS) JAS atau aplikasi rasmi MyJAS EQMS,\" menurut kenyataan itu. &lt;\/p&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;p&gt;Kuala Lumpur:  Sebanyak 22 kawasan di seluruh negara catatkan bacaan Indeks Pencemar Udara (IPU) pada tahap tidak sihat setakat 9 pagi semalam.&lt;\/p&gt;\n&lt;p&gt;Menurut portal Sistem Pengurusan Indeks Pencemar Udara Malaysia (APIMS), bacaan tertinggi dicatatkan di IPD Serian (182) di Sarawak, manakala tujuh kawasan di negeri itu merekodkan IPU tidak sihat, iaitu Samarahan (168), Kuching (166), Sri Aman (163), Bintulu (153), Sibu (152), Sarikei (116) dan Samalaju (105).&lt;\/p&gt;\n&lt;p&gt;Lima kawasan di Johor turut merekodkan bacaan IPU tidak sihat, iaitu Larkin (162), Batu Pahat dan Pasir Gudang masing-masing mencatatkan rekod IPU (155) serta Segamat (154) dan Tangkak (153).&lt;\/p&gt;\n&lt;p&gt;Selain itu, Putrajaya dan Nilai di Negeri Sembilan masing-masing mencatatkan bacaan 154, manakala Shah Alam, Selangor mencatatkan bacaan 152, diikuti Cheras di Kuala Lumpur (133) dan Seremban, Negeri Sembilan (127).&lt;\/p&gt;\n&lt;p&gt;IPU tidak sihat turut dicatatkan di Bukit Rambai, Melaka, merekodkan bacaan 121, Bandaraya Melaka (114), manakala di Selangor, iaitu Johan Setia (112) dan Petaling Jaya (102) .&lt;\/p&gt;\n&lt;p&gt;Sementara itu,  40 kawasan mencatatkan bacaan pada tahap sederhana manakala lima kawasan merekodkan bacaan baik.&lt;\/p&gt;\n&lt;p&gt;Bacaan IPU sifar hingga 50 menunjukkan kualiti udara baik, 51 hingga 100 (sederhana), 101 hingga 200 (tidak sihat), 201 hingga 300 (sangat tidak sihat) dan 301 ke atas (berbahaya).&lt;\/p&gt;\n&lt;p&gt;Timbalan Ketua Pengarah (Pembangunan) Jabatan Alam Sekitar (JAS) Azuri Azizah Saedon dalam kenyataan hari ini memaklumkan keadaan berkenaan berlaku dalam persekitaran cuaca kering yang berterusan di sebahagian Rantau Selatan ASEAN.&lt;\/p&gt;\n&lt;p&gt;Berdasarkan laporan ASEAN Specialised Meteorological Centre (ASM
