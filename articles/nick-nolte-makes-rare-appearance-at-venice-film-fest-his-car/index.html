      <h1>Nick Nolte makes rare appearance at Venice Film Fest – His career in photos</h1>

      <div class="content"><figure class="gnt_em gnt_em__fp gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/10/USAT/91689069007-getty-images-931107644.jpg?width=660&amp;height=442&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt='Nick Nolte, 85, recently made headlines for a rare public appearance on Sept. 8, 2026, at the 83rd Venice International Film Festival. As the actor celebrates the release of his upcoming film "Company," revisit his memorable roles and career milestones.'></picture><div>Nick Nolte, 85, recently made headlines for a rare public appearance on Sept. 8, 2026, at the 83rd Venice International Film Festival.<br><br>As the actor celebrates the release of his upcoming film "Company," revisit his memorable roles and career milestones.</div>Jamie McCarthy, Getty Images</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/10/USAT/91688552007-getty-images-115096329.jpg?width=660&amp;height=465&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="Nick Nolte, left, and Michele Mercier attend the Cannes Film Festival in May 1978."></picture><div>Nick Nolte, left, and Michele Mercier attend the Cannes Film Festival in May 1978.</div>AFP Via Getty Images</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/10/USAT/91688550007-getty-images-50471355.jpg?width=440&amp;height=660&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt='From left: Robert De Niro, Nick Nolte and Jessica Lange pose in a publicity still for the 1991 thriller "Cape Fear."'></picture><div>From left: Robert De Niro, Nick Nolte and Jessica Lange pose in a publicity still for the 1991 thriller "Cape Fear."</div>Dirck Halstead, Getty Images</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/10/USAT/91688986007-getty-images-51041018.jpg?width=646&amp;height=660&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt='Nick Nolte, left, and Greta Scacchi in a scene from the 1995 film "Jefferson In Paris."'></picture><div>Nick Nolte, left, and Greta Scacchi in a scene from the 1995 film "Jefferson In Paris."</div>Getty Images</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/10/USAT/91688548007-getty-images-1247935535.jpg?width=660&amp;height=438&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="Nick Nolte, left, and Greta Scacchi attend the 48th edition of the Cannes Film Festival on May 20, 1995."></picture><div>Nick Nolte, left, and Greta Scacchi attend the 48th edition of the Cannes Film Festival on May 20, 1995.</div>PATRICK HERTZOG, AFP Via Getty Images</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/media/USATODAY/USATODAY/2014/02/18//1392745410016-1998-thin-red.jpg?width=660&amp;height=443&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt='Nick Nolte, left, and John Travolta in a scene from the 1998 war film "The Thin Red Line."'></picture><div>Nick Nolte, left, and John Travolta in a scene from the 1998 war film "The Thin Red Line."</div>Provided By Merie W. Wallace, 20th Century Fox</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/10/USAT/91688554007-getty-images-51096789.jpg?width=660&amp;height=447&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt='Nick Nolte in a scene from the 1997 film "Affliction."'></picture><div>Nick Nolte in a scene from the 1997 film "Affliction."</div>Getty Images</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/10/USAT/91688544007-getty-images-1183920657.jpg?width=459&amp;height=660&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="Nick Nolte and a guest arrive at the 71st annual Academy Awards."></picture><div>Nick Nolte and a guest arrive at the 71st annual Academy Awards.</div>LUCY NICHOLSON, AFP Via Getty Images</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/10/USAT/91688545007-getty-images-57501055.jpg?width=660&amp;height=481&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="From left: Nick Nolte, Bruce Willis, Avril Lavigne, Garry Shandling, Wanda Sykes, Catherine O'Hara and Steve Carell pose at the premiere of &quot;Over the Hedge&quot; on April 30, 2006."></picture><div>From left: Nick Nolte, Bruce Willis, Avril Lavigne, Garry Shandling, Wanda Sykes, Catherine O'Hara and Steve Carell pose at the premiere of "Over the Hedge" on April 30, 2006.</div>Kevin Winter, Getty Images</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/10/USAT/91688549007-getty-images-123980659.jpg?width=660&amp;height=446&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt='From left: Tom Hardy, Jennifer Morrison, Nick Nolte and Joel Edgerton pose at the premiere of "Warrior" on Sept. 6, 2011.'></picture><div>From left: Tom Hardy, Jennifer Morrison, Nick Nolte and Joel Edgerton pose at the premiere of "Warrior" on Sept. 6, 2011.</div>Kevin Winter, Getty Images</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/02/17/USAT/88711720007-xxx-hoffmannolte-dustin-hoffmanand-nick-nolte-613.jpg?width=660&amp;height=440&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="Nick Nolte photographed in 2012 for USA TODAY."></picture><div>Nick Nolte photographed in 2012 for USA TODAY.</div>Dan MacMedan, USA TODAY</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/10/USAT/91688547007-getty-images-876805264.jpg?width=530&amp;height=660&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt="Nick Nolte poses with his Hollywood Walk of Fame star on Nov. 20, 2017."></picture><div>Nick Nolte poses with his Hollywood Walk of Fame star on Nov. 20, 2017.</div>FREDERIC J. BROWN, AFP Via Getty Images</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/10/USAT/91688551007-getty-images-2294129636.jpg?width=660&amp;height=440&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt='Nick Nolte attends the "Company" photocall during the 83rd Venice International Film Festival on Sept. 8, 2026.'></picture><div>Nick Nolte attends the "Company" photocall during the 83rd Venice International Film Festival on Sept. 8, 2026.</div>Kate Green, Getty Images</figure><figure class="gnt_em gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/08/USAT/91666123007-getty-images-2293697253.jpg?width=660&amp;height=419&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt='From left: Ben Affleck, Indiana Affleck, Emily Lind, Scoot McNairy, Casey Affleck, Adelaide Clemens and Nick Nolte attend the red carpet for "Company."'></picture><div>From left: Ben Affleck, Indiana Affleck, Emily Lind, Scoot McNairy, Casey Affleck, Adelaide Clemens and Nick Nolte attend the red carpet for "Company."</div>STEFANO RELLANDINI, AFP Via Getty Images</figure><figure class="gnt_em gnt_em__lp gnt_em_img"><picture><img src="/gcdn/authoring/authoring-images/2026/09/10/USAT/91688546007-getty-images-2293750784.jpg?width=660&amp;height=440&amp;fit=crop&amp;format=pjpg&amp;auto=webp" alt='Nick Nolte attends the "Company" red carpet event at the 83rd Venice International Film Festival.'></picture><div>Nick Nolte attends the "Company" red carpet event at the 83rd Venice International Film Festival.</div>LAURENT HOU, Hans Lucas/AFP Via Getty Images</figure></div>
