5626&quot;,&quot;status&quot;:&quot;1&quot;,&quot;timestamp&quot;:&quot;1788870816&quot;,&quot;uuid&quot;:&quot;61217ab3-cfb2-4294-8f5b-c3b579a2cd3c&quot;,&quot;rdf_mapping&quot;:[],&quot;alt&quot;:&quot;&quot;,&quot;title&quot;:&quot;&quot;,&quot;width&quot;:&quot;1200&quot;,&quot;height&quot;:&quot;1600&quot;,&quot;url&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/0908rsabon_1788870815.jpg&quot;,&quot;caption&quot;:&quot;Zed Zaidi (kiri) bertanya khabar kepada Abon&quot;,&quot;gn4id&quot;:&quot;hm-73303444&quot;}],&quot;field_article_images_filtered&quot;:[{&quot;fid&quot;:&quot;8300298&quot;,&quot;uid&quot;:&quot;9&quot;,&quot;filename&quot;:&quot;0908rsabon_1788870815.jpg&quot;,&quot;uri&quot;:&quot;gs:\/\/images\/articles\/0908rsabon_1788870815.jpg&quot;,&quot;filemime&quot;:&quot;image\/jpeg&quot;,&quot;filesize&quot;:&quot;265626&quot;,&quot;status&quot;:&quot;1&quot;,&quot;timestamp&quot;:&quot;1788870816&quot;,&quot;uuid&quot;:&quot;61217ab3-cfb2-4294-8f5b-c3b579a2cd3c&quot;,&quot;rdf_mapping&quot;:[],&quot;alt&quot;:&quot;&quot;,&quot;title&quot;:&quot;&quot;,&quot;width&quot;:&quot;1200&quot;,&quot;height&quot;:&quot;1600&quot;,&quot;url&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/0908rsabon_1788870815.jpg&quot;,&quot;caption&quot;:&quot;Zed Zaidi (kiri) bertanya khabar kepada Abon&quot;,&quot;gn4id&quot;:&quot;hm-73303444&quot;}],&quot;field_article_videos&quot;:null,&quot;field_image_listing_featured_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/o-comedi_HMfield_image_listing_featured_v2.var_1788870824.jpg&quot;,&quot;field_image_listing_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/o-comedi_HMfield_image_listing_v2.var_1788870828.jpg&quot;,&quot;field_image_socialmedia&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/o-comedi_HMfield_image_socialmedia.var_1788870826.jpg&quot;,&quot;field_image_slider&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/o-comedi_HMfield_image_slider_v2.var_1788870822.jpg&quot;,&quot;field_image_variasi&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/o-comedi_HMfield_image_variasi_v2.var_1788870823.jpg&quot;,&quot;field_image_listing_featured&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/o-comedi_HMfield_image_listing_featured_v2.var_1788870824.jpg&quot;,&quot;field_image_listing_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/o-comedi_HMfield_image_listing_th.var_1788870818.jpg&quot;,&quot;field_image_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/o-comedi_HMfield_image_th_v2.var_1788870825.jpg&quot;,&quot;field_article_state&quot;:null,&quot;field_article_lead&quot;:&quot;Hulu Langat: Pelawak Abon mengakui dirinya berdepan masalah kemurungan apabila tidak bercakap hampir dua minggu selepas disahkan mengalami masalah jantung pada Jun lalu.&quot;,&quot;body&quot;:&quot;&lt;p \/&gt;&lt;p&gt;Hulu Langat: Pelawak Abon mengakui dirinya berdepan masalah kemurungan apabila tidak bercakap hampir dua minggu selepas disahkan mengalami masalah jantung pada Jun lalu.&lt;\/p&gt;&lt;p&gt;Abon atau nama sebenarnya  Sharizan Ahmad, 66, berkata dia berasa bagai berada di titik terendah kerana susah jatuh sakit termasuk demam sepanjang hidupnya.&lt;\/p&gt;&lt;p&gt;Menurutnya, justeru dia kini sedang menyesuaikan diri menerima keadaan kesihatannya sekarang, apatah lagi apabila doktor melarangnya untuk bekerja dalam tempoh lima bulan hingga ke tiga tahun.&lt;\/p&gt;&lt;p&gt;\&quot;Saya sedang sesuaikan diri dengan keadaan sekarang. Saya akui 'down'  sebab saya bukan perokok, saya tak suka berfoya-foya. Selama ini nak demam pun susah, sampaikan bila tengok orang lain ambil cuti sakit (MC) saya jadi cemburu.&lt;\/p&gt;&lt;p&gt;\&quot;Tapi bila secara tiba-tiba diduga dengan penyakit kronik seperti ini, saya rasa macam sempitnya dunia.&lt;\/p&gt;&lt;p&gt;\&quot;Doktor tak sarankan saya bekerja selama lima bulan kerana baru jalani prosedur memasukkan stent. Dia tak nak saya alami tekanan kalau bekerja kerana boleh jejaskan semula jantung,\&quot; katanya.&lt;\/p&gt;&lt;p&gt;Abon berkata demikian ketika ditemui pada program Ziarah Seni Madani anjuran Perbadanan Kemajuan Filem Nasional Malaysia (FINAS) di rumahnya, di sini, hari ini.&lt;\/p&gt;&lt;p&gt;Turut hadir, Presiden Persatuan Seniman Malaysia (SENIMAN), Rozaidi Abdul Jamil atau Zed Zaidi dan Timbalan Presiden SENIMAN, Rina Tan.&lt;\/p&gt;&lt;p&gt;Pada kunjungan itu, Zed yang juga Biro Bahagian Kebajikan FINAS turut menyampaikan sumbangan bagi meringankan beban ditanggung pelawak veteran terbabit.&lt;\/p&gt;&lt;p&gt;Mengulas lanjut, Abon berkata, dia hilang sebahagian hidupnya apabila terpaksa menghabiskan masa di rumah.&lt;\/p&gt;&lt;p&gt;\&quot;Sekarang memang saya tak keluar dan hanya habiskan masa duduk rumah. Tengok ikan, ayam dan kucing, itu saja. Kadang-kadang saya terfikir, berapa lama nak hidup macam ini?\&quot; katanya lagi.&lt;\/p&gt;&lt;p&gt;Dalam pada itu, Abon menyatakan hasrat memohon bantuan daripada Jabatan Kebajikan Masyarakat (JKM) berikutan dia kini hilang punca pendapatan.&lt;\/p&gt;&lt;p&gt;Abon berkata dia tidak malu memohon bantuan JKM kerana simpanannya sudah habis digunakan untuk rawatan hospital serta kos perubatan.&lt;\/p&gt;&lt;p&gt;Namun, pada masa sama dia mengakui bimbang seandainya tidak layak menerima dan takut terambil hak orang lain.&lt;\/p&gt;&lt;p&gt;\&quot;Kalau boleh saya tidak mahu meminta-minta, selama lebih 30 tahun dalam bidang seni saya tak pernah meminta.&lt;\/p&gt;&lt;p&gt;\&quot;Saya tahu orang akan pertikaikan sebab saya ada rumah dan kereta, tapi itu masa kita senang. Tapi sekarang saya dah tak berapa mampu sebab sudah tak boleh bekerja.&lt;\/p&gt;&lt;p&gt;\&quot;Kereta sekarang pun anak yang bayarkan, tapi masyarakat tak tahu. Sekarang duit (simpanan) yang ada sudah habis, sebab itu saya tak malu nak meminta bantuan daripada JKM walaupun hati saya berbelah bahagi,\&quot; katanya.&lt;\/p&gt;&lt;p&gt;Terdahulu, Abon selamat menjalani prosedur angioplasti pada Selasa lalu di Hospital Canselor Tuanku Muhriz (HCTM), Cheras.&lt;\/p&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;body_with_inline&quot;:&quot;&lt;div itemprop=\&quot;articleBody\&quot; class=\&quot;dable-content-wrapper\&quot;&gt;&lt;p&gt;Hulu Langat: Pelawak Abon mengakui dirinya berdepan masalah kemurungan apabila tidak bercakap hampir dua minggu selepas disahkan mengalami masalah jantung pada Jun lalu.&lt;\/p&gt;\n&lt;p&gt;Abon atau nama sebenarnya  Sharizan Ahmad, 66, berkata dia berasa bagai berada di titik terendah kerana susah jatuh sakit termasuk demam sepanjang hidupnya.&lt;\/p&gt;\n&lt;p&gt;Menurutnya, justeru dia kini sedang menyesuaikan diri menerima keadaan kesihatannya sekarang, apatah lagi apabila doktor melarangnya untuk bekerja dalam tempoh lima bulan hingga ke tiga tahun.&lt;\/p&gt;\n&lt;p&gt;\&quot;Saya sedang sesuaikan diri dengan keadaan sekarang. Saya akui 'down'  sebab saya bukan perokok, saya tak suka berfoya-foya. Selama ini nak demam pun susah, sampaikan bila tengok orang lain ambil cuti sakit (MC) saya jadi cemburu.&lt;\/p&gt;\n&lt;p&gt;\&quot;Tapi bila secara tiba-tiba diduga dengan penyakit kronik seperti ini, saya rasa macam sempitnya dunia.&lt;\/p&gt;\n&lt;p&gt;\&quot;Doktor tak sarankan saya bekerja selama lima bulan kerana baru jalani prosedur memasukkan stent. Dia tak nak saya alami tekanan kalau bekerja kerana boleh jejaskan semula jantung,\&quot; katanya.&lt;\/p&gt;\n&lt;p&gt;Abon berkata demikian ketika ditemui pada program Ziarah Seni Madani anjuran Perbadanan Kemajuan Filem Nasional Malaysia (FINAS) di rumahnya, di sini, hari ini.&lt;\/p&gt;\n&lt;p&gt;Turut hadir, Presiden Persatuan Seniman Malaysia (SENIMAN), Rozaidi Abdul Jamil atau Zed Zaidi dan Timbalan Presiden SENIMAN, Rina Tan.&lt;\/p&gt;\n&lt;p&gt;Pada kunjungan itu, Zed yang juga Biro Bahagian Kebajikan FINAS turut menyampaikan sumbangan bagi meringankan beban ditanggung pelawak veteran terbabit.&lt;\/p&gt;\n&lt;p&gt;Mengulas lanjut, Abon berkata, dia hilang sebahagian hidupnya apabila terpaksa menghabiskan masa di rumah.&lt;\/p&gt;\n&lt;p&gt;\&quot;Sekarang memang saya tak keluar dan hanya habiskan masa duduk rumah. Tengok ikan, ayam dan kucing, itu saja. Kadang-kadang saya terfikir, berapa lama nak hidup macam ini?\&quot; katanya lagi.&lt;\/p&gt;\n&lt;p&gt;Dalam pada itu, Abon menyatakan hasrat memohon bantuan daripada Jabatan Kebajikan Masyarakat (JKM) berikutan dia kini hilang punca pendapatan.&lt;\/p&gt;\n&lt;p&gt;Abon berkata dia tidak malu memohon bantuan JKM kerana simpanannya sudah habis digunakan untuk rawatan hospital serta kos perubatan.&lt;\/p&gt;\n&lt;p&gt;Namun, pada masa sama dia mengakui bimbang seandainya tidak layak menerima dan takut terambil hak orang lain.&lt;\/p&gt;\n&lt;p&gt;\&quot;Kalau boleh saya tidak mahu meminta-minta, selama lebih 30 tahun dalam bidang seni saya tak pernah meminta.&lt;\/p&gt;\n&lt;p&gt;\&quot;Saya tahu orang akan pertikaikan sebab saya ada rumah dan kereta, tapi itu masa kita senang. Tapi sekarang saya dah tak berapa mampu sebab sudah tak boleh bekerja.&lt;\/p&gt;\n&lt;p&gt;\&quot;Kereta sekarang pun anak yang bayarkan, tapi masyarakat tak tahu. Sekarang duit (simpanan) yang ada sudah habis, sebab itu saya tak malu nak meminta bantuan daripada JKM walaupun hati saya berbelah bahagi,\&quot; katanya.&lt;\/p&gt;\n&lt;p&gt;Terdahulu, Abon selamat menjalani prosedur angioplasti pada Selasa lalu di Hospital Canselor Tuanku Muhriz (HCTM), Cheras.&lt;\/p&gt;\n&lt;\/div&gt;&quot;,&quot;word_count&quot;:403,&quot;og_description&quot;:&quot;Hulu Langat: Pelawak Abon mengakui dirinya berdepan masalah kemurungan apabila tidak bercakap hampir dua minggu selepas disahkan mengalami masalah jantung pada Jun lalu.&quot;}" :nid="1408045" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/
