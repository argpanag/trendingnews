om.my\/images\/articles\/m18jabat-o_HMfield_image_variasi_v2.var_1792334301.jpg","field_image_listing_featured":"https:\/\/assets.hmetro.com.my\/images\/articles\/m18jabat-o_HMfield_image_listing_featured_v2.var_1792334302.jpg","field_image_listing_th":"https:\/\/assets.hmetro.com.my\/images\/articles\/m18jabat-o_HMfield_image_listing_th.var_1792334295.jpg","field_image_th":"https:\/\/assets.hmetro.com.my\/images\/articles\/m18jabat-o_HMfield_image_th_v2.var_1792334302.jpg","field_article_state":null,"field_article_lead":"Kuala Terengganu: Ketua jabatan sektor perkhidmatan awam disaran mempertimbang penugasan mengikut Dasar Hari Bekerja Hibrid ( HBH) dengan mengambil kira keadaan jerebu di negeri masing-masing.","body":"&lt;p&gt;am@hmetro.com.my&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kuala Terengganu: Ketua jabatan sektor perkhidmatan awam disaran mempertimbang penugasan mengikut Dasar Hari Bekerja Hibrid ( HBH) dengan mengambil kira keadaan jerebu di negeri masing-masing.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Ketua Pengarah Perkhidmatan Awam (KPPA), Tan Sri Dr Wan Ahmad Dahlan Abdul Aziz berkata, secara kebetulan, masalah jerebu kali ini berlaku sekitar tarikh HBH berkuat kuasa iaitu pada 1 Ogos lalu.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Sehubungan itu, katanya, ketua jabatan di negeri terjejas dibolehkan untuk membenarkan penjawat awam bertugas mengikut sistem HBH.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\"Ketua jabatan perlu menetapkan Petunjuk Prestasi Utama (KPI) untuk memastikan input penjawat awam diberi keutamaan walaupun bekerja secara hibrid di rumah, \" katanya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Terdahulu, Wan Ahmad Dahlan mengadakan Program Ziarah Pesara dan menyantuni tiga pesara, di sini, hari ini.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Turut hadir, Pengarah Jabatan Pembangunan Persekutuan (JPP) negeri, Datuk Abdul Kahar Abdul Latif.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Berdasarkan kaedah HBH, penjawat awam bekerja secara &lt;\/p&gt;&lt;p&gt;fizikal selama tiga hari di pejabat, manakala dua hari bekerja dari rumah (BDR) atau lokasi alternatif yang diluluskan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Dalam pada itu, Wan Ahmad Dahlan meminta semua penjawat awam terutama yang berkhidmat di negeri yang dilanda jerebu memakai pelitup muka bagi mengelakkan pelbagai isu kesihatan. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;\/p&gt;\n&lt;p&gt;Kuala Terengganu: Ketua jabatan sektor perkhidmatan awam disaran mempertimbang penugasan mengikut Dasar Hari Bekerja Hibrid ( HBH) dengan mengambil kira keadaan jerebu di negeri masing-masing.&lt;\/p&gt;\n&lt;p&gt;Ketua Pengarah Perkhidmatan Awam (KPPA), Tan Sri Dr Wan Ahmad Dahlan Abdul Aziz berkata, secara kebetulan, masalah jerebu kali ini berlaku sekitar tarikh HBH berkuat kuasa iaitu pada 1 Ogos lalu.&lt;\/p&gt;\n&lt;p&gt;Sehubungan itu, katanya, ketua jabatan di negeri terjejas dibolehkan untuk membenarkan penjawat awam bertugas mengikut sistem HBH.&lt;\/p&gt;\n&lt;p&gt;\"Ketua jabatan perlu menetapkan Petunjuk Prestasi Utama (KPI) untuk memastikan input penjawat awam diberi keutamaan walaupun bekerja secara hibrid di rumah, \" katanya.&lt;\/p&gt;\n&lt;p&gt;Terdahulu, Wan Ahmad Dahlan mengadakan Program Ziarah Pesara dan menyantuni tiga pesara, di sini, hari ini.&lt;\/p&gt;\n&lt;p&gt;Turut hadir, Pengarah Jabatan Pembangunan Persekutuan (JPP) negeri, Datuk Abdul Kahar Abdul Latif.&lt;\/p&gt;\n&lt;p&gt;Berdasarkan kaedah HBH, penjawat awam bekerja secara &lt;\/p&gt;\n&lt;p&gt;fizikal selama tiga hari di pejabat, manakala dua hari bekerja dari rumah (BDR) atau lokasi alternatif yang diluluskan.&lt;\/p&gt;\n&lt;p&gt;Dalam pada itu, Wan Ahmad Dahlan meminta semua penjawat awam terutama yang berkhidmat di negeri yang dilanda jerebu memakai pelitup muka bagi mengelakkan pelbagai isu kesihatan. &lt;\/p&gt;\n&lt;\/div&gt;","word_count":176,"og_description":"Kuala Terengganu: Ketua jabatan sektor perkhidmatan awam disaran mempertimbang penugasan mengikut Dasar Hari Bekerja Hibrid ( HBH) dengan mengambil kira keadaan jerebu di negeri masing-masing."}' :nid="1424750" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_instream_player&amp;description_url=https%3A%2F%2Fwww.hmetro.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;vid_d=6000&amp;unviewed_position_start=1&amp;output=xml_vast2&amp;ad_rule=1&amp;env=vp&amp;impl=s&amp;correlator=" :is-sponsered="false"></article-component>
