eatured&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-tegang170926_HMfield_image_listing_featured_v2.var_1789616050.jpg&quot;,&quot;field_image_listing_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-tegang170926_HMfield_image_listing_th.var_1789616044.jpg&quot;,&quot;field_image_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-tegang170926_HMfield_image_th_v2.var_1789616050.jpg&quot;,&quot;field_article_state&quot;:null,&quot;field_article_lead&quot;:&quot;Kuala Lumpur: Kongres Luar Biasa Persatuan Bolasepak Malaysia (FAM) pagi ini \u2018tegang\u2019 apabila kelayakan Pengerusi Jawatankuasa Pemilihan badan induk itu, Prof Datuk Dr Abdullah Mohamad Said dipertikaikan.&quot;,&quot;body&quot;:&quot;&lt;p&gt;sukan@hmetro.com.my&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kuala Lumpur: Kongres Luar Biasa Persatuan Bolasepak Malaysia (FAM) pagi ini 'tegang' apabila kelayakan Pengerusi Jawatankuasa Pemilihan badan induk itu, Prof Datuk Dr Abdullah Mohamad Said dipertikaikan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Ia susulan surat bantahan yang diserahkan Persatuan Bolasepak Selangor (FAS) pada 8 September lalu yang diserahkan kepada Setiausaha Agung FAM dan salinannya turut diberikan kepada Konfederasi Bolasepak Asia (AFC).&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Dalam mesyuarat pagi ini, Setiausaha Agung AFC, Datuk Seri Windsor Paul John yang bertindak sebagai Pengerusi Majlis memulakan dengan membangkitkan surat yang diserahkan FAS.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Windsor menjelaskan, Kongres Luar Biasa boleh diteruskan namun rayuan boleh dikemukakan sekiranya ada bantahan daripada perwakilan ekoran berlakunya 'kecacatan' dalam melantik Pengerusi Jawatankuasa Pemilihan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Lantas, perwakilan dari Perak, Selangor dan Kuching City mahu ia diteruskan serta diminitkan namun Windsor tidak membenarkan kerana statut dan peraturan FAM perlu dipinda terlebih dulu.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Ujar Windsor lagi, begitupun pemilihan boleh diteruskan hari ini.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Sebelum ini, media melaporkan pelantikan Abdullah dipersoalkan kerana beliau tidak memenuhi Kod Pemilihan FAM 2026 yang baru.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Dalam Kod Pemilihan FAM 2026 yang baru itu, Klausa 5 menetapkan Pengerusi dan Timbalan Pengerusi Jawatankuasa Pemilihan mestilah layak untuk menjalankan amalan guaman.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Semakan terhadap profil akademik rasmi Abdullah di Universiti Teknologi MARA (UiTM) pula menunjukkan latar belakang pendidikannya adalah dalam bidang alam sekitar serta perancangan bandar dan wilayah.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Rekod akademik UiTM menyenaraikan Abdullah memiliki Ijazah Sarjana Muda Sains (Kepujian) dalam bidang Alam Sekitar, diikuti Sarjana Perancangan Bandar dari University of Wales, United Kingdom serta PhD dalam bidang Perancangan Bandar dan Wilayah.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Tiada kelayakan ijazah undang-undang disenaraikan dalam rekod akademik rasmi berkenaan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Persoalan itu menjadi lebih menarik kerana jawatankuasa yang dipengerusikan Abdullah memainkan peranan penting dalam mengendalikan proses pemilihan barisan Exco FAM, termasuk jawatan Presiden, Timbalan Presiden dan anggota Jawatankuasa Eksekutif.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Malah, Abdullah sebelum ini memaklumkan semua pencalonan bagi pemilihan Jawatankuasa Eksekutif FAM bagi baki penggal 2025 hingga 2029 sudah melalui proses semakan dan pengesahan berdasarkan Statut FAM serta peraturan dan tatacara pemilihan yang ditetapkan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;&lt;ul&gt;&lt;\/p&gt;&lt;p&gt;  &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/arena\/bola-sepak\/2026\/09\/1411809\/zainal-kekal-exco-azizudin-azhar-ungguli-undian\&quot;&gt;Zainal kekal Exco, Azizudin, Azhar ungguli undian&lt;\/a&gt;&lt;\/li&gt;&lt;\/p&gt;&lt;p&gt;  &lt;li&gt;&lt;a href=\&quot;https:\/\/www.hmetro.com.my\/arena\/bola-sepak\/2026\/09\/1411801\
