aption&quot;:&quot;SEKUMPULAN penyokong dipercayai daripada kumpulan Boys of Strait dilihat membaling barangan ke arah kawasan penyokong Pahang. -FOTO Facebook&quot;,&quot;gn4id&quot;:&quot;hm-73812257&quot;}],&quot;field_article_videos&quot;:null,&quot;field_image_listing_featured_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-kecoh2709_HMfield_image_listing_featured_v2.var_1790475222.jpg&quot;,&quot;field_image_listing_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-kecoh2709_HMfield_image_listing_v2.var_1790475224.jpg&quot;,&quot;field_image_socialmedia&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-kecoh2709_HMfield_image_socialmedia.var_1790475224.jpg&quot;,&quot;field_image_slider&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-kecoh2709_HMfield_image_slider_v2.var_1790475221.jpg&quot;,&quot;field_image_variasi&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-kecoh2709_HMfield_image_variasi_v2.var_1790475221.jpg&quot;,&quot;field_image_listing_featured&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-kecoh2709_HMfield_image_listing_featured_v2.var_1790475222.jpg&quot;,&quot;field_image_listing_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-kecoh2709_HMfield_image_listing_th.var_1790475217.jpg&quot;,&quot;field_image_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-kecoh2709_HMfield_image_th_v2.var_1790475223.jpg&quot;,&quot;field_article_state&quot;:null,&quot;field_article_lead&quot;:&quot;Kuala Lumpur: Kekalahan 2-4 Johor Darul Ta\u2019zim (JDT) kepada Pahang Rangers FC pada separuh akhir pertama Liga Premier Futsal Malaysia (MPFL) dicemari kekecohan apabila penyokong pelawat didakwa tidak berpuas hati dengan keputusan perlawanan.&quot;,&quot;body&quot;:&quot;&lt;p \/&gt;&lt;p&gt;Kuala Lumpur: Kekalahan 2-4 Johor Darul Ta'zim (JDT) kepada Pahang Rangers FC pada separuh akhir pertama Liga Premier Futsal Malaysia (MPFL) dicemari kekecohan apabila penyokong pelawat didakwa tidak berpuas hati dengan keputusan perlawanan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kekecohan tercetus selepas tamat perlawanan apabila sekumpulan penyokong dipercayai daripada kumpulan Boys of Strait dilihat membaling barangan ke arah kawasan penyokong Pahang, sekali gus mencetuskan ketegangan di sekitar tempat duduk penonton.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Keputusan itu menyaksikan Pahang Rangers membawa bekalan dua gol untuk aksi timbal balik di Pasir Gudang pada 10 Oktober ini, sekali gus meletakkan wakil Pahang itu dalam kedudukan lebih selesa untuk memburu tiket ke final.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Dalam aksi sengit itu, penjaring terbanyak liga, Felipe de Souza, memecah kebuntuan untuk meletakkan tuan rumah di depan sebelum JDT gagal mencari gol penyamaan sehingga tamat babak pertama.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;JDT bangkit pada separuh masa kedua apabila Andres Prieto menyamakan kedudukan pada minit ke-26, namun de Souza kembali menceriakan kem tuan rumah menerusi gol keduanya sebelum Tuah Eizlan Aminuddin menambah jaringan ketiga Pahang Rangers.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;JDT kemudian menggunakan strategi power play dan usaha itu membuahkan hasil apabila Awalluddin Mat Nawi merapatkan jurang kepada 3-2, namun keputusan menggunakan gawang kosong akhirnya memakan diri apabila Rodrigo Galvao de Silva memanfaatkan ruang terbuka untuk menghasilkan gol keempat tuan rumah.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Perlawanan turut dicemari insiden tegang apabila kepala de Souza berdarah selepas dikasari pemain JDT, menambah bahang pertemuan antara kedua-dua pasukan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Pahang Rangers kini hanya memerlukan keputusan seri pada aksi timbal balik untuk mara ke final, manakala JDT perlu menang dengan margin sekurang-kurangnya tiga gol di gelanggang sendiri bagi menyingkirkan wakil Pahang itu.&lt;\/p&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;body_with_inline&quot;:&quot;&lt;div itemprop=\&quot;articleBody\&quot; class=\&quot;dable-content-wrapper\&quot;&gt;&lt;p&gt;Kuala Lumpur: Kekalahan 2-4 Johor Darul Ta'zim (JDT) kepada Pahang Rangers FC pada separuh akhir pertama Liga Premier Futsal Malaysia (MPFL) dicemari kekecohan apabila penyokong pelawat didakwa tidak berpuas hati dengan keputusan perlawanan.&lt;\/p&gt;\n&lt;p&gt;Kekecohan tercetus selepas tamat perlawanan apabila sekumpulan penyokong dipercayai daripada kumpulan Boys of Strait dilihat membaling barangan ke arah kawasan penyokong Pahang, sekali gus mencetuskan ketegangan di sekitar tempat duduk penonton.&lt;\/p&gt;\n&lt;p&gt;Keputusan itu menyaksikan Pahang Rangers membawa bekalan dua gol untuk aksi timbal balik di Pasir Gudang pada 10 Oktober ini, sekali gus meletakkan wakil Pahang itu dalam kedudukan lebih selesa untuk memburu tiket ke final.&lt;\/p&gt;\n&lt;p&gt;Dalam aksi sengit itu, penjaring terbanyak liga, Felipe de Souza, memecah kebuntuan untuk meletakkan tuan rumah di depan sebelum JDT gagal mencari gol penyamaan sehingga tamat babak pertama.&lt;\/p&gt;\n&lt;p&gt;JDT bangkit pada separuh masa kedua apabila Andres Prieto menyamakan kedudukan pada minit ke-26, namun de Souza kembali menceriakan kem tuan rumah menerusi gol keduanya sebelum Tuah Eizlan Aminuddin menambah jaringan ketiga Pahang Rangers.&lt;\/p&gt;\n&lt;p&gt;JDT kemudian menggunakan strategi power play dan usaha itu membuahkan hasil apabila Awalluddin Mat Nawi merapatkan jurang kepada 3-2, namun keputusan menggunakan gawang kosong akhirnya memakan diri apabila Rodrigo Galvao de Silva memanfaatkan ruang terbuka untuk menghasilkan gol keempat tuan rumah.&lt;\/p&gt;\n&lt;p&gt;Perlawanan turut dicemari insiden tegang apabila kepala de Souza berdarah selepas dikasari pemain JDT, menambah bahang pertemuan antara kedua-dua pasukan.&lt;\/p&gt;\n&lt;p&gt;Pahang Rangers kini hanya memerlukan keputusan seri pada aksi timbal balik untuk mara ke final, manakala JDT perlu menang dengan margin sekurang-kurangnya tiga gol di gelanggang sendiri bagi menyingkirkan wakil Pahang itu.&lt;\/p&gt;\n&lt;\/div&gt;&quot;,&quot;word_count&quot;:253,&quot;og_description&quot;:&quot;Kuala Lumpur: Kekalahan 2-4 Johor Darul Ta\u2019zim (JDT) kepada Pahang Rangers FC pada separuh akhir pertama Liga Premier Futsal Malaysia (MPFL) dicemari kekecohan apabila penyokong pelawat didakwa tidak berpuas hati dengan keputusan perlawanan.&quot;}" :nid="1415857" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_instream_player&amp;description_url=https%3A%2F%2Fwww.hmetro.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;vid_d=6000&amp;unviewed_position_start=1&amp;output=xml_vast2&amp;ad_rule=1&amp;env=vp&amp;impl=s&amp;correlator=" :is-sponsered="false"></article-component>
