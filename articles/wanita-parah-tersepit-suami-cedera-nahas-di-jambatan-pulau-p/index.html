 lagi kenderaan di Kilometer (KM) 1.3 Jambatan Pulau Pinang menghala ke Perai, awal pagi tadi.&lt;\/p&gt;&lt;p&gt;   Dalam kejadian kira-kira jam 3.40 pagi itu, mangsa wanita berusia 45 tahun itu parah di kepala, kaki dan tangan selepas tersepit di bahagian tempat duduk pemandu Toyota Hilux dipandunya.&lt;\/p&gt;&lt;p&gt;   Suaminya berusia 47 tahun yang turut berada dalam kenderaan sama cedera ringan serta pemandu Honda BR-V berusia 38 tahun yang cedera ringan di kepala dalam kemalangan itu. &lt;\/p&gt;&lt;p&gt;   Penolong Pengarah Bahagian Operasi Kebombaan dan Penyelamat, Jabatan Bomba dan Penyelamat Malaysia (JBPM) Pulau Pinang, John Sagun Francis, berkata pihaknya menerima panggilan jam 3.49 pagi sebelum anggota dari Balai Bomba dan Penyelamat (BBP) Perai bergegas ke lokasi dengan bantuan BBP Jalan Perak.&lt;\/p&gt;&lt;p&gt;   \"Sejurus tiba, komander operasi menjalankan penilaian awal dan mendapati kemalangan membabitkan dua kenderaan iaitu sebuah Toyota Hilux dan Honda BR-V dengan tiga mangsa terbabit. &lt;\/p&gt;&lt;p&gt;   \"Anggota kemudian menjalankan kerja menyelamat bagi mengeluarkan mangsa wanita yang tersepit di tempat duduk pemandu Toyota Hilux menggunakan peralatan khas.&lt;\/p&gt;&lt;p&gt;   \"Mangsa berjaya dikeluarkan dengan selamat sebelum diserahkan kepada pasukan Bulan Sabit Merah untuk mendapatkan rawatan lanjut di hospital,\" katanya dalam kenyataan.&lt;\/p&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;\/p&gt;\n&lt;p&gt;Butterworth: Seorang wanita parah akibat tersepit, manakala suaminya cedera selepas pikap dinaiki mereka terbabit nahas dengan sebuah lagi kenderaan di Kilometer (KM) 1.3 Jambatan Pulau Pinang menghala ke Perai, awal pagi tadi.&lt;\/p&gt;\n&lt;p&gt;   Dalam kejadian kira-kira jam 3.40 pagi itu, mangsa wanita berusia 45 tahun itu parah di kepala, kaki dan tangan selepas tersepit di bahagian tempat duduk pemandu Toyota Hilux dipandunya.&lt;\/p&gt;\n&lt;p&gt;   Suaminya berusia 47 tahun yang turut berada dalam kenderaan sama cedera ringan serta pemandu Honda BR-V berusia 38 tahun yang cedera ringan di kepala dalam kemalangan itu. &lt;\/p&gt;\n&lt;p&gt;   Penolong Pengarah Bahagian Operasi Kebombaan dan Penyelamat, Jabatan Bomba dan Penyelamat Malaysia (JBPM) Pulau Pinang, John Sagun Francis, berkata pihaknya menerima panggilan jam 3.49 pagi sebelum anggota dari Balai Bomba dan Penyelamat (BBP) Perai bergegas ke lokasi dengan bantuan BBP Jalan Perak.&lt;\/p&gt;\n&lt;p&gt;   \"Sejurus tiba, komander operasi menjalankan penilaian awal dan mendapati kemalangan membabitkan dua kenderaan iaitu sebuah Toyota Hilux dan Honda BR-V dengan tiga mangsa terbabit. &lt;\/p&gt;\n&lt;p&gt;   \"Anggota kemudian menjalankan kerja menyelamat bagi mengeluarkan mangsa wanita yang tersepit di tempat duduk pemandu Toyota Hilux menggunakan peralatan khas.&lt;\/p&gt;\n&lt;p&gt;   \"Mangsa berjaya dikeluarkan dengan selamat sebelum diserahkan kepada pasukan Bulan Sabit Merah untuk mendapatkan rawatan lanjut di hospital,\" katanya dalam kenyataan.&lt;\/p&gt;\n&lt;\/div&gt;","word_count":192,"og_description":"Butterworth: Seorang wanita parah akibat tersepit, manakala suaminya cedera selepas pikap dinaiki mereka terbabit nahas dengan sebuah lagi kenderaan di Kilometer (KM) 1.3 Jambatan Pulau Pinang menghala ke Perai, awal pagi tadi."}' :nid="1423271" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_instream_player&amp;description_url=https%3A%2F%2Fwww.hmetro.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;vid_d=6000&amp;unviewed_position_start=1&amp;output=xml_vast2&amp;ad_rule=1&amp;env=vp&amp;impl=s&amp;correlator=" :is-sponsered="false"></article-component>
