t;:&quot;DIDIE_ALIAS_1794107072.jpg&quot;,&quot;uri&quot;:&quot;gs:\/\/images\/articles\/DIDIE_ALIAS_1794107072.jpg&quot;,&quot;filemime&quot;:&quot;image\/jpeg&quot;,&quot;filesize&quot;:&quot;180366&quot;,&quot;status&quot;:&quot;1&quot;,&quot;timestamp&quot;:&quot;1794107073&quot;,&quot;uuid&quot;:&quot;7b04273d-378a-4fcf-a79a-88289985aa7a&quot;,&quot;rdf_mapping&quot;:[],&quot;alt&quot;:&quot;&quot;,&quot;title&quot;:&quot;&quot;,&quot;width&quot;:&quot;1200&quot;,&quot;height&quot;:&quot;1584&quot;,&quot;url&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/DIDIE_ALIAS_1794107072.jpg&quot;,&quot;caption&quot;:&quot;Didie Alias. Foto Nabila Adlina Azahari&quot;,&quot;gn4id&quot;:&quot;hm-74991150&quot;}],&quot;field_article_images_filtered&quot;:[{&quot;fid&quot;:&quot;8481254&quot;,&quot;uid&quot;:&quot;9&quot;,&quot;filename&quot;:&quot;DIDIE_ALIAS_1794107072.jpg&quot;,&quot;uri&quot;:&quot;gs:\/\/images\/articles\/DIDIE_ALIAS_1794107072.jpg&quot;,&quot;filemime&quot;:&quot;image\/jpeg&quot;,&quot;filesize&quot;:&quot;180366&quot;,&quot;status&quot;:&quot;1&quot;,&quot;timestamp&quot;:&quot;1794107073&quot;,&quot;uuid&quot;:&quot;7b04273d-378a-4fcf-a79a-88289985aa7a&quot;,&quot;rdf_mapping&quot;:[],&quot;alt&quot;:&quot;&quot;,&quot;title&quot;:&quot;&quot;,&quot;width&quot;:&quot;1200&quot;,&quot;height&quot;:&quot;1584&quot;,&quot;url&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/DIDIE_ALIAS_1794107072.jpg&quot;,&quot;caption&quot;:&quot;Didie Alias. Foto Nabila Adlina Azahari&quot;,&quot;gn4id&quot;:&quot;hm-74991150&quot;}],&quot;field_article_videos&quot;:null,&quot;field_image_listing_featured_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/deed_HMfield_image_listing_featured_v2.var_1794107079.jpg&quot;,&quot;field_image_listing_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/deed_HMfield_image_listing_v2.var_1794107082.jpg&quot;,&quot;field_image_socialmedia&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/deed_HMfield_image_socialmedia.var_1794107081.jpg&quot;,&quot;field_image_slider&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/deed_HMfield_image_slider_v2.var_1794107078.jpg&quot;,&quot;field_image_variasi&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/deed_HMfield_image_variasi_v2.var_1794107079.jpg&quot;,&quot;field_image_listing_featured&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/deed_HMfield_image_listing_featured_v2.var_1794107079.jpg&quot;,&quot;field_image_listing_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/deed_HMfield_image_listing_th.var_1794107074.jpg&quot;,&quot;field_image_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/deed_HMfield_image_th_v2.var_1794107080.jpg&quot;,&quot;field_article_state&quot;:null,&quot;field_article_lead&quot;:&quot;Kuala Lumpur : Lebih kurang tiga bulan tidak berhubung dengan sahabat baiknya yang juga pelakon Amyza Aznan, pengacara dan pelakon, Didie Alias, tidak dapat menyimpan perasaan sedih atas kemelut yang berlaku antara mereka berdua.&quot;,&quot;body&quot;:&quot;&lt;p&gt;puterialia@hmetro.com.my&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Kuala Lumpur : Lebih kurang tiga bulan tidak berhubung dengan sahabat baiknya yang juga pelakon Amyza Aznan, pengacara dan pelakon, Didie Alias, tidak dapat menyimpan perasaan sedih atas kemelut yang berlaku antara mereka berdua.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Bagaimanapun, Didie atau Fadzilah Mohd Ali, berkata Amyza lebih sesuai untuk menjelaskan keadaan sebenar tentang apa yang berlaku. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Saya agak kecewa, tetapi tidak mengapa. Mungkin dia (Amyza) ada jawapannya sendiri dan saya rasa biarlah dia yang menjawab mengenai apa yang sedang berlaku sekarang.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Saya sedih sebab kami sudah macam darah daging. Jadi, apabila kita bercakap dan kita beri nasihat, tapi kita pula dikatakan macam terlalu sibuk mengambil tahu hal orang, mungkin ada yang membenci saya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Bagi saya, saya sudah buat sehabis baik dan cuba membantu sehabis baik. Keputusan di tangan dia. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Jadi, saya terpaksa tarik 'handbrake', maksudnya urusan berkaitan anak, suami dan keluarganya, biarlah dia uruskan sendiri. Saya tidak mahu ambil tahu lagi,\&quot; katanya pada majlis pelancaran Anugerah Bintang Popular Berita Harian (ABPBH) Ke-38, di Ombak KLCC, di sini, malam tadi. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Menurut Didie, dia memilih untuk tidak mengulas lanjut bagi memastikan keadaan tidak menjadi lebih teruk. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Bagi perkara berkaitan dia, rasanya lebih baik dia jawab sendirilah dengan rakan media. Kalau tanya saya pun, jawapan ada pada dia bukan pada saya. Dia yang lebih tahu,\&quot; katanya lagi. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Bagaimanapun, pelakon yang berusia 54 tahun ini tidak serik untuk menolong individu lain yang lebih memerlukan. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Saya okey saja dan tetap teruskan. Sebenarnya dengan semua orang, saya okey. Malah, saya seronok melihat dia juga tercalon dalam kategori Aktres Pembantu TV Popular di ABPBH38,\&quot; kongsinya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Dicalonkan dalam kategori yang sama, Didie tidak menafikan wujud perasaan teruja apabila melihat rakan-rakan artis yang sudah lama berada di dalam industri seni ini turut tercalon. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Semua 'geng' lama dalam kategori sama. Rasa macam bukan nak bertanding pun, sebaliknya nak sibuk berborak.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Alhamdulillah, terima kasih kepada ABPBH. Kami yang tercalon dalam kategori Aktres Pembantu TV Popular ini semuanya 'geng-geng' lama. Maknanya, kami masih lagi relevan dalam industri ini, insya-Allah,\&quot; ujarnya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Turut dicalonkan dalam kategori berkenaan adalah Aleza Shadan, Rita Rudaini, Marisa Yasmin dan Watie Sadali selain Didie dan Amyza. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Manakala, pesaing lain adalah Arabella Allen, Azira Shafinaz, Nadia Brian dan Puteri Sarah Liyana. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Sebelum ini, ketika Amyza melalui fasa sukar selepas kehilangan anak sulungnya, Andre Mikhail, yang meninggal dunia pada Februari lalu, Didie dilihat sering berada di sisi Amyza. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Walaupun begitu, kedua-dua mereka semakin sukar dilihat bersama sehingga menimbulkan spekulasi mengenai keretakan hubungan persahabatan yang selama ini terjalin erat.&lt;\/p&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;body_with_inline&quot;:&quot;&lt;div itemprop=\&quot;articleBody\&quot; class=\&quot;dable-content-wrapper\&quot;&gt;&lt;\/p&gt;\n&lt;p&gt;Kuala Lumpur : Lebih kurang tiga bulan tidak berhubung dengan sahabat baiknya yang juga pelakon Amyza Aznan, pengacara dan pelakon, Didie Alias, tidak dapat menyimpan perasaan sedih atas kemelut yang berlaku antara mereka berdua.&lt;\/p&gt;\n&lt;p&gt;Bagaimanapun, Didie atau Fadzilah Mohd Ali, berkata Amyza lebih sesuai untuk menjelaskan keadaan sebenar tentang apa yang berlaku. &lt;\/p&gt;\n&lt;p&gt;\&quot;Saya agak kecewa, tetapi tidak mengapa. Mungkin dia (Amyza) ada jawapannya sendiri dan saya rasa biarlah dia yang menjawab mengenai apa yang sedang berlaku sekarang.&lt;\/p&gt;\n&lt;p&gt;\&quot;Saya sedih sebab kami sudah macam darah daging. Jadi, apabila kita bercakap dan kita beri nasihat, tapi kita pula dikatakan macam terlalu sibuk mengambil tahu hal orang, mungkin ada yang membenci saya.&lt;\/p&gt;\n&lt;p&gt;\&quot;Bagi saya, saya sudah buat sehabis baik dan cuba membantu sehabis baik. Keputusan di tangan dia. &lt;\/p&gt;\n&lt;p&gt;\&quot;Jadi, saya terpaksa tarik 'handbrake', maksudnya urusan berkaitan anak, suami dan keluarganya, biarlah dia uruskan sendiri. Saya tidak mahu ambil tahu lagi,\&quot; katanya pada majlis pelancaran Anugerah Bintang Popular Berita Harian (ABPBH) Ke-38, di Omb
