\/o-zani_HMfield_image_listing_v2.var_1790385427.jpg&quot;,&quot;field_image_socialmedia&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/o-zani_HMfield_image_socialmedia.var_1790385426.jpg&quot;,&quot;field_image_slider&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/o-zani_HMfield_image_slider_v2.var_1790385423.jpg&quot;,&quot;field_image_variasi&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/o-zani_HMfield_image_variasi_v2.var_1790385424.jpg&quot;,&quot;field_image_listing_featured&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/o-zani_HMfield_image_listing_featured_v2.var_1790385424.jpg&quot;,&quot;field_image_listing_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/o-zani_HMfield_image_listing_th.var_1790385419.jpg&quot;,&quot;field_image_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/o-zani_HMfield_image_th_v2.var_1790385425.jpg&quot;,&quot;field_article_state&quot;:null,&quot;field_article_lead&quot;:&quot;Puchong: Pelakon, Syazani Zikry selamat diijabkabulkan dengan pilihan hatinya, Sofiah Abu Bakar dengan sekali lafaz pada tarikh istimewa, hari ini.&quot;,&quot;body&quot;:&quot;&lt;p&gt;mohamadridzuan@hmetro.com.my &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Puchong: Pelakon, Syazani Zikry selamat diijabkabulkan dengan pilihan hatinya, Sofiah Abu Bakar dengan sekali lafaz pada tarikh istimewa, hari ini.&lt;\/p&gt;&lt;p&gt;Pasangan ini dinikahkan oleh bapa pengantin perempuan, Abu Bakar Ismail pada jam 8.43 pagi di The Square, A-Park, di sini.&lt;\/p&gt;&lt;p&gt;Pada majlis berkenaan, pelakon filem Sazali Meor Coco ini menyerahkan wang hantaran sebanyak RM20,000, manakala mas kahwin pula berupa seutas gelang emas.&lt;\/p&gt;&lt;p&gt;Pasangan itu turut bertukar dulang hantaran dengan Syazani menyediakan lima dulang, manakala Sofiah, 28, pula membalas dengan tujuh dulang.&lt;\/p&gt;&lt;p&gt;Berkongsi detik awal perkenalan mereka, Syazani atau nama sebenar Syazani Zikry Zainul Hakim, 28, berkata dia mengenali isterinya menerusi rakan universiti yang juga adalah jiran kepada isterinya.&lt;\/p&gt;&lt;p&gt;\&quot;Saya kenal dengan Sofiah melalui Amelia, 'uni-mate' saya. Mula-mula saya ternampak gambar Sofiah di Instagram Amelia dan terus minta Amelia tanyakan statusnya sebelum saya sendiri mendekati untuk berkenalan.&lt;\/p&gt;&lt;p&gt;\&quot;Rupanya mereka berdua adalah jiran,\&quot; katanya ketika ditemui selepas majlis akad nikah berkenaan.&lt;\/p&gt;&lt;p&gt;Menurutnya, proses untuk mengenali Sofiah mengambil sedikit masa sebelum hubungan mereka menjadi lebih serius.&lt;\/p&gt;&lt;p&gt;Katanya, mereka mula berkenalan pada Januari 2025 dan selepas kira-kira 10 bulan, dia memberanikan diri untuk bertanya sama ada Sofiah bersedia untuk mendirikan rumah tangga bersamanya.&lt;\/p&gt;&lt;p&gt;\&quot;Hasrat untuk saya berkahwin memang sudah ada, tetapi tidak sangka ia datang seawal ini. Sewaktu mengenali Sofiah, saya terdetik hati untuk terus bertanya jika dia mahu berkahwin selepas 10 bulan berkenalan,\&quot; katanya.&lt;\/p&gt;&lt;p&gt;Pasangan terbabit merancang untuk berbulan madu pada penghujung tahun ini, mengambil kira komitmen kerja yang perlu diselesaikan.&lt;\/p&gt;&lt;p&gt;Syazani berkata, Sofiah teringin untuk berkunjung ke Montenegro, namun mereka masih belum membuat keputusan mengenai destinasi bulan madu.&lt;\/p&gt;&lt;p&gt;Bagaimanapun, sehari selepas majlis pernikahan, pasangan itu akan berlepas ke Vietnam untuk percutian singkat.&lt;\/p&gt;&lt;p&gt;\&quot;Ini bukan dikira 'honeymoon' tetapi sekadar 'short getaway' untuk release kan stress,\&quot; katanya.&lt;\/p&gt;&lt;p&gt;Menyentuh mengenai kerjaya seninya selepas bergelar suami, Syazani berkata, Sofiah adalah individu yang sangat memahami tuntutan kerjaya dan tidak pernah menghalang perjalanan seninya.&lt;\/p&gt;&lt;p&gt;\&quot;Alhamdulillah, Sofiah seorang yang sangat memahami kehendak kerja saya dan tidak pernah menghalang apa-apa.&lt;\/p&gt;&lt;p&gt;\&quot;Saya akan teruskan perjuangan karier seni saya seperti biasa dengan matlamat yang lebih besar. Perjalanan saya masih jauh,\&quot; katanya.&lt;\/p&gt;&lt;p&gt;Ditanya mengenai perancangan cahaya mata, Syazani berkata, mereka belum menetapkan sebarang perancangan buat masa ini kerana mahu memberi tumpuan kepada kerjaya masing-masing.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;body_with_inline&quot;:&quot;&lt;div itemprop=\&quot;articleBody\&quot; class=\&quot;dable-content-wrapper\&quot;&gt;&lt;\/p&gt;\n&lt;p&gt;Puchong: Pelakon, Syazani Zikry selamat diijabkabulkan dengan pilihan hatinya, Sofiah Abu Bakar dengan sekali lafaz pada tarikh istimewa, hari ini.&lt;\/p&gt;\n&lt;p&gt;Pasangan ini dinikahkan oleh bapa pengantin perempuan, Abu Bakar Ismail pada jam 8.43 pagi di The Square, A-Park, di sini.&lt;\/p&gt;\n&lt;p&gt;Pada majlis berkenaan, pelakon filem Sazali Meor Coco ini menyerahkan wang hantaran sebanyak RM20,000, manakala mas kahwin pula berupa seutas gelang emas.&lt;\/p&gt;\n&lt;p&gt;Pasangan itu turut bertukar dulang hantaran dengan Syazani menyediakan lima dulang, manakala Sofiah, 28, pula membalas dengan tujuh dulang.&lt;\/p&gt;\n&lt;p&gt;Berkongsi detik awal perkenalan mereka, Syazani atau nama sebenar Syazani Zikry Zainul Hakim, 28, berkata dia mengenali isterinya menerusi rakan universiti yang juga adalah jiran kepada isterinya.&lt;\/p&gt;\n&lt;p&gt;\&quot;Saya kenal dengan Sofiah melalui Amelia, 'uni-mate' saya. Mula-mula saya ternampak gambar Sofiah di Instagram Amelia dan terus minta Amelia tanyakan statusnya sebelum saya sendiri mendekati untuk berkenalan.&lt;\/p&gt;\n&lt;p&gt;\&quot;Rupanya mereka berdua adalah jiran,\&quot; katanya ketika ditemui selepas majlis akad nikah berkenaan.&lt;\/p&gt;\n&lt;p&gt;Menurutnya, proses untuk mengenali Sofiah mengambil sedikit masa sebelum hubungan mereka menjadi lebih serius.&lt;\/p&gt;\n&lt;p&gt;Katanya, mereka mula berkenalan pada Januari 2025 dan selepas kira-kira 10 bulan, dia me
