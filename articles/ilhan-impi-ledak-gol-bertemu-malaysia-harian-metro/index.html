itu sudah mempunyai memori manis ketika berdepan Malaysia apabila menjaringkan gol dalam kekalahan 1-2 Singapura kepada Harimau Malaya pada perlawanan persahabatan antarabangsa, 4 September 2025.&lt;\/p&gt;&lt;p&gt;Kini, Ilhan kembali berdepan Malaysia dalam perlawanan yang jauh lebih penting apabila Singapura perlu meraih kemenangan untuk membuka peluang mara ke pusingan seterusnya.&lt;\/p&gt;&lt;p&gt;Ilhan mengakui pertemuan dengan Malaysia sentiasa mempunyai makna tersendiri buat Singapura dan menyifatkannya sebagai antara perlawanan terbesar dalam kalendar bola sepak negara itu.&lt;\/p&gt;&lt;p&gt;\"Ya, sudah tentu. Setiap kali kami menentang Malaysia, kami sentiasa menganggapnya sebagai derbi, bukan? Berdepan mereka sentiasa menjadi perlawanan besar,\" katanya.&lt;\/p&gt;&lt;p&gt;Namun, Ilhan tidak mahu terlalu memikirkan pencapaian peribadi sebaliknya meletakkan kepentingan pasukan sebagai keutamaan ketika Singapura memburu kemenangan di Bandung.&lt;\/p&gt;&lt;p&gt;\"Saya juga menantikannya. Tetapi perkara utama adalah saya perlu mengutamakan kepentingan dan harapan pasukan. Jika saya menjaringkan gol dan pasukan mara, sudah tentu saya gembira.&lt;\/p&gt;&lt;p&gt;\"Namun, jika saya tidak menjaringkan gol dan kami tetap layak, saya juga akan sama gembira,\" katanya.&lt;\/p&gt;&lt;p&gt;Ilhan masih belum menemui sasaran dalam kempen Piala ASEAN FIFA kali ini dan mengakui dirinya berharap detik itu hadir secepat mungkin, namun kejayaan pasukan tetap menjadi keutamaannya.&lt;\/p&gt;&lt;p&gt;\"Saya sentiasa percaya segala-galanya berlaku dengan sebab tertentu dan saya meletakkan kepercayaan kepada Allah. Insya-Allah, gol itu akan datang tidak lama lagi. Saya berharap dapat menjaringkannya secepat mungkin,\" katanya.&lt;\/p&gt;&lt;p&gt;Singapura kini mempunyai tiga mata selepas menewaskan Bangladesh 1-0, manakala Malaysia mengumpul empat mata selepas seri tanpa jaringan dengan Indonesia, sekali gus menjadikan pertemuan kedua-dua pasukan itu cukup penting dalam penentuan Kumpulan A.&lt;\/p&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;\/p&gt;\n&lt;p&gt;Bandung: Penyerang Singapura, Ilhan Fandi, mengintai peluang untuk meledak gol pertama dalam Piala ASEAN FIFA 2026 apabila berdepan Harimau Malaya dalam aksi terakhir Kumpulan A di Stadium Si Jalak Harupat, esok.&lt;\/p&gt;\n&lt;p&gt;Pemain berusia 23 tahun itu sudah mempunyai memori manis ketika berdepan Malaysia apabila menjaringkan gol dalam kekalahan 1-2 Singapura kepada Harimau Malaya pada perlawanan persahabatan antarabangsa, 4 September 2025.&lt;\/p&gt;\n&lt;p&gt;Kini, Ilhan kembali berdepan Malaysia dalam perlawanan yang jauh lebih penting apabila Singapura perlu meraih kemenangan untuk membuka peluang mara ke pusingan seterusnya.&lt;\/p&gt;\n&lt;p&gt;Ilhan mengakui pertemuan dengan Malaysia sentiasa mempunyai makna tersendiri buat Singapura dan menyifatkannya sebagai antara perlawanan terbesar dalam kalendar bola sepak negara itu.&lt;\/p&gt;\n&lt;p&gt;\"Ya, sudah tentu. Setiap kali kami menentang Malaysia, kami sentiasa menganggapnya sebagai derbi, bukan? Berdepan mereka sentiasa menjadi perlawanan besar,\" katanya.&lt;\/p&gt;\n&lt;p&gt;Namun, Ilhan tidak mahu terlalu memikirkan pencapaian peribadi sebaliknya meletakkan kepentingan pasukan sebagai keutamaan ketika Singapura memburu kemenangan di Bandung.&lt;\/p&gt;\n&lt;p&gt;\"Saya juga menantikannya. Tetapi perkara utama adalah saya perlu mengutamakan kepentingan dan harapan pasukan. Jika saya menjaringkan gol dan pasukan mara, sudah tentu saya gembira.&lt;\/p&gt;\n&lt;p&gt;\"Namun, jika saya tidak menjaringkan gol dan kami tetap layak, saya juga akan sama gembira,\" katanya.&lt;\/p&gt;\n&lt;p&gt;Ilhan masih belum menemui sasaran dalam kempen Piala ASEAN FIFA kali ini dan mengakui dirinya berharap detik itu hadir secepat mungkin, namun kejayaan pasukan tetap menjadi keutamaannya.&lt;\/p&gt;\n&lt;p&gt;\"Saya sentiasa percaya segala-galanya berlaku dengan sebab tertentu dan saya meletakkan kepercayaan kepada Allah. Insya-Allah, gol itu akan datang tidak lama lagi. Saya berharap dapat menjaringkannya secepat mungkin,\" katanya.&lt;\/p&gt;\n&lt;p&gt;Singapura kini mempunyai tiga mata selepas menewaskan Bangladesh 1-0, manakala Malaysia mengumpul empat mata selepas seri tanpa jaringan dengan Indonesia, sekali gus menjadikan pertemuan kedua-dua pasukan itu cukup penting dalam penentuan Kumpulan A.&lt;\/p&gt;\n&lt;\/div&gt;","word_count":276,"og_description":"Bandung: Penyerang Singapura, Ilhan Fandi, mengintai peluang untuk meledak gol pertama dalam Piala ASEAN FIFA 2026 apabila berdepan Harimau Malaya dalam aksi terakhir Kumpulan A di Stadium Si Jalak Harupat, esok."}' :nid="1417197" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_instream_player&amp;description_url=https%3A%2F%2Fwww.hmetro.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;vid_d=6000&amp;unviewed_position_start=1&amp;output=xml_vast2&amp;ad_rule=1&amp;env=vp&amp;impl=s&amp;correlator=" :is-sponsered="false"></article-component>
