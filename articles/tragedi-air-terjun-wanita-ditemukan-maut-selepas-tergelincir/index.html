les\/for-hanyut-o_HMfield_image_variasi_v2.var_1792217004.jpg","field_image_listing_featured":"https:\/\/assets.hmetro.com.my\/images\/articles\/for-hanyut-o_HMfield_image_listing_featured_v2.var_1792217004.jpg","field_image_listing_th":"https:\/\/assets.hmetro.com.my\/images\/articles\/for-hanyut-o_HMfield_image_listing_th.var_1792216999.jpg","field_image_th":"https:\/\/assets.hmetro.com.my\/images\/articles\/for-hanyut-o_HMfield_image_th_v2.var_1792217005.jpg","field_article_state":null,"field_article_lead":"Padang: Seorang wanita maut selepas tergelincir dan terjatuh ketika mandi di Air Terjun Robo Harau, Wilayah Limapuluh Kota, Sumatera Barat, Indonesia, Khamis lalu, lapor Detik.","body":"&lt;p \/&gt;&lt;p&gt;Padang: Seorang wanita maut selepas tergelincir dan terjatuh ketika mandi di Air Terjun Robo Harau, Wilayah Limapuluh Kota, Sumatera Barat, Indonesia, Khamis lalu, lapor Detik.&lt;\/p&gt;&lt;p&gt;Wanita itu, Windy Rahma Putri, 25, ditemukan meninggal dunia oleh pasukan mencari dan menyelamat (SAR) gabungan pada jam 10.45 pagi, Jumaat, semalam.&lt;\/p&gt;&lt;p&gt;Ketua Pejabat Pencarian dan Pertolongan Kelas A Padang, Abdul Malik berkata, pihaknya menerima laporan mengenai kejadian itu kira-kira jam 5.27 petang, Khamis lalu.&lt;\/p&gt;&lt;p&gt;Menurutnya, kejadian dipercayai berlaku sekitar jam 3.45 petang ketika mangsa mandi di air terjun berkenaan.&lt;\/p&gt;&lt;p&gt;\"Mangsa tergelincir ketika mandi di Air Terjun Robo, Nagari Harau, Wilayah Limapuluh Kota dan dipercayai lemas sebelum dihanyutkan arus,\" katanya.&lt;\/p&gt;&lt;p&gt;Video kejadian mangsa tergelincir dan terjatuh dari tempat tinggi turut tersebar meluas di media sosial.&lt;\/p&gt;&lt;p&gt;Dalam pada itu, Abdul Malik berkata, susulan laporan diterima, pasukan SAR menjalankan operasi pencarian dalam lingkungan radius kira-kira 570 meter (m) dari lokasi kejadian.&lt;\/p&gt;&lt;p&gt;\"Mangsa ditemukan dalam keadaan meninggal dunia pada jam 10.45 pagi dan pasukan segera menjalankan operasi membawa keluar mayat mangsa,\" katanya.&lt;\/p&gt;&lt;p&gt;Mayat mangsa kemudian diserahkan kepada keluarganya untuk urusan pengebumian.&lt;\/p&gt;&lt;p \/&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;p&gt;Padang: Seorang wanita maut selepas tergelincir dan terjatuh ketika mandi di Air Terjun Robo Harau, Wilayah Limapuluh Kota, Sumatera Barat, Indonesia, Khamis lalu, lapor Detik.&lt;\/p&gt;\n&lt;p&gt;Wanita itu, Windy Rahma Putri, 25, ditemukan meninggal dunia oleh pasukan mencari dan menyelamat (SAR) gabungan pada jam 10.45 pagi, Jumaat, semalam.&lt;\/p&gt;\n&lt;p&gt;Ketua Pejabat Pencarian dan Pertolongan Kelas A Padang, Abdul Malik berkata, pihaknya menerima laporan mengenai kejadian itu kira-kira jam 5.27 petang, Khamis lalu.&lt;\/p&gt;\n&lt;p&gt;Menurutnya, kejadian dipercayai berlaku sekitar jam 3.45 petang ketika mangsa mandi di air terjun berkenaan.&lt;\/p&gt;\n&lt;p&gt;\"Mangsa tergelincir ketika mandi di Air Terjun Robo, Nagari Harau, Wilayah Limapuluh Kota dan dipercayai lemas sebelum dihanyutkan arus,\" katanya.&lt;\/p&gt;\n&lt;p&gt;Video kejadian mangsa tergelincir dan terjatuh dari tempat tinggi turut tersebar meluas di media sosial.&lt;\/p&gt;\n&lt;p&gt;Dalam pada itu, Abdul Malik berkata, susulan laporan diterima, pasukan SAR menjalankan operasi pencarian dalam lingkungan radius kira-kira 570 meter (m) dari lokasi kejadian.&lt;\/p&gt;\n&lt;p&gt;\"Mangsa ditemukan dalam keadaan meninggal dunia pada jam 10.45 pagi dan pasukan segera menjalankan operasi membawa keluar mayat mangsa,\" katanya.&lt;\/p&gt;\n&lt;p&gt;Mayat mangsa kemudian diserahkan kepada keluarganya untuk urusan pengebumian.&lt;\/p&gt;\n&lt;\/div&gt;","word_count":167,"og_description":"Padang: Seorang wanita maut selepas tergelincir dan terjatuh ketika mandi di Air Terjun Robo Harau, Wilayah Limapuluh Kota, Sumatera Barat, Indonesia, Khamis lalu, lapor Detik."}' :nid="142416
