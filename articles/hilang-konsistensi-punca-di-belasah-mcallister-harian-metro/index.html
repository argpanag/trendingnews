uot;hm-75019076&quot;}],&quot;field_article_images_filtered&quot;:[{&quot;fid&quot;:&quot;8484027&quot;,&quot;uid&quot;:&quot;9&quot;,&quot;filename&quot;:&quot;McAllister_1794201710.jpg&quot;,&quot;uri&quot;:&quot;gs:\/\/images\/articles\/McAllister_1794201710.jpg&quot;,&quot;filemime&quot;:&quot;image\/jpeg&quot;,&quot;filesize&quot;:&quot;107208&quot;,&quot;status&quot;:&quot;1&quot;,&quot;timestamp&quot;:&quot;1794201710&quot;,&quot;uuid&quot;:&quot;1eebe0f7-80c9-4967-a5b7-5c5a38f5915a&quot;,&quot;rdf_mapping&quot;:[],&quot;alt&quot;:&quot;&quot;,&quot;title&quot;:&quot;&quot;,&quot;width&quot;:&quot;1200&quot;,&quot;height&quot;:&quot;630&quot;,&quot;url&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/McAllister_1794201710.jpg&quot;,&quot;caption&quot;:&quot;Pengendali DPMM FC, James McAllister.&quot;,&quot;gn4id&quot;:&quot;hm-75019076&quot;}],&quot;field_article_videos&quot;:null,&quot;field_image_listing_featured_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-dpmm091126_HMfield_image_listing_featured_v2.var_1794201717.jpg&quot;,&quot;field_image_listing_v2&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-dpmm091126_HMfield_image_listing_v2.var_1794201719.jpg&quot;,&quot;field_image_socialmedia&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-dpmm091126_HMfield_image_socialmedia.var_1794201718.jpg&quot;,&quot;field_image_slider&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-dpmm091126_HMfield_image_slider_v2.var_1794201715.jpg&quot;,&quot;field_image_variasi&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-dpmm091126_HMfield_image_variasi_v2.var_1794201716.jpg&quot;,&quot;field_image_listing_featured&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-dpmm091126_HMfield_image_listing_featured_v2.var_1794201717.jpg&quot;,&quot;field_image_listing_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-dpmm091126_HMfield_image_listing_th.var_1794201711.jpg&quot;,&quot;field_image_th&quot;:&quot;https:\/\/assets.hmetro.com.my\/images\/articles\/spo-o-dpmm091126_HMfield_image_th_v2.var_1794201718.jpg&quot;,&quot;field_article_state&quot;:null,&quot;field_article_lead&quot;:&quot;Johor Bahru: Pengendali DPMM FC, James McAllister menyifatkan kekalahan besar 1-6 kepada Johor Darul Ta'zim (JDT) dalam aksi timbal balik separuh akhir kedua Piala FA cukup mengecewakan malah ia bagaikan `peringatan' buat anak buanya supaya tidak hilang fokus serta struktur pertahanan di hujung permainan.&quot;,&quot;body&quot;:&quot;&lt;p&gt;sukan@hmetro.com.my&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Johor Bahru: Pengendali DPMM FC, James McAllister menyifatkan kekalahan besar 1-6 kepada Johor Darul Ta'zim (JDT) dalam aksi timbal balik separuh akhir kedua Piala FA cukup mengecewakan malah ia bagaikan `peringatan' buat anak buanya supaya tidak hilang fokus serta struktur pertahanan di hujung permainan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Menurut pengendali kelahiran Scotland itu, barisan pemainnya beraksi dengan baik sepanjang 55 hingga 60 minit perlawanan malah berjaya menyamakan kedudukan pada awal babak kedua sehingga mampu menyentap konsistensi rentak permainan skuad kendalian Xisco Munoz buat seketika.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Pada separuh masa pertama, kami bertahan dengan sangat baik dan mengehadkan peluang pasukan lawan, malah, kami juga mencipta beberapa peluang berharga.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Namun apabila berada di tahap ini, kita perlu lebih tajam menyempurnakan peluang yang ada malah tidak boleh membiarkan pasukan lawan mudah menguasai permainan,\&quot; katanya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Mengulas mengenai babak kedua, McAllister menegaskan beliau mengarahkan para pemainnya beraksi lebih agresif dan berani menekan lawan di kawasan tinggi, yang mana taktik tersebut membuahkan hasil menerusi jaringan penyamaan.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Namun, katanya, selepas skuad Harimau Selatan kembali berada di hadapan, aksi pasukan seakan hilang arah dan mengekalkan disiplin taktikal menyebabkan JDT berjaya menambah jaringan dengan mudah.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Selepas melepaskan gol kedua yang agak 'lembut', kami kehilangan struktur pertahanan. Pemain mula melakukan pressing secara individu dan kerap keluar dari posisi. &lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Apabila menentang pasukan berkualiti seperti JDT dan melakukan kesilapan seperti ini, anda akan terus dihukum dan itulah yang berlaku dalam tempoh 25 hingga 30 minit terakhir,\&quot; katanya.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;McAllister bagaimanapun kekal optimis serta bangga dengan komitmen yang ditunjukkan oleh anak-anak buahnya sepanjang musim ini, sambil menyifatkan jurang antara pasukannya dengan kelab gergasi liga kini semakin rapat.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\&quot;Kami telah memberi tentangan sengit kepada pasukan terbaik liga. Ia satu peringatan bahawa kita perlu sentiasa melakukan perkara asas dengan baik, `game management'  dan mengekalkan struktur yang mantap,\&quot; ujar McAllister.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;&quot;,&quot;body_with_inline&quot;:&quot;&lt;div itemprop=\&quot;articleBody\&quot; class=\&quot;dable-content-wrapper\&quot;&gt;&lt;\/p&gt;\n&lt;p&gt;Johor Bahru: Pengendali DPMM FC, James McAllister menyifatkan kekalahan besar 1-6 kepada Johor Darul Ta'zim (JDT) dalam aksi timbal balik separuh akhir kedua Piala FA cukup mengecewakan malah ia bagaikan `peringatan' buat anak buanya supaya tidak hilang fokus serta struktur pertahanan di hujung permainan.&lt;\/p&gt;\n&lt;p&gt;Menurut pengendali kelahiran Scotland itu, barisan pemainnya beraksi dengan baik sepanjang 55 hingga 60 minit perlawanan malah berjaya menyamakan kedudukan pada awal babak kedua sehingga mampu menyentap konsistensi rentak permainan skuad kendalian Xisco Munoz buat seketika.&lt;\/p&gt;\n&lt;p&gt;\&quot;Pada separuh masa pertama, kami bertahan dengan sangat baik dan mengehadkan peluang pasukan lawan, malah, kami juga mencipta beberapa peluang berharga.&lt;\/p&gt;\n&lt;p&gt;\&quot;Namun apabila berada di tahap ini, kita perlu lebih tajam menyempurnakan peluang yang ada malah tidak boleh membiarkan pasukan lawan mudah menguasai permainan,\&quot; katanya.&lt;\/p&gt;\n&lt;p&gt;Mengulas mengenai babak kedua, McAllister menegaskan beliau mengarahkan para pemainnya beraksi lebih agresif dan berani menekan lawan di kawasan tinggi, yang mana taktik tersebut membuahkan hasil menerusi jaringan penyamaan.&lt;\/p&gt;\n&lt;p&gt;Namun, katanya, selepas skuad Harimau Selatan kembali berada di hadapan, aksi pasukan seakan hilang arah dan mengekalkan disiplin taktikal menyebabkan JDT berjaya menambah jaringan dengan mudah.&lt;\/p&gt;\n&lt;p&gt;\&quot;Selepas melepaskan gol kedua yang agak 'lembut', kami kehilangan struktur pertahanan. Pemain mula melakukan pressing secara individu dan kerap keluar dari posisi. &lt;\/p&gt;\n&lt;p&gt;\&quot;Apabila menentang pasukan berkualiti seperti JDT dan melakukan kesilapan seperti ini, anda akan terus dihukum dan itulah yang berlaku dalam tempoh 25 hingga 30 minit terakhir,\&quot; katanya.&lt;\/p&gt;\n&lt;p&gt;McAllister bagaimanapun kekal optimis serta bangga dengan komitmen yang ditunjukkan oleh anak-anak buahnya sepanjang musim ini, sambil menyifatkan jurang antara pasukannya dengan kelab gergasi liga kini semakin rapat.&lt;\/p&gt;\n&lt;p&gt;\&quot;Kami telah memberi tentangan sengit kepada pasukan terbaik liga. Ia satu peringatan bahawa kita perlu sentiasa melakukan perkara asas dengan baik, `game management'  dan mengekalkan struktur yang mantap,\&quot; ujar McAllister.&lt;\/p&gt;\n&lt;\/div&gt;&quot;,&quot;word_count&quot;:286,&quot;og_description&quot;:&quot;Johor Bahru: Pengendali DPMM FC, James McAllister menyifatkan kekalahan besar 1-6 kepada Johor Darul Ta'zim (JDT) dalam aksi timbal balik separuh akhir kedua Piala FA cukup mengecewakan malah ia bagaikan `peringatan' buat anak buanya supaya tidak hilang fokus serta struktur pertahanan di hujung permainan.&quot;}" :nid="1434022" bitmovin="disabled" bitmovin_key="34a49c54-19ea-45e1-a196-cda7e07caeb3" bitmovin_adurl="https://pubads.g.doubleclick.net/gampad/ads?iu=/1009103/HM_instream_player&amp;description_url=https%3A%2F%2Fwww.hmetro.com.my%2F&amp;tfcd=0&amp;npa=0&amp;sz=640x360&amp;gdfp_req=1&amp;vid_d=6000&amp;unviewed_position_start=1&amp;output=xml_vast2&amp;ad_rule=1&amp;env=vp&amp;impl=s&amp;correlator=" :is-sponsered="false"></article-component>
