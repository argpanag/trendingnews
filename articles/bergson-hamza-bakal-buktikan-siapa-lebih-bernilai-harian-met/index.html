&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;Jakarta: Harga boleh berbeza hampir 12 kali ganda, namun nilai sebenar Bergson da Silva dan Hamza Choudhury hanya akan terjawab apabila kedua-duanya turun ke padang dalam aksi pembukaan Piala ASEAN FIFA 2026 membabitkan Malaysia dan Bangladesh di Stadium Bung Karno, di sini, esok.&lt;\/p&gt;&lt;p&gt;Bergson yang dinilai \u20ac325,000 (sekitar RM1.5 juta) oleh Transfermarkt bakal menjadi antara sandaran Harimau Malaya di depan gawang, manakala Hamza dengan nilai \u20ac4 juta (RM18.7 juta) dijangka menjadi antara pemain utama Bangladesh untuk mengawal kawasan tengah.&lt;\/p&gt;&lt;p&gt;Perbezaan nilai pasaran itu cukup ketara, namun dilihat kedua-dua pemain mempunyai tugas yang sama penting apabila masing-masing mempengaruhi perjalanan perlawanan dalam usaha ke pentas final.&lt;\/p&gt;&lt;p&gt;Bergson, 35, mempunyai satu senjata yang cukup dikenali iaitu naluri menjaringkan gol terutamanya sejak menyertai JDT pada 2021, penyerang kelahiran Brazil itu membina reputasi sebagai antara penyudah utama dalam bola sepak Malaysia.&lt;\/p&gt;&lt;p&gt;Musim lalu menjadi antara bukti ketajaman Bergson apabila dia meledak 27 gol dalam Liga Super Malaysia, selain terus menjadi sebahagian daripada jentera serangan JDT musim ini.&lt;\/p&gt;&lt;p&gt;Kini pengalaman Bergson di Malaysia diterjemahkan ke pentas antarabangsa selepas dia mendapat kelayakan untuk mewakili Harimau Malaya.&lt;\/p&gt;&lt;p&gt;Bagi Bangladesh pula, Hamza hadir dengan pakej berbeza. Pemain berusia 28 tahun itu dibentuk dalam sistem bola sepak England dan menghabiskan sebahagian besar kariernya bersama Leicester City sebelum berpindah secara tetap ke Sheffield United pada 31 Ogos lalu.&lt;\/p&gt;&lt;p&gt;Sebagai pemain tengah bertahan, Hamza mempunyai tugas memutuskan serangan, memenangi perebutan bola dan memberikan perlindungan kepada barisan pertahanan Bangladesh.&lt;\/p&gt;&lt;p&gt;Lebih menarik, pengalaman Hamza di England bukan sekadar kisah masa lalu apabila dia kini meneruskan karier bersama Sheffield United dalam Liga Kejuaraan dengan kontrak sehingga 30 Jun 2027.&lt;\/p&gt;&lt;p&gt;Di sinilah pertembungan kedua-dua pemain itu menjadi menarik kerana Bergson memerlukan ruang dan bekalan untuk menguji pertahanan Bangladesh, sedangkan Hamza pula antara pemain yang bertanggungjawab memastikan ruang itu tidak mudah diberikan.&lt;\/p&gt;&lt;p&gt;Jika Hamza berjaya menguasai kawasan tengah, aliran bola kepada Bergson boleh disekat. Namun, sekiranya Harimau Malaya mampu melepasi kawalan pemain itu dan memberi Bergson peluang di dalam kotak penalti, pengalaman penyerang berkenaan boleh menjadi ancaman besar kepada Bangladesh.&lt;\/p&gt;&lt;p&gt;Justeru, ketika perhatian tertumpu kepada aksi pertama Harimau Malaya dalam kejohanan sulung Piala ASEAN FIFA itu, Bergson dan Hamza boleh menjadi dua nama yang menentukan siapa lebih selesa mengawal perlawanan di Stadium Gelora Bung Karno, petang esok.&lt;\/p&gt;&lt;p \/&gt;&lt;p&gt;\u00a9 New Straits Times Press (M) Bhd&lt;\/p&gt;","body_with_inline":"&lt;div itemprop=\"articleBody\" class=\"dable-content-wrapper\"&gt;&lt;\/p&gt;\n&lt;p&gt;Jakarta: Harga boleh berbeza hampir 12 kali ganda, namun nilai sebenar Bergson da Silva dan Hamza Choudhury hanya akan terjawab apabila kedua-duanya turun ke padang dalam aksi pembukaan Piala ASEAN FIFA 2026 membabitkan Malaysia dan Bangladesh di Stadium Bung Karno, di sini, esok.&lt;\/p&gt;\n&lt;p&gt;Bergson yang dinilai \u20ac325,000 (sekitar RM1.5 juta) oleh Transfermarkt bakal menjadi antara sandaran Harimau Malaya di depan gawang, manakala Hamza dengan nilai \u20ac4 juta (RM18.7 juta) dijangka menjadi antara pemain utama Bangladesh untuk mengawal kawasan tengah.&lt;\/p&gt;\n&lt;p&gt;Perbezaan nilai pasaran itu cukup ketara, namun dilihat kedua-dua pemain mempunyai tugas yang sama penting apabila masing-masing mempengaruhi perjalanan perlawanan dalam usaha ke pentas final.&lt;\/p&gt;\n&lt;p&gt;Bergson, 35, mempunyai satu senjata yang cukup dikenali iaitu nalur
